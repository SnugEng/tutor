<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Card Deck · SE</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700;800&display=swap');
:root{
  --bg:#12111e;--surf:#1d1b2e;--bord:#2e2c46;
  --acc:#e8b84b;--txt:#f0eff8;--dim:#7a798f;
  --grn:#3db88a;--red:#d9547a;
  --front:#fdfcf5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);touch-action:manipulation}
.scr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;flex-direction:column}
.scr.on{display:flex;flex-direction:column}

#sLobby{overflow-y:auto;flex-direction:column;align-items:center;padding:28px 16px 60px;background:radial-gradient(ellipse at 20% 10%,#7b2fff22,transparent 50%),radial-gradient(ellipse at 80% 90%,#4cc9f018,transparent 50%),var(--bg)}
.logo{font-family:'DM Serif Display',serif;font-size:clamp(2rem,7vw,3.2rem);color:var(--acc);text-align:center;letter-spacing:-1px;text-shadow:0 0 40px rgba(247,201,72,.3)}
.logo-sub{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);text-align:center;margin-top:4px;margin-bottom:22px}
.lcard{background:var(--surf);border:1px solid var(--bord);border-radius:18px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
.lbl{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpill{padding:9px;border-radius:9px;border:1.5px solid var(--bord);background:#16213e;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:.74rem;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.tpill.sel{border-color:var(--acc);background:rgba(247,201,72,.14);color:var(--txt)}
.count-row{display:flex;gap:6px;flex-wrap:wrap}
.cpill{padding:7px 14px;border-radius:9px;border:1.5px solid var(--bord);background:#16213e;color:var(--dim);font-family:'DM Mono',monospace;font-size:.76rem;cursor:pointer;transition:all .2s}
.cpill.sel{border-color:var(--acc);background:rgba(247,201,72,.14);color:var(--acc)}
.prow{display:flex;align-items:center;gap:7px;background:#16213e;border:1.5px solid var(--bord);border-radius:10px;padding:7px 10px;margin-bottom:5px}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--bord);background:var(--bg);flex-shrink:0;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pname{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:700;min-width:0}
.pname::placeholder{color:var(--dim);font-weight:400}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.prmv{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.78rem;padding:3px;flex-shrink:0}
.addp{background:#16213e;border:1px dashed var(--bord);border-radius:9px;padding:8px;color:var(--dim);font-size:.76rem;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;transition:all .2s}
.addp:hover{border-color:var(--acc);color:var(--acc)}
.startbtn{background:linear-gradient(135deg,#f7c948,#ff9f1c);border:none;border-radius:12px;padding:14px;color:#0f0e17;font-family:'DM Serif Display',serif;font-size:1rem;cursor:pointer;box-shadow:0 4px 24px rgba(247,201,72,.35);transition:transform .15s}
.startbtn:active{transform:translateY(1px)}

#sTable{overflow:hidden;background:#0a0913}

.tbar{background:#0a0913;border-bottom:1px solid var(--bord);padding:6px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:46px;overflow:hidden}
.tbar-title{font-family:'DM Serif Display',serif;font-size:.85rem;color:var(--acc);flex-shrink:0;display:none}
.schips{display:flex;gap:4px;flex:1;overflow-x:auto;min-width:0;justify-content:center;align-items:center;padding:2px 0;scrollbar-width:none;-ms-overflow-style:none}
.schip{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 5px;border-radius:24px;background:#1e1c2e;border:2px solid var(--bord);font-weight:700;white-space:nowrap;flex-shrink:1;min-width:0;max-width:140px;transition:all .35s cubic-bezier(.34,1.56,.64,1);position:relative}
.schip.cur{border-color:var(--acc);background:rgba(232,184,75,.12);box-shadow:0 0 12px rgba(232,184,75,.35);transform:scale(1.08)}
.schip-av{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;display:block}
.schip-name{font-family:'DM Sans',sans-serif;font-size:clamp(.58rem,.9vw,.78rem);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ssc{font-family:'DM Mono',monospace;font-size:.78rem;font-weight:900;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.1);flex-shrink:0}
.ssc.p{color:#3db88a}.ssc.n{color:#d9547a}.ssc.z{color:var(--dim)}


.score-pop{position:fixed;pointer-events:none;font-family:'DM Mono',monospace;font-weight:900;font-size:1.2rem;z-index:9998;animation:scorePop 1.1s ease forwards;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.score-pop.pos{color:#06d6a0}.score-pop.neg{color:#f72585}
@keyframes scorePop{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1;transform:translateY(-14px) scale(1.5)}70%{opacity:1;transform:translateY(-40px) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.6)}}

.tbar-right{display:flex;gap:5px;flex-shrink:0}
.tbtn{padding:4px 9px;border-radius:6px;border:1.5px solid var(--bord);background:transparent;color:var(--dim);font-size:.64rem;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s;white-space:nowrap}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}
.tbtn.rd{border-color:#7f1d1d;color:#fca5a5}.tbtn.rd:hover{background:#7f1d1d;color:#fff}


#cardGrid{flex:1;display:grid;gap:8px;padding:8px;overflow:hidden}

.tc{background:linear-gradient(145deg,#1a1930,#14203a);border:2px solid var(--bord);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;width:100%;height:100%;transition:border-color .2s,box-shadow .22s,transform .2s,background .2s}
.tc::before{content:'';position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(45deg,transparent,transparent 12px,rgba(255,255,255,.018) 12px,rgba(255,255,255,.018) 24px)}
.tc:hover{border-color:var(--acc);box-shadow:0 0 24px rgba(232,184,75,.4),0 6px 20px rgba(0,0,0,.5);transform:translateY(-3px) scale(1.03);background:linear-gradient(145deg,#22203d,#192840)}
.tc:active{transform:translateY(-1px) scale(.99)}
.tc.done{opacity:.18;pointer-events:none;filter:grayscale(1)}
.tc-num{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,5vw,5.5rem);color:rgba(255,255,255,.88);z-index:1;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.5);transition:color .2s,transform .2s}
.tc-pts{font-family:'DM Mono',monospace;font-size:clamp(.65rem,1.4vw,1rem);color:rgba(255,255,255,.4);z-index:1;margin-top:2px;font-weight:700}
.tc:hover .tc-num{color:#fff;transform:scale(1.06)}

#sCard{z-index:100;overflow:hidden;background:var(--front)}

.card-player-bar{background:#0a0913;border-bottom:1px solid var(--bord);padding:5px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:46px}
.card-schips{display:flex;gap:4px;flex:1;overflow-x:auto;justify-content:center;align-items:center;scrollbar-width:none}
.card-schip{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 5px;border-radius:20px;background:#1e1c2e;border:2px solid var(--bord);font-weight:700;white-space:nowrap;flex-shrink:1;min-width:0;max-width:140px;transition:all .3s}
.card-schip.cur{border-color:var(--acc);background:rgba(232,184,75,.12);box-shadow:0 0 10px rgba(232,184,75,.35);transform:scale(1.06)}
.card-schip-av{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;display:block}
.card-schip-name{font-size:clamp(.58rem,.85vw,.72rem);font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.card-schip-score{font-family:'DM Mono',monospace;font-size:.75rem;font-weight:900;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1);flex-shrink:0}
.card-schip-score.p{color:#3db88a}.card-schip-score.n{color:#d9547a}.card-schip-score.z{color:var(--dim)}
.card-tbar-right{display:flex;gap:5px;flex-shrink:0}

.cm-wrap{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;color:#1a1830;overflow:hidden;background:var(--front)}
.cm-hd{padding:10px 16px;border-bottom:2px solid rgba(0,0,0,.08);display:flex;align-items:center;gap:8px;flex-shrink:0;background:color-mix(in srgb,var(--tc) 8%,var(--front))}
.hd-dot{width:10px;height:10px;border-radius:50%;background:var(--tc);flex-shrink:0}
.hd-type{font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:3px;text-transform:uppercase;color:var(--tc)}
.hd-pts-badge{font-family:'DM Mono',monospace;font-size:.68rem;color:#fff;background:var(--tc);padding:3px 10px;border-radius:20px;font-weight:700}
.hd-num{font-family:'DM Mono',monospace;font-size:.6rem;color:#999;margin-left:auto}

.cm-body{flex:1;padding:clamp(14px,2.5vh,32px) clamp(16px,4vw,56px);display:flex;flex-direction:column;gap:clamp(12px,2vh,22px);overflow-y:auto;min-height:0;background:var(--front)}
.cm-q{font-family:'DM Serif Display',serif;font-size:clamp(1.1rem,2.8vw,2.2rem);line-height:1.45;color:#1a1830}

.mc-opts{display:flex;flex-direction:column;gap:9px}
.mc-opt{padding:clamp(11px,1.8vh,18px) clamp(14px,2vw,24px);border-radius:12px;border:2px solid #ddd;background:#f8f8f0;cursor:pointer;font-size:clamp(.9rem,1.8vw,1.3rem);font-weight:600;color:#1a1830;transition:border-color .18s,background .18s,transform .12s;text-align:left;display:flex;align-items:center;gap:10px;width:100%}
.mc-opt:hover{border-color:#aaa;background:#f0f0e4;transform:translateX(3px)}
.opt-l{font-family:'DM Mono',monospace;font-size:.72rem;width:26px;height:26px;border-radius:50%;background:#e0e0d0;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.mc-opt.correct{border-color:#06d6a0!important;background:#e8fdf5!important;color:#027a5a;pointer-events:none}
.mc-opt.correct .opt-l{background:#06d6a0;color:#fff}
.mc-opt.wrong{border-color:#f72585!important;background:#fde8f2!important;color:#a00050;pointer-events:none}
.mc-opt.wrong .opt-l{background:#f72585;color:#fff}
.mc-opt.reveal{border-color:#06d6a0!important;background:#e8fdf5!important;pointer-events:none}
.mc-opt[disabled]{pointer-events:none}

.gap-ctx{font-family:'DM Serif Display',serif;font-size:clamp(1rem,2.5vw,1.8rem);color:#333;line-height:1.7;padding:12px 16px;background:#f5f5e8;border-radius:11px;border:2px solid #ddd}
.gap-lbl{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:5px}
.gap-in{width:100%;border:2px solid var(--tc,#888);border-radius:10px;padding:12px 16px;font-family:'DM Serif Display',serif;font-size:clamp(1.05rem,2.8vw,1.35rem);color:#1a1830;background:#fafaf2;outline:none;transition:border-color .2s}
.gap-in:focus{border-color:#555}
.gap-in.ok{border-color:#06d6a0;background:#e8fdf5;color:#027a5a}
.gap-in.no{border-color:#f72585;background:#fde8f2;color:#a00050}

.wo-area{display:flex;flex-direction:column;gap:10px}
.wo-label{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:2px}
.wo-zone{min-height:52px;border:2px dashed #ccc;border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#f5f5e8;transition:border-color .2s,background .2s}
.wo-zone.ok-b{border-color:#06d6a0;background:#e8fdf5}
.wo-zone.no-b{border-color:#f72585;background:#fde8f2}
.wo-ph{font-family:'DM Mono',monospace;font-size:.62rem;color:#bbb;pointer-events:none;user-select:none}
.wo-bank{display:flex;flex-wrap:wrap;gap:8px;min-height:42px;padding:8px;background:#eeeedd;border-radius:10px}
.ww{padding:clamp(8px,1.5vh,14px) clamp(12px,2vw,20px);border-radius:9px;background:#e4e4d4;font-family:'DM Sans',sans-serif;font-size:clamp(.9rem,1.8vw,1.3rem);font-weight:700;color:#1a1830;cursor:pointer;border:2px solid transparent;transition:background .15s,border-color .15s,transform .12s,box-shadow .12s;user-select:none}
.ww:hover{background:#c8c8b0;border-color:#999;transform:translateY(-2px);box-shadow:0 3px 10px rgba(0,0,0,.15)}
.ww:active{transform:scale(.95)}
.ww.placed{background:color-mix(in srgb,var(--tc,#888) 22%,#fff);border-color:var(--tc,#888);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.ww.placed:hover{background:color-mix(in srgb,var(--tc,#888) 35%,#fff);transform:translateY(-2px)}

.ooo-opts{display:flex;flex-wrap:wrap;gap:10px}
.ooo-opt{padding:clamp(11px,1.8vh,18px) clamp(16px,2.5vw,28px);border-radius:10px;border:2px solid #ddd;background:#f8f8f0;cursor:pointer;font-family:'DM Serif Display',serif;font-size:clamp(.95rem,2vw,1.4rem);color:#1a1830;transition:all .18s}
.ooo-opt:hover{border-color:#aaa;background:#f0f0e4;transform:scale(1.03)}
.ooo-opt.correct{border-color:#06d6a0!important;background:#e8fdf5!important;color:#027a5a;pointer-events:none}
.ooo-opt.wrong{border-color:#f72585!important;background:#fde8f2!important;color:#a00050;pointer-events:none}
.ooo-opt.reveal{border-color:#06d6a0!important;background:#e8fdf5!important;pointer-events:none}

.err-sent{font-family:'DM Serif Display',serif;font-size:clamp(1.05rem,2.5vw,1.8rem);line-height:1.9;padding:12px 16px;background:#f5f5e8;border-radius:11px;border:2px solid #ddd;display:flex;flex-wrap:wrap;gap:0 6px;align-items:baseline}
.ew{cursor:pointer;padding:2px 6px;border-radius:6px;transition:all .18s;border-bottom:2.5px solid transparent}
.ew:hover{background:#e8d8b8;border-bottom-color:#b8860b}
.ew.sel{background:#fde8b8;border-bottom-color:#d97706}
.ew.correct{background:#e8fdf5;color:#027a5a;border-bottom-color:#06d6a0;pointer-events:none}
.ew.wrong{background:#fde8f2;color:#a00050;border-bottom-color:#f72585;pointer-events:none}
.ew.reveal-c{background:#e8fdf5;color:#027a5a;border-bottom-color:#06d6a0;pointer-events:none}
.err-in{width:100%;border:2px solid var(--tc,#888);border-radius:10px;padding:12px 16px;font-family:'DM Serif Display',serif;font-size:clamp(1rem,2.5vw,1.3rem);color:#1a1830;background:#fafaf2;outline:none;transition:border-color .2s}
.err-in:focus{border-color:#555}
.err-in.ok{border-color:#06d6a0;background:#e8fdf5;color:#027a5a}
.err-in.no{border-color:#f72585;background:#fde8f2;color:#a00050}

.read-txt{background:#f0efe6;border-left:4px solid var(--tc,#888);border-radius:0 10px 10px 0;padding:clamp(14px,2vh,22px) clamp(16px,2.5vw,28px);font-size:clamp(.92rem,1.8vw,1.3rem);line-height:2.1;color:#2a2830;display:flex;flex-wrap:wrap;gap:0 4px;align-items:baseline}
.rw{cursor:pointer;padding:1px 4px;border-radius:5px;transition:background .15s,transform .1s;border-bottom:2px solid transparent;display:inline-block}
.rw:hover{background:#e0d8c0;border-bottom-color:#b8860b}
.rw.sel{background:#fde8b8;border-bottom-color:#d97706;font-weight:700}
.read-hint{font-family:'DM Mono',monospace;font-size:.56rem;letter-spacing:2px;text-transform:uppercase;color:#999;margin-top:-6px}

.speak-box{background:#f5f5e8;border:2px dashed #ccc;border-radius:12px;padding:20px 24px;font-family:'DM Serif Display',serif;font-size:clamp(1.1rem,2.5vw,1.6rem);color:#1a1830;line-height:1.6}

.fb{display:none;padding:12px 16px;border-radius:10px;font-family:'DM Mono',monospace;font-size:clamp(.72rem,1.7vw,.88rem);line-height:1.65;border:1.5px solid}
.fb.show{display:block;animation:fuD .28s ease}
.fb.ok{background:#eaf7f2;border-color:#3db88a;color:#1a6b4a}
.fb.no{background:#fdeef3;border-color:#d9547a;color:#8b1a3a}
@keyframes fuD{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.cm-ft{padding:10px 14px 14px;border-top:1px solid rgba(0,0,0,.08);display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;background:rgba(255,255,255,.6)}
.ftb{flex:1;min-width:70px;padding:clamp(12px,1.8vh,18px);border-radius:11px;border:2px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:clamp(.88rem,1.6vw,1.15rem);font-weight:700;transition:all .18s;white-space:nowrap}
.ftb-back{background:rgba(0,0,0,.06);border-color:#ccc;color:#666;flex:0 0 auto;padding:12px 14px}
.ftb-back:hover{background:rgba(0,0,0,.12)}
.ftb-chk{background:rgba(0,0,0,.06);border-color:#bbb;color:#333}
.ftb-chk:hover{background:rgba(0,0,0,.14)}
.ftb-show{background:rgba(0,0,0,.06);border-color:#bbb;color:#333}
.ftb-show:hover{background:rgba(0,0,0,.14)}
.ftb-ok{background:rgba(6,214,160,.13);border-color:#06d6a0;color:#027a5a}
.ftb-ok:hover{background:#06d6a0;color:#fff}
.ftb-no{background:rgba(247,37,133,.1);border-color:#f72585;color:#c0005a}
.ftb-no:hover{background:#f72585;color:#fff}

#avModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;align-items:center;justify-content:center}
#avModal.on{display:flex}
.av-box{background:var(--surf);border:1px solid var(--bord);border-radius:15px;padding:16px;width:260px}
.av-box h3{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:11px}
.av-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.av-o{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;border:2px solid transparent;background:#16213e;transition:all .15s}
.av-o:hover{border-color:var(--acc);transform:scale(1.1)}

#sWin{overflow-y:auto;align-items:center;justify-content:center;padding:40px 20px;background:radial-gradient(ellipse at center,#7b2fff22,var(--bg) 70%)}
.wbox{text-align:center;max-width:400px;width:100%}
.wtrophy{font-size:4rem;margin-bottom:8px}
.wtitle{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--acc);text-shadow:0 0 30px rgba(247,201,72,.4);margin-bottom:18px}
.wlist{display:flex;flex-direction:column;gap:6px;margin-bottom:22px}
.wrow{display:flex;align-items:center;gap:9px;background:var(--surf);border:1px solid var(--bord);border-radius:10px;padding:9px 13px}
.wrank{font-family:'DM Mono',monospace;font-size:.7rem;color:var(--dim);width:20px}
.wav{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.wname{flex:1;font-weight:700;text-align:left}
.wpts{font-family:'DM Mono',monospace;font-size:.86rem;color:var(--acc)}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--surf);border:1px solid var(--bord);color:var(--txt);font-family:'DM Mono',monospace;font-size:.66rem;padding:7px 16px;border-radius:30px;z-index:9999;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;pointer-events:none;z-index:9999;font-size:1.3rem;animation:cfA 1.3s ease forwards}
@keyframes cfA{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(90px) rotate(360deg);opacity:0}}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--bord);border-radius:2px}

@media(max-width:480px){
  .tbar{padding:4px 6px;min-height:42px;gap:4px}

<script>
// ══ AUDIO — lazy init ══
let AC=null;
function getAC(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  return AC;
}
function playTone(freq,type,dur,vol=0.18,delay=0){
  try{
    const ac=getAC();if(!ac)return;
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime+delay);
    g.gain.setValueAtTime(0,ac.currentTime+delay);
    g.gain.linearRampToValueAtTime(vol,ac.currentTime+delay+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+delay+dur);
    o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+0.05);
  }catch(e){}
}
const SFX={
  click(){playTone(520,'sine',.09,.1)},
  place(){playTone(440,'sine',.07,.12);playTone(660,'sine',.06,.09,.05)},
  correct(){[0,.1,.2].forEach((d,i)=>playTone([523,659,784][i],'sine',.18,.16,d))},
  wrong(){playTone(220,'sawtooth',.18,.12);playTone(180,'sawtooth',.22,.1,.06)},
  cardFlip(){playTone(800,'sine',.05,.08);playTone(1100,'sine',.04,.06,.04)},
  confetti(){[0,.07,.14,.21,.28].forEach((d,i)=>playTone([784,1047,1319,1568,2093][i],'sine',.1,.1,d))},
  back(){playTone(380,'sine',.1,.1)},
  nextPlayer(){playTone(620,'sine',.06,.1);playTone(780,'sine',.07,.1,.08)}
};

// ══ DATA ══
const CD=[
// MC — easy: +10
{type:'mc',topic:'ps',col:'#4cc9f0',pts:10,q:'She ______ to school yesterday.',opts:['go','goes','went','was going'],ans:2,exp:'"Yesterday" = completed past → Past Simple. "Go" is irregular: go → went.'},
{type:'mc',topic:'ps',col:'#4cc9f0',pts:10,q:'They ______ the exam last week.',opts:["didn't passed","didn't pass",'not passed',"wasn't passing"],ans:1,exp:'Past Simple negative: didn\'t + base verb.'},
{type:'mc',topic:'pc',col:'#f72585',pts:10,q:'At 8pm last night, they ______ dinner.',opts:['cooked','were cooking','are cooking','cookes'],ans:1,exp:'"At 8pm last night" = action in progress → Past Continuous: were cooking.'},
{type:'mc',topic:'pc',col:'#f72585',pts:10,q:'What ______ you ______ when I called?',opts:['did / do','were / doing','was / do','did / doing'],ans:1,exp:'Past Continuous question: What were you doing?'},
{type:'mc',topic:'pspc',col:'#7b2fff',pts:20,q:'She ______ a book when the phone ______.',opts:['read / was ringing','was reading / rang','reads / rang','was reading / was ringing'],ans:1,exp:'Ongoing (was reading) + sudden interruption (rang).'},
{type:'mc',topic:'pspc',col:'#7b2fff',pts:20,q:'While Tom ______ home, it ______ to rain.',opts:['walked / was starting','was walking / started','walks / started','walked / started'],ans:1,exp:'"While" + background → Past Continuous. Sudden start → Past Simple.'},
{type:'mc',topic:'adv',col:'#06d6a0',pts:10,q:'He spoke very ______ and nobody heard him.',opts:['quiet','quietly','more quiet','quieter'],ans:1,exp:'After a verb → adverb, not adjective.'},
{type:'mc',topic:'adv',col:'#06d6a0',pts:10,q:'She ran ______ but still missed the bus.',opts:['fastly','fast','faster than','more fast'],ans:1,exp:'"Fast" is already an adverb. ❌ "fastly" doesn\'t exist.'},
{type:'mc',topic:'adv',col:'#06d6a0',pts:10,q:'Which sentence is correct?',opts:['She danced beautiful.','She danced beautifully.','She beautiful danced.','She was dance beautifully.'],ans:1,exp:'Adverb of manner comes after the verb.'},
{type:'mc',topic:'ps',col:'#4cc9f0',pts:10,q:'I ______ my keys this morning.',opts:['losted','was losing','lost',"didn't found"],ans:2,exp:'"Lose" is irregular: lose → lost.'},
// GAP — medium: +15–25
{type:'gap',topic:'ps',col:'#ff9f1c',pts:15,before:'He',after:'to the bus and caught it.',verb:'run',ans:'ran',exp:'"Run" is irregular: run → ran.'},
{type:'gap',topic:'pc',col:'#f72585',pts:15,before:'She',after:'when her mum called.',verb:'study',ans:'was studying',exp:'Ongoing action interrupted = Past Continuous: was studying.'},
{type:'gap',topic:'pspc',col:'#7b2fff',pts:25,before:'While I',after:'to school, I saw an accident.',verb:'walk',ans:'was walking',exp:'"While" clause = background ongoing → Past Continuous.'},
{type:'gap',topic:'adv',col:'#06d6a0',pts:15,before:'The teacher spoke very',after:'so everyone understood.',verb:'careful',ans:'carefully',exp:'After a verb → adverb. "Careful" → "carefully" (-ly ending).'},
{type:'gap',topic:'ps',col:'#4cc9f0',pts:15,before:'They',after:'to the party last night.',verb:'not / go',ans:"didn't go",exp:'Past Simple negative: didn\'t + base verb.'},
{type:'gap',topic:'pc',col:'#f72585',pts:25,before:'At 9pm they',after:'happily at the wedding.',verb:'dance',ans:'were dancing',exp:'"At 9pm" = specific moment + ongoing → Past Continuous.'},
{type:'gap',topic:'adv',col:'#06d6a0',pts:15,before:'She ran so',after:'that nobody could catch her.',verb:'quick',ans:'quickly',exp:'"So + adverb + that". "Quick" → "quickly".'},
{type:'gap',topic:'pspc',col:'#7b2fff',pts:25,before:'He',after:'his report when the computer crashed.',verb:'write',ans:'was writing',exp:'Ongoing (was writing) + sudden event (crashed).'},
// WO — medium: +20
{type:'wo',topic:'ps',col:'#ffd60a',pts:20,words:["She","didn't","go","to","school","yesterday","."],ans:"She didn't go to school yesterday .",exp:'Past Simple negative: Subject + didn\'t + base verb + time.'},
{type:'wo',topic:'pc',col:'#f72585',pts:20,words:["They","were","dancing","happily","when","the","music","stopped","."],ans:"They were dancing happily when the music stopped .",exp:'Past Continuous + adverb + when + Past Simple.'},
{type:'wo',topic:'pspc',col:'#7b2fff',pts:20,words:["While","I","was","reading",",","my","phone","rang","."],ans:"While I was reading , my phone rang .",exp:'"While" + Past Continuous, then Past Simple interruption.'},
{type:'wo',topic:'adv',col:'#06d6a0',pts:20,words:["He","worked","so","hard","that","he","finished","early","."],ans:"He worked so hard that he finished early .",exp:'"So + adverb + that" = result structure.'},
{type:'wo',topic:'ps',col:'#4cc9f0',pts:20,words:["Did","you","see","that","film","last","weekend","?"],ans:"Did you see that film last weekend ?",exp:'Past Simple question: Did + subject + base verb?'},
{type:'wo',topic:'adv',col:'#06d6a0',pts:20,words:["She","was","speaking","so","quietly","that","nobody","heard","her","."],ans:"She was speaking so quietly that nobody heard her .",exp:'Past Continuous + "so + adverb + that".'},
// OOO — medium: +20
{type:'ooo',topic:'ps',col:'#e040fb',pts:20,q:'Which verb form does NOT belong with Past Simple?',opts:['went','cooked','ran','was going'],ans:3,exp:'"Was going" is Past Continuous. The others are Past Simple.'},
{type:'ooo',topic:'adv',col:'#06d6a0',pts:20,q:'Which word is NOT an adverb of manner?',opts:['quickly','carefully','nervous','slowly'],ans:2,exp:'"Nervous" is an adjective, not an adverb.'},
{type:'ooo',topic:'adv',col:'#06d6a0',pts:20,q:'Which word CANNOT follow "She spoke ___"',opts:['quietly','loudly','angrily','anger'],ans:3,exp:'"Anger" is a noun. After a verb we need an adverb.'},
{type:'ooo',topic:'pc',col:'#f72585',pts:20,q:'Which sentence uses Past Continuous INCORRECTLY?',opts:['She was reading a book.','They were cooking dinner.','He was knew the answer.','I was waiting for you.'],ans:2,exp:'"Know" is a state verb — no continuous form.'},
{type:'ooo',topic:'pspc',col:'#7b2fff',pts:20,q:'Which time expression fits Past Continuous best?',opts:['yesterday','last week','at 6pm (ongoing)','two days ago'],ans:2,exp:'"At 6pm" = ongoing moment → Past Continuous.'},
// ERR — hard: +25
{type:'err',topic:'ps',col:'#ff6b35',pts:25,sentence:['She','runned','to','school','yesterday','.'],errIdx:1,fix:'ran',exp:'"Run" is irregular: run → ran. ❌ "runned" doesn\'t exist.'},
{type:'err',topic:'pc',col:'#f72585',pts:25,sentence:['They','was','playing','football','at','5pm','.'],errIdx:1,fix:'were',exp:'"They" is plural → were (not was).'},
{type:'err',topic:'pspc',col:'#7b2fff',pts:25,sentence:['He','cooked','when','I','called','.'],errIdx:1,fix:'was cooking',exp:'Ongoing action interrupted → Past Continuous.'},
{type:'err',topic:'adv',col:'#06d6a0',pts:25,sentence:['She','danced','beautiful','at','the','party','.'],errIdx:2,fix:'beautifully',exp:'After a verb → adverb. "Beautiful" → "beautifully".'},
{type:'err',topic:'ps',col:'#4cc9f0',pts:25,sentence:['I',"didn't",'went','to','the','party','.'],errIdx:2,fix:'go',exp:'"Didn\'t" + base verb only. ✅ didn\'t go.'},
{type:'err',topic:'adv',col:'#06d6a0',pts:25,sentence:['He','ran','fastly','down','the','street','.'],errIdx:2,fix:'fast',exp:'"Fast" is already an adverb. ❌ "fastly" doesn\'t exist.'},
{type:'err',topic:'pc',col:'#f72585',pts:25,sentence:['She','was','dance','beautifully','.'],errIdx:2,fix:'dancing',exp:'Past Continuous = was/were + verb-ING.'},
{type:'err',topic:'pspc',col:'#7b2fff',pts:25,sentence:['While','I','studied',',','my','phone','rang','.'],errIdx:2,fix:'was studying',exp:'"While" clause = Past Continuous background.'},
// READ — hardest: +30
{type:'read',topic:'pspc',col:'#e040fb',pts:30,text:'Last Saturday Marco went to the park. While he was playing football, his friend Ana was reading quietly under a tree. Suddenly it started to rain. Everyone ran quickly to the nearest café.',q:'What was Ana doing while Marco was playing football?',example:'She was reading quietly under a tree. (Past Continuous — ongoing background action)'},
{type:'read',topic:'adv',col:'#06d6a0',pts:30,text:'The students were waiting nervously outside the classroom. Inside, some were writing quickly while others sat quietly and thought carefully. At 10am the teacher said loudly: "Pens down!"',q:'Find THREE adverbs of manner in this text.',example:'nervously, quickly, quietly, carefully, loudly — any three are correct.'},
{type:'read',topic:'pspc',col:'#7b2fff',pts:30,text:'Jake was late for his interview. He ran quickly down the street and jumped onto the bus. He was breathing heavily. When he finally arrived, the receptionist smiled kindly.',q:'What was Jake doing on the bus? What does this tell us about how he felt?',example:'He was breathing heavily — stressed/exhausted. (Past Continuous for ongoing state)'},
// SPEAK — hardest: +30
{type:'speak',topic:'ps',col:'#4cc9f0',pts:30,prompt:'Tell us about something you did last weekend. Use Past Simple + at least ONE adverb of manner.',example:'e.g. I cooked dinner carefully. / I walked quickly to the shops.'},
{type:'speak',topic:'pc',col:'#f72585',pts:30,prompt:'Describe what was happening in your home at 9pm yesterday. Use Past Continuous.',example:'e.g. My mum was watching TV quietly. My sister was talking loudly on the phone.'},
{type:'speak',topic:'pspc',col:'#7b2fff',pts:30,prompt:'Make a sentence: "While I was ___ing, I ___ed." Add an adverb.',example:'e.g. While I was walking quickly to school, I saw an accident.'},
{type:'speak',topic:'adv',col:'#06d6a0',pts:30,prompt:'Describe someone doing something — use an adverb of manner and explain why.',example:'e.g. She was working nervously because her boss was watching.'},
];

const TN={mc:'Multiple Choice',gap:'Fill the Gap',wo:'Word Order',ooo:'Odd One Out',err:'Fix the Error',read:'Read & Answer',speak:'Speak!'};
const PC=['#f7c948','#4cc9f0','#f72585','#06d6a0','#a78bfa','#fb923c'];
const EM=Array.from({length:11},(_,i)=>`/assets/av${i+1}.png`);

// ══ STATE ══
let topic='all',cardCount=9,players=[],curP=0,deck=[],doneSet=new Set(),avIdx=null;

// ══ LOBBY ══
document.querySelectorAll('.tpill').forEach(b=>b.addEventListener('click',()=>{

document.querySelectorAll('.cpill').forEach(b=>b.addEventListener('click',()=>{

function addP(n,em){
  if(players.length>=6)return;
  const i=players.length;
  players.push({name:n||'Player '+(i+1),av:em||EM[i]||'😊',color:PC[i%PC.length],score:0});
  renderP();
}
function renderP(){
  const el=document.getElementById('pList');el.innerHTML='';
  players.forEach((p,i)=>{
    const r=document.createElement('div');r.className='prow';
    r.innerHTML=`<div class="pav" data-i="${i}"><img src="${p.av}" alt=""></div>
      <input class="pname" value="${p.name}" placeholder="Name" data-i="${i}" maxlength="16">
      <div class="pdot" style="background:${p.color}"></div>
      ${players.length>1?`<button class="prmv" data-i="${i}">✕</button>`:''}`;
    el.appendChild(r);
  });
  el.querySelectorAll('.pav').forEach(e=>e.addEventListener('click',()=>openAv(+e.dataset.i)));
  el.querySelectorAll('.pname').forEach(e=>e.addEventListener('input',()=>{players[+e.dataset.i].name=e.value||'Player '+(+e.dataset.i+1);}));
  el.querySelectorAll('.prmv').forEach(e=>e.addEventListener('click',()=>{players.splice(+e.dataset.i,1);renderP();}));
}
function openAv(i){
  avIdx=i;
  const g=document.getElementById('avGrid');g.innerHTML='';
  EM.forEach(src=>{
    const d=document.createElement('div');d.className='av-o';
    d.style.cssText='overflow:hidden;padding:0';
    d.innerHTML=`<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">`;
    d.onclick=()=>{players[avIdx].av=src;renderP();document.getElementById('avModal').classList.remove('on');};
    g.appendChild(d);
  });
  document.getElementById('avModal').classList.add('on');
}
document.getElementById('avModal').addEventListener('click',e=>{if(e.target===document.getElementById('avModal'))document.getElementById('avModal').classList.remove('on');});
document.getElementById('addPBtn').addEventListener('click',()=>addP());
addP('Player 1');addP('Player 2');

document.getElementById('startBtn').addEventListener('click',()=>{
  const pool=(topic==='all'?CD:CD.filter(c=>c.topic===topic)).sort(()=>Math.random()-.5).slice(0,cardCount);
  if(!pool.length){toast('No cards for this topic!');return;}
  deck=pool;doneSet=new Set();curP=0;
  players.forEach(p=>p.score=0);
  showScr('sTable');buildGrid();renderChips();
});

// ══ TABLE ══
function buildGrid(){
  const grid=document.getElementById('cardGrid');
  if(!grid)return;
  grid.innerHTML='';
  const n=deck.length;
  if(!n)return;
  const tbar=document.querySelector('.tbar');
  const tbarH=tbar?tbar.getBoundingClientRect().height:52;
  const W=Math.max(window.innerWidth||320,200);
  const H=Math.max((window.innerHeight||600)-tbarH,100);
  const GAP=10;
  // Pick cols: prefer perfect fills, then minimize waste
  let bestCols=1,bestScore=-1;
  // First pass: find perfect fill (no remainder)
  let perfectCols=[];
  for(let cols=1;cols<=12;cols++){
    if(n%cols===0)perfectCols.push(cols);
  }
  for(let cols=1;cols<=12;cols++){
    const rows=Math.ceil(n/cols);
    const cw=(W-GAP*(cols+1))/cols;
    const ch=(H-GAP*(rows+1))/rows;
    if(cw<60||ch<50)continue;
    const aspect=cw/ch;
    const aspectPenalty=aspect<0.5||aspect>2.5?0.2:aspect<0.7||aspect>2?0.7:1;
    const remainder=n%cols;
    const waste=remainder===0?0:(cols-remainder)/cols;
    // Strong bonus for zero waste (perfect grid)
    const wastePenalty=remainder===0?1.5:1-waste*0.8;
    const score=cw*ch*aspectPenalty*wastePenalty;
    if(score>bestScore){bestScore=score;bestCols=cols;}
  }
  const rows=Math.ceil(n/bestCols);
  const remainder=n%bestCols;
  const lastRowStart=remainder===0?-1:n-remainder; // index where last row starts
  grid.style.cssText=[
    'display:grid',
    `grid-template-columns:repeat(${bestCols},1fr)`,
    `grid-template-rows:repeat(${rows},1fr)`,
    `gap:${GAP}px`,
    `padding:${GAP}px`,
    'flex:1',
    'overflow:hidden',
    `height:${H}px`,
    'width:100%',
    'box-sizing:border-box'
  ].join(';')+';';
  deck.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='tc'+(doneSet.has(i)?' done':'');
    el.id='tc'+i;
    el.innerHTML=`<div class="tc-num">${i+1}</div><div class="tc-pts">+${c.pts}</div>`;
    // Stretch last-row cards to fill width evenly
    if(lastRowStart>0&&i>=lastRowStart){
      // Each card in last row spans proportionally
      const lastCount=remainder;
      const span=Math.floor(bestCols/lastCount);
      const extra=bestCols%lastCount;
      const posInRow=i-lastRowStart;
      const mySpan=posInRow<extra?span+1:span;
      el.style.gridColumn='span '+mySpan;
    }
    el.addEventListener('click',()=>{SFX.cardFlip();openCard(i);});
    grid.appendChild(el);
  });
}
function reGrid(){if(deck.length)buildGrid();}
window.addEventListener('resize',reGrid);

document.getElementById('nextPBtn').addEventListener('click',()=>{
  curP=(curP+1)%players.length;
  SFX.nextPlayer();renderChips();
  toast(`${players[curP].av} ${players[curP].name}'s turn!`);
});
document.getElementById('endBtn').addEventListener('click',showWin);

function renderChips(){
  // table bar
  const el=document.getElementById('scoreChips');el.innerHTML='';
  players.forEach((p,i)=>{
    const c=document.createElement('div');c.className='schip'+(i===curP?' cur':'');
    const cls=p.score>0?'p':p.score<0?'n':'z';
    const shortName=p.name.length>10?p.name.slice(0,9)+'…':p.name;
    c.innerHTML=`<img class="schip-av" src="${p.av}" alt=""><span class="schip-name">${shortName}</span><span class="ssc ${cls}">${p.score>0?'+':''}${p.score}</span>`;
    el.appendChild(c);
  });
  renderCardChips();
}

function renderCardChips(){
  const el=document.getElementById('cardScoreChips');if(!el)return;
  el.innerHTML='';
  players.forEach((p,i)=>{
    const c=document.createElement('div');c.className='card-schip'+(i===curP?' cur':'');
    const cls=p.score>0?'p':p.score<0?'n':'z';
    const shortName=p.name.length>10?p.name.slice(0,9)+'…':p.name;
    c.innerHTML=`<img class="card-schip-av" src="${p.av}" alt=""><span class="card-schip-name">${shortName}</span><span class="card-schip-score ${cls}">${p.score>0?'+':''}${p.score}</span>`;
    el.appendChild(c);
  });
}

function animateScore(txt,isOk){
  // find current player chip in both bars
  const allChips=[...document.querySelectorAll('.schip,.card-schip')];
  let found=false;
  allChips.forEach((chip,idx)=>{
    const nameEl=chip.querySelector('.schip-name,.card-schip-name');
    if(nameEl&&nameEl.textContent===players[curP].name&&!found){
      found=true;
      const pop=document.createElement('div');
      pop.className='score-pop '+(isOk?'pos':'neg');
      pop.textContent=txt;
      const r=chip.getBoundingClientRect();
      pop.style.left=(r.left+r.width/2-20)+'px';
      pop.style.top=(r.top)+'px';
      document.body.appendChild(pop);
      setTimeout(()=>pop.remove(),1200);
    }
  });
}

// ══ OPEN CARD ══
function openCard(i){
  const c=deck[i];
  renderCardChips();
  showScr('sCard');

  const hd=`<div class="cm-hd" style="--tc:${c.col}">
    <div class="hd-dot"></div>
    <div class="hd-type">${TN[c.type]}</div>
    <div style="flex:1"></div>
    <div class="hd-pts-badge">+${c.pts} pts</div>
    <div class="hd-num">#${i+1}</div>
  </div>`;

  let body='',foot='';

  if(c.type==='mc'){
    const opts=c.opts.map((o,j)=>`<button class="mc-opt" data-j="${j}" onclick="doMC(${i},${j})"><span class="opt-l">${'ABCD'[j]}</span>${o}</button>`).join('');
    body=`<div class="cm-q">${c.q}</div><div class="mc-opts">${opts}</div><div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button></div>`;
  }
  else if(c.type==='gap'){
    body=`<div class="cm-q">Fill in the correct form of: <strong>${c.verb}</strong></div>
      <div class="gap-ctx">${c.before} <strong>_______</strong> ${c.after}</div>
      <div><div class="gap-lbl">Your answer</div>
      <input id="gapIn" class="gap-in" style="--tc:${c.col}" placeholder="type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button><button class="ftb ftb-chk" onclick="doGap(${i})">Check ✓</button></div>`;
  }
  else if(c.type==='wo'){
    const shuffled=[...c.words].sort(()=>Math.random()-.5);
    const chips=shuffled.map((w,j)=>`<div class="ww" id="ww${j}" data-w="${w}" onclick="woClick(this,${i})">${w}</div>`).join('');
    body=`<div class="cm-q">Put the words in the correct order:</div>
      <div class="wo-area">
        <div class="wo-label">Your sentence — tap a word to remove it:</div>
        <div class="wo-zone" id="woDrop" style="--tc:${c.col}"><span class="wo-ph" id="woPh">Tap words below to build your sentence…</span></div>
        <div class="wo-label">Word bank — tap to add:</div>
        <div class="wo-bank" id="woBank">${chips}</div>
      </div>
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft">
      <button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
      <button class="ftb ftb-chk" style="background:rgba(0,0,0,.06);border-color:#ccc;color:#666" onclick="woClear()">↺ Reset</button>
      <button class="ftb ftb-chk" onclick="doWO(${i})">Check ✓</button>
    </div>`;
  }
  else if(c.type==='ooo'){
    const opts=c.opts.map((o,j)=>`<button class="ooo-opt" data-j="${j}" onclick="doOOO(${i},${j})">${o}</button>`).join('');
    body=`<div class="cm-q">${c.q}</div><div class="ooo-opts">${opts}</div><div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button></div>`;
  }
  else if(c.type==='err'){
    const words=c.sentence.map((w,j)=>`<span class="ew" data-j="${j}" onclick="pickEW(this,${c.errIdx})">${w}</span>`).join(' ');
    body=`<div class="cm-q">Tap the wrong word, then type the correction:</div>
      <div class="err-sent" style="--tc:${c.col}">${words}</div>
      <input id="errIn" class="err-in" style="--tc:${c.col}" placeholder="type the correct word…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button><button class="ftb ftb-chk" onclick="doErr(${i})">Check ✓</button></div>`;
  }
  else if(c.type==='read'){
    const parts=c.text.split(/(\s+)/);
    const clickable=parts.map(w=>/^\s+$/.test(w)?w:`<span class="rw" onclick="rwClick(this)">${w}</span>`).join('');
    body=`<div class="read-txt" id="readTxt" style="--tc:${c.col}">${clickable}</div>
      <div class="cm-q">${c.q}</div>
      <div class="read-hint">Tap words to highlight your answer, then press Show Answer</div>
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft">
      <button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
      <button class="ftb ftb-show" id="showEx">Show answer</button>
    </div>`;
  }
  else if(c.type==='speak'){
    body=`<div class="speak-box">${c.prompt}</div><div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft">
      <button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
      <button class="ftb ftb-show" id="showEx">Show example</button>
    </div>`;
  }

  document.getElementById('cardModal').innerHTML=hd+`<div class="cm-body">${body}</div>`+foot;
  const se=document.getElementById('showEx');
  if(se) se.addEventListener('click',()=>{
    const fb=document.getElementById('fb');
    fb.className='fb show ok';
    fb.innerHTML='<strong>Answer / Example:</strong><br>'+c.example;
    // reveal grade buttons after showing answer
    const ft=document.querySelector('.cm-ft');
    if(ft&&!ft.querySelector('.ftb-ok')){
      const gradeHtml=`<button class="ftb ftb-no" onclick="grade(${i},false)">✗ Wrong</button>
        <button class="ftb ftb-ok" onclick="grade(${i},true)">✓ Correct</button>`;
      ft.insertAdjacentHTML('beforeend',gradeHtml);
      se.style.display='none';
    }
  });
}

function closeCard(){SFX.back();showScr('sTable');}

// ══ WORD ORDER — click ══
window.woClick=function(chip){
  SFX.place();
  const bank=document.getElementById('woBank');
  const drop=document.getElementById('woDrop');
  if(!bank||!drop)return;
  if(chip.parentElement===bank){
    chip.classList.add('placed');
    const ph=document.getElementById('woPh');if(ph)ph.remove();
    drop.appendChild(chip);
  } else if(chip.parentElement===drop){
    chip.classList.remove('placed');
    bank.appendChild(chip);
    if(!drop.querySelectorAll('.ww').length){
      const ph=document.createElement('span');ph.className='wo-ph';ph.id='woPh';ph.textContent='Tap words below to build your sentence…';
      drop.insertBefore(ph,drop.firstChild);
    }
  }
};
window.woClear=function(){
  SFX.click();
  const bank=document.getElementById('woBank'),drop=document.getElementById('woDrop');
  if(!bank||!drop)return;
  [...drop.querySelectorAll('.ww')].forEach(ch=>{ch.classList.remove('placed');bank.appendChild(ch);});
  drop.innerHTML='<span class="wo-ph" id="woPh">Tap words below to build your sentence…</span>';
  drop.classList.remove('ok-b','no-b');
};
window.doWO=function(ci){
  SFX.click();
  const c=deck[ci];
  const drop=document.getElementById('woDrop');
  const placed=[...drop.querySelectorAll('.ww')].map(ch=>ch.textContent).join(' ');
  const ok=placed.trim()===c.ans.trim();
  drop.classList.add(ok?'ok-b':'no-b');
  document.querySelectorAll('.ww').forEach(ch=>ch.style.pointerEvents='none');
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};

// ══ READ — clickable words ══
window.rwClick=function(el){SFX.click();el.classList.toggle('sel');};

// ══ MC ══
window.doMC=function(ci,chosen){
  SFX.click();
  const c=deck[ci];
  document.querySelectorAll('.mc-opt').forEach((o,j)=>{
    o.setAttribute('disabled','true');
    if(j===chosen)o.classList.add(chosen===c.ans?'correct':'wrong');
    else if(j===c.ans&&chosen!==c.ans)o.classList.add('reveal');
  });
  const ok=chosen===c.ans;
  showFB(ok,c.exp);
  if(ok)confetti();
  // auto-grade: MC answer is clear
  setTimeout(()=>autoGrade(ci,ok),600);
};

// ══ GAP ══
window.doGap=function(ci){
  SFX.click();
  const c=deck[ci];
  const inp=document.getElementById('gapIn');
  const val=(inp.value||'').trim().toLowerCase();
  const ok=val===c.ans.toLowerCase();
  inp.classList.add(ok?'ok':'no');inp.setAttribute('readonly','true');
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};

// ══ OOO ══
window.doOOO=function(ci,chosen){
  SFX.click();
  const c=deck[ci];
  document.querySelectorAll('.ooo-opt').forEach((o,j)=>{
    o.setAttribute('disabled','true');
    if(j===chosen)o.classList.add(chosen===c.ans?'correct':'wrong');
    else if(j===c.ans&&chosen!==c.ans)o.classList.add('reveal');
  });
  const ok=chosen===c.ans;
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};

// ══ ERR ══
let selEW=null;
window.pickEW=function(el){
  SFX.click();
  document.querySelectorAll('.ew').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');selEW=+el.dataset.j;
};
window.doErr=function(ci){
  SFX.click();
  const c=deck[ci];
  const inp=document.getElementById('errIn');
  const val=(inp.value||'').trim().toLowerCase();
  const wOk=selEW===c.errIdx;
  const fOk=val===c.fix.toLowerCase()||val.replace(/'/g,"'")===c.fix.toLowerCase().replace(/'/g,"'");
  const ok=wOk&&fOk;
  document.querySelectorAll('.ew').forEach((e,j)=>{
    e.style.pointerEvents='none';
    if(j===selEW)e.classList.add(wOk?'correct':'wrong');
    if(!wOk&&j===c.errIdx)e.classList.add('reveal-c');
  });
  inp.classList.add(ok?'ok':'no');inp.setAttribute('readonly','true');
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};

function replFoot(ci){
  const ft=document.querySelector('.cm-ft');if(!ft)return;
  ft.innerHTML=`<button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
    <button class="ftb ftb-no" onclick="grade(${ci},false)">✗ Wrong</button>
    <button class="ftb ftb-ok" onclick="grade(${ci},true)">✓ Correct</button>`;
}

// autoGrade: for tasks with clear right/wrong (MC, OOO, GAP, WO, ERR)
window.autoGrade=function(ci,ok){
  const c=deck[ci];
  const pts=ok?c.pts:-3;
  if(ok){
    players[curP].score+=c.pts;
    SFX.correct();
    animateScore('+'+c.pts,true);
    toast('+'+c.pts+' pts → '+players[curP].name+'!');
  } else {
    players[curP].score-=3;
    SFX.wrong();
    animateScore('-3',false);
    toast('-3 pts → '+players[curP].name);
  }
  doneSet.add(ci);
  const tc=document.getElementById('tc'+ci);if(tc)tc.classList.add('done');
  curP=(curP+1)%players.length;
  renderChips();
  // show next button instead of full close
  const ft=document.querySelector('.cm-ft');
  if(ft){
    ft.innerHTML=`<button class="ftb ftb-back" onclick="closeCard()">✕ Back to board</button>`;
  }
  if(doneSet.size>=deck.length)setTimeout(showWin,1200);
};

window.grade=function(ci,ok){
  const c=deck[ci];
  if(ok){
    players[curP].score+=c.pts;
    SFX.correct();
    animateScore('+'+c.pts,true);
    confetti();
    toast('+'+c.pts+' pts → '+players[curP].name+'!');
  } else {
    players[curP].score-=3;
    SFX.wrong();
    animateScore('-3',false);
    toast('-3 pts → '+players[curP].name);
  }
  doneSet.add(ci);
  const tc=document.getElementById('tc'+ci);if(tc)tc.classList.add('done');
  curP=(curP+1)%players.length;
  renderChips();
  closeCard();
  if(doneSet.size>=deck.length)setTimeout(showWin,600);
};

function showFB(ok,exp){
  ok?SFX.correct():SFX.wrong();
  const fb=document.getElementById('fb');if(!fb)return;
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ ':'❌ ')+exp;
}

// ══ WIN ══
function showWin(){
  SFX.confetti();showScr('sWin');
  const s=[...players].sort((a,b)=>b.score-a.score);
  document.getElementById('winList').innerHTML=s.map((p,i)=>`
    <div class="wrow"><div class="wrank">${['🥇','🥈','🥉'][i]||i+1+'.'}</div>
    <img class="wav" src="${p.av}" alt=""><div class="wname">${p.name}</div>
    <div class="wpts">${p.score>0?'+':''}${p.score} pts</div></div>`).join('');
}

// ══ UTILS ══
function showScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function confetti(){
  const shapes=['★','✦','◆','●','▲','✿'];
  const colors=['#f7c948','#06d6a0','#4cc9f0','#f72585','#a78bfa','#fb923c'];
  shapes.forEach((sh,i)=>{
    setTimeout(()=>{
      const el=document.createElement('div');el.className='conf';el.textContent=sh;
      el.style.cssText=`left:${10+Math.random()*80}%;top:${10+Math.random()*40}%;color:${colors[i%colors.length]};font-size:${0.9+Math.random()*0.8}rem`;
      document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
    },i*80);
  });
}
let tT;
function toast(m){const t=document.getElementById('toastEl');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2800);}
</script>
