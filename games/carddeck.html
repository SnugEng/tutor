<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Card Deck · SE</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700;800&display=swap');
:root{
  --bg:#12111e;--surf:#1d1b2e;--bord:#2e2c46;
  --acc:#e8b84b;--txt:#f0eff8;--dim:#7a798f;
  --grn:#3db88a;--red:#d9547a;
  --front:#fdfcf5;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--txt);touch-action:manipulation}
.scr{display:none;position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;flex-direction:column}
.scr.on{display:flex;flex-direction:column}

#sLobby{overflow-y:auto;flex-direction:column;align-items:center;padding:28px 16px 60px;background:radial-gradient(ellipse at 20% 10%,#7b2fff22,transparent 50%),radial-gradient(ellipse at 80% 90%,#4cc9f018,transparent 50%),var(--bg)}
.logo{font-family:'DM Serif Display',serif;font-size:clamp(2rem,7vw,3.2rem);color:var(--acc);text-align:center;letter-spacing:-1px;text-shadow:0 0 40px rgba(247,201,72,.3)}
.logo-sub{font-family:'DM Mono',monospace;font-size:.55rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);text-align:center;margin-top:4px;margin-bottom:22px}
.lcard{background:var(--surf);border:1px solid var(--bord);border-radius:18px;padding:20px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:16px}
.lbl{font-family:'DM Mono',monospace;font-size:.52rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tpill{padding:9px;border-radius:9px;border:1.5px solid var(--bord);background:#16213e;color:var(--dim);font-family:'DM Sans',sans-serif;font-size:.74rem;font-weight:700;cursor:pointer;transition:all .2s;text-align:center}
.tpill.sel{border-color:var(--acc);background:rgba(247,201,72,.14);color:var(--txt)}
.count-row{display:flex;gap:6px;flex-wrap:wrap}
.cpill{padding:7px 14px;border-radius:9px;border:1.5px solid var(--bord);background:#16213e;color:var(--dim);font-family:'DM Mono',monospace;font-size:.76rem;cursor:pointer;transition:all .2s}
.cpill.sel{border-color:var(--acc);background:rgba(247,201,72,.14);color:var(--acc)}
.prow{display:flex;align-items:center;gap:7px;background:#16213e;border:1.5px solid var(--bord);border-radius:10px;padding:7px 10px;margin-bottom:5px}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--bord);background:var(--bg);flex-shrink:0;overflow:hidden}
.pav img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.pname{flex:1;background:transparent;border:none;outline:none;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:700;min-width:0}
.pname::placeholder{color:var(--dim);font-weight:400}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.prmv{background:none;border:none;color:var(--dim);cursor:pointer;font-size:.78rem;padding:3px;flex-shrink:0}
.addp{background:#16213e;border:1px dashed var(--bord);border-radius:9px;padding:8px;color:var(--dim);font-size:.76rem;cursor:pointer;width:100%;font-family:'DM Sans',sans-serif;transition:all .2s}
.addp:hover{border-color:var(--acc);color:var(--acc)}
.startbtn{background:linear-gradient(135deg,#f7c948,#ff9f1c);border:none;border-radius:12px;padding:14px;color:#0f0e17;font-family:'DM Serif Display',serif;font-size:1rem;cursor:pointer;box-shadow:0 4px 24px rgba(247,201,72,.35);transition:transform .15s}
.startbtn:active{transform:translateY(1px)}

#sTable{overflow:hidden;background:#0a0913}

.tbar{background:#0a0913;border-bottom:1px solid var(--bord);padding:6px 8px;display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:46px;overflow:hidden}
.tbar-title{font-family:'DM Serif Display',serif;font-size:.85rem;color:var(--acc);flex-shrink:0;display:none}
.schips{display:flex;gap:4px;flex:1;overflow-x:auto;min-width:0;justify-content:center;align-items:center;padding:2px 0;scrollbar-width:none;-ms-overflow-style:none}
.schip{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 5px;border-radius:24px;background:#1e1c2e;border:2px solid var(--bord);font-weight:700;white-space:nowrap;flex-shrink:1;min-width:0;max-width:140px;transition:all .35s cubic-bezier(.34,1.56,.64,1);position:relative}
.schip.cur{border-color:var(--acc);background:rgba(232,184,75,.12);box-shadow:0 0 12px rgba(232,184,75,.35);transform:scale(1.08)}
.schip-av{width:22px;height:22px;border-radius:50%;object-fit:cover;flex-shrink:0;display:block}
.schip-name{font-family:'DM Sans',sans-serif;font-size:clamp(.58rem,.9vw,.78rem);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ssc{font-family:'DM Mono',monospace;font-size:.78rem;font-weight:900;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,.1);flex-shrink:0}
.ssc.p{color:#3db88a}.ssc.n{color:#d9547a}.ssc.z{color:var(--dim)}


.score-pop{position:fixed;pointer-events:none;font-family:'DM Mono',monospace;font-weight:900;font-size:1.2rem;z-index:9998;animation:scorePop 1.1s ease forwards;white-space:nowrap;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.score-pop.pos{color:#06d6a0}.score-pop.neg{color:#f72585}
@keyframes scorePop{0%{opacity:0;transform:translateY(0) scale(.4)}20%{opacity:1;transform:translateY(-14px) scale(1.5)}70%{opacity:1;transform:translateY(-40px) scale(1)}100%{opacity:0;transform:translateY(-70px) scale(.6)}}

.tbar-right{display:flex;gap:5px;flex-shrink:0}
.tbtn{padding:4px 9px;border-radius:6px;border:1.5px solid var(--bord);background:transparent;color:var(--dim);font-size:.64rem;font-weight:700;cursor:pointer;flex-shrink:0;transition:all .2s;white-space:nowrap}
.tbtn:hover{border-color:var(--acc);color:var(--acc)}
.tbtn.rd{border-color:#7f1d1d;color:#fca5a5}.tbtn.rd:hover{background:#7f1d1d;color:#fff}


#cardGrid{flex:1;display:grid;gap:8px;padding:8px;overflow:hidden}

.tc{background:linear-gradient(145deg,#1a1930,#14203a);border:2px solid var(--bord);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;width:100%;height:100%;transition:border-color .2s,box-shadow .22s,transform .2s,background .2s}
.tc::before{content:'';position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(45deg,transparent,transparent 12px,rgba(255,255,255,.018) 12px,rgba(255,255,255,.018) 24px)}
.tc:hover{border-color:var(--acc);box-shadow:0 0 24px rgba(232,184,75,.4),0 6px 20px rgba(0,0,0,.5);transform:translateY(-3px) scale(1.03);background:linear-gradient(145deg,#22203d,#192840)}
.tc:active{transform:translateY(-1px) scale(.99)}
.tc.done{opacity:.18;pointer-events:none;filter:grayscale(1)}
.tc-num{font-family:'DM Serif Display',serif;font-size:clamp(1.8rem,5vw,5.5rem);color:rgba(255,255,255,.88);z-index:1;line-height:1;text-shadow:0 2px 16px rgba(0,0,0,.5);transition:color .2s,transform .2s}
.tc-pts{font-family:'DM Mono',monospace;font-size:clamp(.65rem,1.4vw,1rem);color:rgba(255,255,255,.4);z-index:1;margin-top:2px;font-weight:700}
.tc:hover .tc-num{color:#fff;transform:scale(1.06)}


#sCard{z-index:100;overflow:hidden;background:#f7f6ee}

.card-player-bar{background:#0a0913;border-bottom:1px solid var(--bord);padding:5px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;min-height:46px}
.card-schips{display:flex;gap:4px;flex:1;overflow-x:auto;justify-content:center;align-items:center;scrollbar-width:none}
.card-schip{display:flex;align-items:center;gap:3px;padding:3px 8px 3px 5px;border-radius:20px;background:#1e1c2e;border:2px solid var(--bord);font-weight:700;white-space:nowrap;flex-shrink:1;min-width:0;max-width:140px;transition:all .3s}
.card-schip.cur{border-color:var(--acc);background:rgba(232,184,75,.12);box-shadow:0 0 10px rgba(232,184,75,.35);transform:scale(1.06)}
.card-schip-av{width:20px;height:20px;border-radius:50%;object-fit:cover;flex-shrink:0;display:block}
.card-schip-name{font-size:clamp(.58rem,.85vw,.72rem);font-weight:700;color:var(--txt);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.card-schip-score{font-family:'DM Mono',monospace;font-size:.75rem;font-weight:900;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.1);flex-shrink:0}
.card-schip-score.p{color:#3db88a}.card-schip-score.n{color:#d9547a}.card-schip-score.z{color:var(--dim)}
.card-tbar-right{display:flex;gap:5px;flex-shrink:0}


.cm-wrap{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;overflow:hidden;background:#f7f6ee}
.cm-hd{
  flex-shrink:0;width:100%;
  padding:14px 20px 12px;
  display:flex;align-items:center;gap:10px;
  background:var(--tc,#888);
  position:relative;overflow:hidden
}
.cm-hd::after{
  content:'';position:absolute;right:-30px;top:-30px;
  width:120px;height:120px;border-radius:50%;
  background:rgba(255,255,255,.08);pointer-events:none
}
.hd-dot{display:none}
.hd-type{
  font-family:'DM Mono',monospace;font-size:.65rem;
  letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,.9);font-weight:700
}
.hd-pts-badge{
  margin-left:auto;
  font-family:'DM Mono',monospace;font-size:.78rem;font-weight:800;
  color:rgba(255,255,255,.95);
  background:rgba(255,255,255,.2);
  padding:5px 14px;border-radius:20px;
  border:1.5px solid rgba(255,255,255,.25);
  backdrop-filter:blur(4px)
}
.hd-num{
  font-family:'DM Mono',monospace;font-size:.6rem;
  color:rgba(255,255,255,.45);flex-shrink:0
}

.cm-scroll{
  flex:1;overflow-y:auto;min-height:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#f7f6ee;
  padding:8px 0
}


.cm-body{
  width:100%;max-width:680px;
  padding:clamp(20px,3vh,40px) clamp(20px,4vw,48px);
  display:flex;flex-direction:column;gap:clamp(16px,2.8vh,28px);
  background:#f7f6ee
}

.cm-ft-wrap{width:100%;display:flex;justify-content:center;background:#f0efe6;border-top:2px solid rgba(0,0,0,.07);flex-shrink:0}
.cm-ft{
  padding:12px 16px 16px;
  display:flex;gap:8px;flex-wrap:wrap;
  width:100%;max-width:680px
}
.cm-q{
  font-family:'DM Serif Display',serif;
  font-size:clamp(1.4rem,3.5vw,2.2rem);
  line-height:1.5;color:#18172e;
  padding-bottom:6px;
  border-bottom:2px solid rgba(0,0,0,.07)
}

.cm-instr{
  font-family:'DM Mono',monospace;
  font-size:clamp(.7rem,1.4vw,.82rem);
  letter-spacing:.5px;text-transform:uppercase;
  color:#aaa;font-weight:600;
  padding-bottom:4px;
  border-bottom:1px solid rgba(0,0,0,.06)
}


.mc-opts{display:flex;flex-direction:column;gap:11px}
.mc-opt{
  padding:clamp(14px,2.2vh,20px) clamp(18px,3vw,26px);
  border-radius:14px;border:2px solid #e2e0d4;
  background:#fff;
  cursor:pointer;font-size:clamp(1rem,2vw,1.25rem);font-weight:600;color:#22203a;
  transition:border-color .18s,background .18s,transform .15s,box-shadow .18s;
  text-align:left;display:flex;align-items:center;gap:14px;width:100%;
  box-shadow:0 1px 4px rgba(0,0,0,.05)
}
.mc-opt:hover{
  border-color:var(--tc,#888);
  background:color-mix(in srgb,var(--tc,#888) 6%,#fff);
  transform:translateX(5px);
  box-shadow:0 4px 16px rgba(0,0,0,.1)
}
.opt-l{
  font-family:'DM Mono',monospace;font-size:.78rem;font-weight:800;
  width:34px;height:34px;border-radius:9px;
  background:#eeecdf;color:#888;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .18s,color .18s,transform .18s
}
.mc-opt:hover .opt-l{background:var(--tc,#888);color:#fff;transform:scale(1.1)}
.mc-opt.correct{border-color:#06d6a0!important;background:#eafaf4!important;color:#027a5a;pointer-events:none;transform:translateX(5px);box-shadow:0 4px 16px rgba(6,214,160,.18)!important}
.mc-opt.correct .opt-l{background:#06d6a0;color:#fff}
.mc-opt.wrong{border-color:#f72585!important;background:#fdeef4!important;color:#a00050;pointer-events:none}
.mc-opt.wrong .opt-l{background:#f72585;color:#fff}
.mc-opt.reveal{border-color:#06d6a0!important;background:#eafaf4!important;pointer-events:none}
.mc-opt[disabled]{pointer-events:none}


.gap-ctx{font-family:'DM Serif Display',serif;font-size:clamp(1.2rem,2.8vw,1.9rem);color:#18172e;line-height:1.9;padding:18px 22px;background:#fff;border-radius:14px;border:2px solid #e2e0d4;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.gap-lbl{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:7px}
.gap-in{width:100%;border:2px solid #ddd;border-radius:12px;padding:15px 20px;font-family:'DM Serif Display',serif;font-size:clamp(1.15rem,2.8vw,1.5rem);color:#18172e;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.gap-in:focus{border-color:var(--tc,#888);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc,#888) 20%,transparent)}
.gap-in.ok{border-color:#06d6a0;background:#eafaf4;color:#027a5a;box-shadow:0 0 0 3px rgba(6,214,160,.15)}
.gap-in.no{border-color:#f72585;background:#fdeef4;color:#a00050;box-shadow:0 0 0 3px rgba(247,37,133,.12)}


.wo-area{display:flex;flex-direction:column;gap:12px}
.wo-label{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:#aaa;margin-bottom:2px}
.wo-zone{min-height:56px;border:2px dashed #d4d2c0;border-radius:14px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;background:#fff;transition:border-color .2s,box-shadow .2s}
.wo-zone:has(.ww){border-color:#c8c6b4;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.wo-zone.done{border-style:solid}
.wo-ph{font-family:'DM Mono',monospace;font-size:.68rem;color:#ccc;pointer-events:none;user-select:none}
.wo-bank{display:flex;flex-wrap:wrap;gap:7px;min-height:50px;padding:10px 12px;background:#eeeede;border-radius:12px;border:1.5px solid #e0dec8}
.ww{padding:8px 14px;border-radius:10px;background:#fff;font-family:'DM Sans',sans-serif;font-size:clamp(.95rem,1.9vw,1.2rem);font-weight:700;color:#22203a;cursor:pointer;border:2px solid #e0dec8;transition:all .2s;user-select:none;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.ww.punct{padding:8px 7px;min-width:0}
.ww:hover{border-color:var(--tc,#888);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ww:active{transform:scale(.95)}
.ww.placed{background:#f0f0e8;border-color:#c8c6b4;color:#22203a}
.ww.placed:hover{background:#e8e6d8;border-color:#aaa;transform:translateY(-2px)}

.wo-slot{
  min-width:52px;height:38px;border-radius:10px;
  border:2px dashed #d0cec0;background:#f7f6ee;
  display:inline-flex;align-items:center;justify-content:center;
  cursor:default;transition:border-color .15s
}
.wo-slot.filled{border:none;padding:0;min-width:0;height:auto;background:none}

.ww-locked{background:#f0efe6!important;border-color:#d0cec0!important;color:#aaa!important;cursor:default!important;pointer-events:none;box-shadow:none!important;transform:none!important}
.ww.w-ok{border-color:#06d6a0!important;background:#eafaf4!important;color:#027a5a!important;box-shadow:0 2px 8px rgba(6,214,160,.25)!important}
.ww.w-no{border-color:#f72585!important;background:#fdeef4!important;color:#a00050!important;box-shadow:0 2px 8px rgba(247,37,133,.2)!important}


.ooo-opts{display:flex;flex-direction:column;gap:11px}
.ooo-opt{
  padding:clamp(14px,2.2vh,20px) clamp(18px,3vw,26px);
  border-radius:14px;border:2px solid #e2e0d4;background:#fff;
  cursor:pointer;font-family:'DM Serif Display',serif;
  font-size:clamp(1rem,2vw,1.25rem);font-weight:600;color:#22203a;
  transition:border-color .18s,background .18s,transform .15s,box-shadow .18s;
  text-align:left;display:flex;align-items:center;gap:14px;width:100%;
  box-shadow:0 1px 4px rgba(0,0,0,.05)
}
.ooo-opt:hover{border-color:var(--tc,#888);background:color-mix(in srgb,var(--tc,#888) 6%,#fff);transform:translateX(5px);box-shadow:0 4px 14px rgba(0,0,0,.1)}
.ooo-l{
  font-family:'DM Mono',monospace;font-size:.78rem;font-weight:800;
  width:34px;height:34px;border-radius:9px;
  background:#eeecdf;color:#888;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .18s,color .18s,transform .18s
}
.ooo-opt:hover .ooo-l{background:var(--tc,#888);color:#fff;transform:scale(1.1)}
.ooo-opt.correct{border-color:#06d6a0!important;background:#eafaf4!important;color:#027a5a;pointer-events:none;transform:translateX(5px)}
.ooo-opt.correct .ooo-l{background:#06d6a0;color:#fff}
.ooo-opt.wrong{border-color:#f72585!important;background:#fdeef4!important;color:#a00050;pointer-events:none}
.ooo-opt.wrong .ooo-l{background:#f72585;color:#fff}
.ooo-opt.reveal{border-color:#06d6a0!important;background:#eafaf4!important;pointer-events:none}
.ooo-opt.reveal .ooo-l{background:#06d6a0;color:#fff}


.err-sent{font-family:'DM Serif Display',serif;font-size:clamp(1.2rem,2.8vw,1.9rem);line-height:2.1;padding:18px 22px;background:#fff;border-radius:14px;border:2px solid #e2e0d4;box-shadow:0 1px 4px rgba(0,0,0,.05);color:#18172e;word-spacing:2px}
.ew{cursor:pointer;padding:3px 6px;border-radius:7px;transition:all .18s;border-bottom:2.5px solid transparent;color:#18172e;display:inline}
.ew.punct{padding:3px 1px;margin-left:-4px}
.ew:hover{background:#fdecc8;border-bottom-color:#d97706;color:#18172e}
.ew.sel{background:#fde8b8;border-bottom-color:#d97706;font-weight:700;color:#18172e}
.ew.correct{background:#eafaf4;color:#027a5a!important;border-bottom-color:#06d6a0;pointer-events:none}
.ew.wrong{background:#fdeef4;color:#a00050!important;border-bottom-color:#f72585;pointer-events:none}
.ew.reveal-c{background:#eafaf4;color:#027a5a!important;border-bottom-color:#06d6a0;pointer-events:none}
.err-in{width:100%;border:2px solid #ddd;border-radius:12px;padding:15px 20px;font-family:'DM Serif Display',serif;font-size:clamp(1.1rem,2.6vw,1.45rem);color:#18172e;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.err-in:focus{border-color:var(--tc,#888);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc,#888) 20%,transparent)}
.err-in.ok{border-color:#06d6a0;background:#eafaf4;color:#027a5a}
.err-in.no{border-color:#f72585;background:#fdeef4;color:#a00050}


.read-txt{background:#fff;border-left:5px solid var(--tc,#888);border-radius:0 14px 14px 0;padding:clamp(16px,2.2vh,26px) clamp(18px,3vw,30px);font-size:clamp(1.05rem,2.2vw,1.4rem);line-height:2.2;color:#18172e;display:flex;flex-wrap:wrap;gap:0 4px;align-items:baseline;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.rw{cursor:pointer;padding:2px 5px;border-radius:5px;transition:background .15s;border-bottom:2px solid transparent;display:inline-block;color:#18172e}
.rw:hover{background:#fdecc8;border-bottom-color:#d97706}
.rw.sel{background:#fde8b8;border-bottom-color:#d97706;font-weight:700}
.read-hint{font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:#bbb;margin-top:-8px}


.speak-box{background:#fff;border:2px solid #e2e0d4;border-radius:14px;padding:24px 28px;font-family:'DM Serif Display',serif;font-size:clamp(1.2rem,2.8vw,1.75rem);color:#18172e;line-height:1.7;box-shadow:0 1px 6px rgba(0,0,0,.06)}

<script>

let AC=null;
function getAC(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  return AC;
}
function playTone(freq,type,dur,vol=0.18,delay=0){
  try{
    const ac=getAC();if(!ac)return;
    if(ac.state==='suspended')ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime+delay);
    g.gain.setValueAtTime(0,ac.currentTime+delay);
    g.gain.linearRampToValueAtTime(vol,ac.currentTime+delay+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+delay+dur);
    o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+0.05);
  }catch(e){}
}
const SFX={
  click(){playTone(640,'sine',.04,.05)},
  place(){playTone(520,'sine',.05,.06);playTone(780,'sine',.04,.05,.04)},
  correct(){[0,.08,.16].forEach((d,i)=>playTone([523,659,784][i],'sine',.12,.07,d))},
  wrong(){playTone(300,'sine',.1,.06);playTone(260,'sine',.12,.06,.07)},
  cardFlip(){playTone(900,'sine',.03,.05);playTone(1200,'sine',.025,.04,.03)},
  confetti(){[0,.06,.12,.18,.24].forEach((d,i)=>playTone([784,1047,1319,1568,2093][i],'sine',.08,.06,d))},
  back(){playTone(420,'sine',.06,.06)},
  nextPlayer(){playTone(660,'sine',.04,.07);playTone(880,'sine',.04,.07,.07)}
};


const CD=[

// ===== MC =====
// PS — A2 easy
{type:'mc',topic:'ps',col:'#4A90E2',pts:10,q:'She ___ to the supermarket yesterday.',opts:['go','goes','went','going'],ans:2,exp:'"Yesterday" signals a completed past action → Past Simple. "Go" is irregular: go → went.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:10,q:'They ___ not finish the project on time.',opts:['did','do','was','were'],ans:0,exp:'Past Simple negative: did + not + base verb.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:10,q:'___ you call her back yesterday?',opts:['Were','Did','Do','Was'],ans:1,exp:'Past Simple question: Did + subject + base verb.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:10,q:'He ___ his phone on the bus.',opts:['leave','leaved','left','lefted'],ans:2,exp:'"Leave" is irregular: leave → left. ❌ "Leaved" and "lefted" don\'t exist.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:10,q:'We ___ a great time at the festival.',opts:['have','has','had','having'],ans:2,exp:'"Have" is irregular: have → had.'},
// PS — B1 harder
{type:'mc',topic:'ps',col:'#4A90E2',pts:20,q:'She ___ three cups of coffee before the meeting even started.',opts:['drinks','drank','was drinking','drunk'],ans:1,exp:'Completed sequence of past actions → Past Simple. "Drink" is irregular: drink → drank.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:20,q:'Which sentence is grammatically CORRECT?',opts:['Did she went home?','She didn\'t went home.','She went home, didn\'t she?','She didn\'t go home, did she?'],ans:3,exp:'Question tag after negative Past Simple: "didn\'t she?" → no. "She didn\'t go home, did she?" — correct negative + positive tag.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:20,q:'I ___ her twice but she never replied.',opts:['message','messaged','was messaging','did messaged'],ans:1,exp:'Completed attempts in the past → Past Simple: messaged. "Did messaged" is never correct.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:20,q:'They ___ together for years before the band split up.',opts:['performed','were performing','perform','did performed'],ans:0,exp:'A completed state/situation over a period that is now over → Past Simple: performed.'},
{type:'mc',topic:'ps',col:'#4A90E2',pts:20,q:'What ___ she say when you told her the news?',opts:['does','did','was','were'],ans:1,exp:'Past Simple question with "what": What did + subject + base verb?'},

// PC — A2 easy
{type:'mc',topic:'pc',col:'#50E3C2',pts:10,q:'At 8pm last night I ___ dinner.',opts:['cook','cooked','was cooking','am cooking'],ans:2,exp:'"At 8pm last night" = a specific moment in progress → Past Continuous: was cooking.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:10,q:'They ___ football when it started to rain.',opts:['played','play','were playing','are playing'],ans:2,exp:'Ongoing background action interrupted by a sudden event → Past Continuous: were playing.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:10,q:'What ___ you doing when I called?',opts:['did','was','were','are'],ans:2,exp:'Past Continuous question with "you" → were.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:10,q:'She ___ not listening to the teacher.',opts:['did','was','were','is'],ans:1,exp:'Negative Past Continuous with "she" → was not.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:10,q:'While he ___ the dishes, she was setting the table.',opts:['washes','was washing','washed','is washing'],ans:1,exp:'Two simultaneous ongoing past actions → both Past Continuous.'},
// PC — B1 harder
{type:'mc',topic:'pc',col:'#50E3C2',pts:20,q:'Which sentence uses Past Continuous INCORRECTLY?',opts:['She was thinking about leaving.','He was considering the offer.','They were knowing the answer.','I was wondering what to do.'],ans:2,exp:'"Know" is a stative verb (it describes a state, not an action). Stative verbs cannot be used in continuous tenses.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:20,q:'I ___ to her for an hour before I realised she wasn\'t listening.',opts:['talked','was talking','did talk','talk'],ans:1,exp:'An ongoing action over a period in the past → Past Continuous: was talking.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:20,q:'Which time expression fits Past Continuous BEST?',opts:['last Monday','in 2010','at 3 o\'clock yesterday','two weeks ago'],ans:2,exp:'"At 3 o\'clock yesterday" = a specific ongoing moment → Past Continuous. The others are general past times.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:20,q:'She looked exhausted. She ___ non-stop all morning.',opts:['worked','works','was working','is working'],ans:2,exp:'An ongoing action in progress → Past Continuous: was working.'},
{type:'mc',topic:'pc',col:'#50E3C2',pts:20,q:'While I ___ a shower, somebody knocked on the door.',opts:['took','was taking','take','am taking'],ans:1,exp:'"While" introduces the background ongoing action → Past Continuous.'},

// ADV — A2 easy
{type:'mc',topic:'adv',col:'#F5A623',pts:10,q:'She spoke very ___ and everyone heard her.',opts:['loud','loudly','louder','loudness'],ans:1,exp:'After a verb, use an adverb of manner: loudly. "Loud" is an adjective.'},
{type:'mc',topic:'adv',col:'#F5A623',pts:10,q:'He ran ___ to catch the bus.',opts:['quick','quickly','quicker','quickest'],ans:1,exp:'"Quick" is an adjective. After a verb we need an adverb: quickly.'},
{type:'mc',topic:'adv',col:'#F5A623',pts:10,q:'Please drive ___. The roads are icy.',opts:['careful','carefully','more careful','carefulness'],ans:1,exp:'"Careful" is an adjective. The adverb form is "carefully".'},
{type:'mc',topic:'adv',col:'#F5A623',pts:10,q:'She runs really ___. She never loses.',opts:['fastly','fast','more fast','fastest'],ans:1,exp:'"Fast" is already an adverb. ❌ "Fastly" does not exist.'},
{type:'mc',topic:'adv',col:'#F5A623',pts:10,q:'He speaks English very ___.',opts:['good','goodly','well','better'],ans:2,exp:'The adverb form of "good" is "well". ❌ "Goodly" does not exist.'},
// ADV — B1 harder
{type:'mc',topic:'adv',col:'#F5A623',pts:20,q:'She ___ managed to finish before the deadline.',opts:['near','nearly','narrow','close'],ans:1,exp:'"Nearly" = almost. "Near" as an adverb means physically close to a place, not "almost".'},
{type:'mc',topic:'adv',col:'#F5A623',pts:20,q:'He ___ ever arrives on time — maybe once a month.',opts:['hard','hardly','late','barely'],ans:1,exp:'"Hardly ever" = very rarely. "Hard" = with effort. "Lately" = recently. "Hardly ever" fits "maybe once a month".'},
{type:'mc',topic:'adv',col:'#F5A623',pts:20,q:'Which sentence has a grammar error?',opts:['She spoke clearly and confidently.','He reacted angrily and defensively.','She answered correctly and honest.','They worked quickly and efficiently.'],ans:2,exp:'"Honest" is an adjective. Both words in a paired list must match: correctly and honestly (adverb + adverb).'},
{type:'mc',topic:'adv',col:'#F5A623',pts:20,q:'She ___ agreed with everything he said, which looked suspicious.',opts:['ready','readiness','readily','reading'],ans:2,exp:'"Readily" = without hesitation, willingly. "Ready" is an adjective — cannot modify a verb.'},
{type:'mc',topic:'adv',col:'#F5A623',pts:20,q:'The surgeon performed the operation ___. Not a single complication.',opts:['flaw','flawless','flawlessly','flawed'],ans:2,exp:'"Flawlessly" = without any mistakes. "Flawless" is an adjective; the adverb is "flawlessly".'},

// ALL — A2+/B1 mix
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'While she ___ dinner, her friend called.',opts:['cooked','cooks','was cooking','is cooking'],ans:2,exp:'"While" + an ongoing background action → Past Continuous.'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'He walked ___ into the room so he wouldn\'t wake anyone.',opts:['quiet','quietness','quieter','quietly'],ans:3,exp:'After a verb we need an adverb of manner: quietly.'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'They ___ homework when mum came home.',opts:['did','were doing','do','have done'],ans:1,exp:'"When mum came home" = interruption → the ongoing action uses Past Continuous: were doing.'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'She sang really ___ at the concert.',opts:['beautiful','beautifully','beauty','more beautiful'],ans:1,exp:'After a verb we need an adverb: beautifully (= in a beautiful way).'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'I ___ to her for an hour and she ___ carefully the whole time.',opts:['talked / listened','was talking / was listening','talked / was listening','was talking / listened'],ans:1,exp:'Two simultaneous ongoing past actions → both Past Continuous.'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'He answered all the questions ___.',opts:['correct','correctly','more correct','correction'],ans:1,exp:'After a verb we need an adverb: correctly. "Correct" is an adjective.'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'What ___ she ___ when the fire alarm went off?',opts:['did / do','was / doing','did / doing','was / did'],ans:1,exp:'Past Continuous question: What was + subject + doing?'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'The dog ___ when the postman ___.',opts:['barked / was arriving','was barking / arrived','barks / arrived','barked / arrived'],ans:1,exp:'Ongoing background action (barking) + sudden interruption (arrived) → PC + PS.'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'She spoke so ___ that the whole room went silent.',opts:['compelling','compelled','compellingly','compulsion'],ans:2,exp:'After a verb we need an adverb: compellingly (= in a compelling, powerful way).'},
{type:'mc',topic:'all',col:'#D0021B',pts:20,q:'I woke up late, ___ quickly and ran to the station.',opts:['dress','dressed','was dressing','dressing'],ans:1,exp:'A sequence of completed past actions → all Past Simple.'},

// ===== GAP =====
// PS — A2
{type:'gap',topic:'ps',col:'#4A90E2',pts:15,before:'I',after:'my homework before dinner.',verb:'do',ans:'did',exp:'"Do" is irregular: do → did. Completed past action → Past Simple.'},

{type:'read',topic:'pc',col:'#9013FE',pts:30,text:'When the director walked into the conference room, the scene was chaotic. Two colleagues were arguing heatedly near the whiteboard. Three people were typing urgently on their laptops. One junior analyst was standing at the back, looking unsure whether to speak. Nobody noticed the director at first.',q:'Describe THREE things that were happening when the director arrived. Why is Past Continuous used here?',example:'"Were arguing", "were typing", "was standing" — Past Continuous shows ongoing background actions at the exact moment of interruption.'},
{type:'read',topic:'pc',col:'#9013FE',pts:30,text:'I was walking home from work when I noticed something strange. A man was standing very still outside my building. He was staring at the second floor window and holding something in his hand. My heart was beating fast. I crossed the road slowly and called my neighbour.',q:'What was happening when the narrator noticed something strange? Find THREE Past Continuous verbs and explain what they show.',example:'"Was walking" — ongoing background action. "Was standing", "was staring", "was holding" — simultaneous ongoing actions at that moment. PC creates atmosphere and suspense.'},

{type:'read',topic:'adv',col:'#9013FE',pts:30,text:'"Hard" and "hardly" look similar but mean completely different things. "She worked hard" means she put in great effort. "She hardly worked" means she did almost nothing. The same applies to "late" and "lately": "He arrived late" means he wasn\'t on time; "He\'s been working hard lately" means recently. Getting these pairs wrong can completely change your meaning.',q:'What is the difference between "hard" and "hardly"? Give one example of each from the text.',example:'"Hard" = with effort: "she worked hard." "Hardly" = almost not: "she hardly worked." They are NOT interchangeable.'},

const TN={mc:'Multiple Choice',gap:'Fill the Gap',wo:'Word Order',ooo:'Odd One Out',err:'Fix the Error',read:'Read & Answer',speak:'Speak!'};
const PC=['#f7c948','#4cc9f0','#f72585','#06d6a0','#a78bfa','#fb923c'];
const EM=Array.from({length:11},(_,i)=>`/assets/av${i+1}.png`);


let topic='all',cardCount=9,players=[],curP=0,deck=[],doneSet=new Set(),avIdx=null;


document.querySelectorAll('.tpill').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tpill').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');topic=b.dataset.t;
}));
document.querySelectorAll('.cpill').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.cpill').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');cardCount=+b.dataset.n;
}));

function addP(n,em){
  if(players.length>=6)return;
  const i=players.length;
  players.push({name:n||'Player '+(i+1),av:em||EM[i]||'😊',color:PC[i%PC.length],score:0});
  renderP();
}
function renderP(){
  const el=document.getElementById('pList');el.innerHTML='';
  players.forEach((p,i)=>{
    const r=document.createElement('div');r.className='prow';
    r.innerHTML=`<div class="pav" data-i="${i}"><img src="${p.av}" alt=""></div>
      <input class="pname" value="${p.name}" placeholder="Name" data-i="${i}" maxlength="16">
      <div class="pdot" style="background:${p.color}"></div>
      ${players.length>1?`<button class="prmv" data-i="${i}">✕</button>`:''}`;
    el.appendChild(r);
  });
  el.querySelectorAll('.pav').forEach(e=>e.addEventListener('click',()=>openAv(+e.dataset.i)));
  el.querySelectorAll('.pname').forEach(e=>e.addEventListener('input',()=>{players[+e.dataset.i].name=e.value||'Player '+(+e.dataset.i+1);}));
  el.querySelectorAll('.prmv').forEach(e=>e.addEventListener('click',()=>{players.splice(+e.dataset.i,1);renderP();}));
}
function openAv(i){
  avIdx=i;
  const g=document.getElementById('avGrid');g.innerHTML='';
  EM.forEach(src=>{
    const d=document.createElement('div');d.className='av-o';
    d.style.cssText='overflow:hidden;padding:0';
    d.innerHTML=`<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="">`;
    d.onclick=()=>{players[avIdx].av=src;renderP();document.getElementById('avModal').classList.remove('on');};
    g.appendChild(d);
  });
  document.getElementById('avModal').classList.add('on');
}
document.getElementById('avModal').addEventListener('click',e=>{if(e.target===document.getElementById('avModal'))document.getElementById('avModal').classList.remove('on');});
document.getElementById('addPBtn').addEventListener('click',()=>addP());
addP('Player 1');addP('Player 2');

document.getElementById('startBtn').addEventListener('click',()=>{
  const pool=(topic==='all'?CD:CD.filter(c=>c.topic===topic)).sort(()=>Math.random()-.5).slice(0,cardCount);
  if(!pool.length){toast('No cards for this topic!');return;}
  deck=pool;doneSet=new Set();curP=0;
  players.forEach(p=>p.score=0);
  showScr('sTable');buildGrid();renderChips();
});


function buildGrid(){
  const grid=document.getElementById('cardGrid');
  if(!grid)return;
  grid.innerHTML='';
  const n=deck.length;
  if(!n)return;
  const tbar=document.querySelector('.tbar');
  const tbarH=tbar?tbar.getBoundingClientRect().height:52;
  const W=Math.max(window.innerWidth||320,200);
  const H=Math.max((window.innerHeight||600)-tbarH,100);
  const GAP=10;
  
  let bestCols=1,bestScore=-1;
  
  let perfectCols=[];
  for(let cols=1;cols<=12;cols++){
    if(n%cols===0)perfectCols.push(cols);
  }
  for(let cols=1;cols<=12;cols++){
    const rows=Math.ceil(n/cols);
    const cw=(W-GAP*(cols+1))/cols;
    const ch=(H-GAP*(rows+1))/rows;
    if(cw<60||ch<50)continue;
    const aspect=cw/ch;
    const aspectPenalty=aspect<0.5||aspect>2.5?0.2:aspect<0.7||aspect>2?0.7:1;
    const remainder=n%cols;
    const waste=remainder===0?0:(cols-remainder)/cols;
    
    const wastePenalty=remainder===0?1.5:1-waste*0.8;
    const score=cw*ch*aspectPenalty*wastePenalty;
    if(score>bestScore){bestScore=score;bestCols=cols;}
  }
  const rows=Math.ceil(n/bestCols);
  const remainder=n%bestCols;
  const lastRowStart=remainder===0?-1:n-remainder; 
  grid.style.cssText=[
    'display:grid',
    `grid-template-columns:repeat(${bestCols},1fr)`,
    `grid-template-rows:repeat(${rows},1fr)`,
    `gap:${GAP}px`,
    `padding:${GAP}px`,
    'flex:1',
    'overflow:hidden',
    `height:${H}px`,
    'width:100%',
    'box-sizing:border-box'
  ].join(';')+';';
  deck.forEach((c,i)=>{
    const el=document.createElement('div');
    el.className='tc'+(doneSet.has(i)?' done':'');
    el.id='tc'+i;
    el.innerHTML=`<div class="tc-num">${i+1}</div>`;
    
    if(lastRowStart>0&&i>=lastRowStart){
      
      const lastCount=remainder;
      const span=Math.floor(bestCols/lastCount);
      const extra=bestCols%lastCount;
      const posInRow=i-lastRowStart;
      const mySpan=posInRow<extra?span+1:span;
      el.style.gridColumn='span '+mySpan;
    }
    el.addEventListener('click',()=>{SFX.cardFlip();openCard(i);});
    grid.appendChild(el);
  });
}
function reGrid(){if(deck.length)buildGrid();}
window.addEventListener('resize',reGrid);

document.getElementById('nextPBtn').addEventListener('click',()=>{
  curP=(curP+1)%players.length;
  SFX.nextPlayer();renderChips();
  toast(`${players[curP].av} ${players[curP].name}'s turn!`);
});
document.getElementById('endBtn').addEventListener('click',showWin);

function renderChips(){
  
  const el=document.getElementById('scoreChips');el.innerHTML='';
  players.forEach((p,i)=>{
    const c=document.createElement('div');c.className='schip'+(i===curP?' cur':'');
    const cls=p.score>0?'p':p.score<0?'n':'z';
    const shortName=p.name.length>10?p.name.slice(0,9)+'…':p.name;
    c.innerHTML=`<img class="schip-av" src="${p.av}" alt=""><span class="schip-name">${shortName}</span><span class="ssc ${cls}">${p.score>0?'+':''}${p.score}</span>`;
    el.appendChild(c);
  });
  renderCardChips();
}

function renderCardChips(){
  const el=document.getElementById('cardScoreChips');if(!el)return;
  el.innerHTML='';
  players.forEach((p,i)=>{
    const c=document.createElement('div');c.className='card-schip'+(i===curP?' cur':'');
    const cls=p.score>0?'p':p.score<0?'n':'z';
    const shortName=p.name.length>10?p.name.slice(0,9)+'…':p.name;
    c.innerHTML=`<img class="card-schip-av" src="${p.av}" alt=""><span class="card-schip-name">${shortName}</span><span class="card-schip-score ${cls}">${p.score>0?'+':''}${p.score}</span>`;
    el.appendChild(c);
  });
}

function animateScore(txt,isOk){
  
  const allChips=[...document.querySelectorAll('.schip,.card-schip')];
  let found=false;
  allChips.forEach((chip,idx)=>{
    const nameEl=chip.querySelector('.schip-name,.card-schip-name');
    if(nameEl&&nameEl.textContent===players[curP].name&&!found){
      found=true;
      const pop=document.createElement('div');
      pop.className='score-pop '+(isOk?'pos':'neg');
      pop.textContent=txt;
      const r=chip.getBoundingClientRect();
      pop.style.left=(r.left+r.width/2-20)+'px';
      pop.style.top=(r.top)+'px';
      document.body.appendChild(pop);
      setTimeout(()=>pop.remove(),1200);
    }
  });
}


function openCard(i){
  const c=deck[i];
  renderCardChips();
  showScr('sCard');

  const hd=`<div class="cm-hd" style="--tc:${c.col}">
    <div class="hd-dot"></div>
    <div class="hd-type">${TN[c.type]}</div>
    <div style="flex:1"></div>
    <div class="hd-pts-badge">+${c.pts} pts</div>
    <div class="hd-num">#${i+1}</div>
  </div>`;

  let body='',foot='';

  if(c.type==='mc'){
    const opts=c.opts.map((o,j)=>`<button class="mc-opt" data-j="${j}" onclick="doMC(${i},${j})"><span class="opt-l">${'ABCD'[j]}</span>${o}</button>`).join('');
    body=`<div class="cm-q">${c.q}</div><div class="mc-opts">${opts}</div><div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button></div>`;
  }
  else if(c.type==='gap'){
    body=`<div class="cm-instr">Fill in the correct form of: <strong>${c.verb}</strong></div>
      <div class="gap-ctx">${c.before} <strong>_______</strong> ${c.after}</div>
      <div><div class="gap-lbl">Your answer</div>
      <input id="gapIn" class="gap-in" style="--tc:${c.col}" placeholder="type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button><button class="ftb ftb-chk" onclick="doGap(${i})">Check ✓</button></div>`;
  }
  else if(c.type==='wo'){
    const words=c.words;
    const isPunct=w=>/^[.,!?;:,]$/.test(w);
    
    const bankWords=[...words].filter(w=>!isPunct(w)).sort(()=>Math.random()-.5);
    const bankChips=bankWords.map((w,j)=>`<div class="ww" data-w="${w}" onclick="woClick(this,${i})">${w}</div>`).join('');
    
    const dropItems=words.map((w,pos)=>{
      if(isPunct(w)){
        return `<div class="ww ww-locked punct" data-w="${w}" data-pos="${pos}">${w}</div>`;
      } else {
        return `<div class="wo-slot" data-pos="${pos}" onclick="woSlotClick(this,${i})"></div>`;
      }
    }).join('');
    body=`<div class="cm-instr">Put the words in the correct order:</div>
      <div class="wo-area">
        <div class="wo-label">Your sentence — tap a word to add it:</div>
        <div class="wo-zone" id="woDrop" style="--tc:${c.col}">${dropItems}</div>
        <div class="wo-label">Word bank — tap to add:</div>
        <div class="wo-bank" id="woBank">${bankChips}</div>
      </div>
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft">
      <button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
      <button class="ftb ftb-chk" style="background:rgba(0,0,0,.06);border-color:#ccc;color:#666" onclick="woClear()">↺ Reset</button>
      <button class="ftb ftb-chk" onclick="doWO(${i})">Check ✓</button>
    </div>`;
  }
  else if(c.type==='ooo'){
    const opts=c.opts.map((o,j)=>`<button class="ooo-opt" data-j="${j}" onclick="doOOO(${i},${j})"><span class="ooo-l">${'ABCD'[j]}</span>${o}</button>`).join('');
    body=`<div class="cm-q">${c.q}</div><div class="ooo-opts">${opts}</div><div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button></div>`;
  }
  else if(c.type==='err'){
    const words=c.sentence.map((w,j)=>{
      const isPunct=/^[.,!?;:]$/.test(w);
      return `<span class="ew${isPunct?' punct':''}" data-j="${j}" onclick="pickEW(this,${c.errIdx})">${w}</span>`;
    }).join(' ');
    body=`<div class="cm-instr">Tap the wrong word, then type the correction:</div>
      <div class="err-sent" style="--tc:${c.col}">${words}</div>
      <input id="errIn" class="err-in" style="--tc:${c.col}" placeholder="type the correct word…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft"><button class="ftb ftb-back" onclick="closeCard()">✕ Back</button><button class="ftb ftb-chk" onclick="doErr(${i})">Check ✓</button></div>`;
  }
  else if(c.type==='read'){
    const parts=c.text.split(/(\s+)/);
    const clickable=parts.map(w=>/^\s+$/.test(w)?w:`<span class="rw" onclick="rwClick(this)">${w}</span>`).join('');
    body=`<div class="read-txt" id="readTxt" style="--tc:${c.col}">${clickable}</div>
      <div class="cm-q">${c.q}</div>
      <div class="read-hint">👆 Tap words to highlight your answer</div>
      <div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft">
      <button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
      <button class="ftb ftb-show" id="showEx">Show answer</button>
    </div>`;
  }
  else if(c.type==='speak'){
    body=`<div class="speak-box">${c.prompt}</div><div class="fb" id="fb"></div>`;
    foot=`<div class="cm-ft">
      <button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
      <button class="ftb ftb-show" id="showEx">Show example</button>
    </div>`;
  }

  document.getElementById('cardModal').innerHTML=
    hd+
    `<div class="cm-scroll"><div class="cm-body">${body}</div></div>`+
    `<div class="cm-ft-wrap">${foot}</div>`;
  
  const se=document.getElementById('showEx');
  if(se) se.addEventListener('click',()=>{
    const fb=document.getElementById('fb');
    fb.className='fb show ok';
    fb.innerHTML='<strong>Answer / Example:</strong><br>'+c.example;
    se.style.display='none';
    
    const ft=document.querySelector('.cm-ft');
    if(ft&&!ft.querySelector('.ftb-ok')){
      ft.insertAdjacentHTML('beforeend',`
        <button class="ftb ftb-no" onclick="autoGrade(${i},false)">✗ Wrong</button>
        <button class="ftb ftb-ok" onclick="autoGrade(${i},true)">✓ Correct</button>`);
    }
  });
}

function closeCard(){SFX.back();showScr('sTable');}



let woSelected=null;
window.woClick=function(chip){
  SFX.place();
  if(chip.classList.contains('ww-locked'))return;
  const bank=document.getElementById('woBank');
  const drop=document.getElementById('woDrop');
  if(!bank||!drop)return;
  if(chip.parentElement===bank){
    
    const emptySlot=drop.querySelector('.wo-slot:not(.filled)');
    if(!emptySlot)return;
    chip.classList.add('placed');
    emptySlot.classList.add('filled');
    emptySlot.appendChild(chip);
  } else {
    
    const slot=chip.parentElement;
    chip.classList.remove('placed','w-ok','w-no');
    bank.appendChild(chip);
    slot.classList.remove('filled');
    slot.innerHTML='';
  }
};
window.woSlotClick=function(slot){
  
  const chip=slot.querySelector('.ww');
  if(chip)woClick(chip);
};
window.woClear=function(){
  SFX.click();
  const bank=document.getElementById('woBank'),drop=document.getElementById('woDrop');
  if(!bank||!drop)return;
  drop.querySelectorAll('.wo-slot.filled').forEach(slot=>{
    const chip=slot.querySelector('.ww');
    if(chip){chip.classList.remove('placed','w-ok','w-no');bank.appendChild(chip);}
    slot.classList.remove('filled');slot.innerHTML='';
  });
  drop.querySelectorAll('.ww-locked').forEach(ch=>{ch.classList.remove('w-ok','w-no');});
  drop.classList.remove('done');
};
window.doWO=function(ci){
  SFX.click();
  const c=deck[ci];
  const drop=document.getElementById('woDrop');
  
  const tokens=[...drop.children].map(el=>{
    if(el.classList.contains('ww-locked'))return el.dataset.w;
    if(el.classList.contains('wo-slot')){
      const chip=el.querySelector('.ww');
      return chip?chip.dataset.w:'';
    }
    return '';
  });
  const placed=tokens.join(' ').trim();
  const ok=placed===c.ans.trim();
  drop.classList.add('done');
  
  drop.querySelectorAll('.wo-slot.filled .ww').forEach(ch=>{
    ch.style.pointerEvents='none';
    ch.classList.add(ok?'w-ok':'w-no');
  });
  
  document.querySelectorAll('#woBank .ww').forEach(ch=>ch.style.pointerEvents='none');
  document.querySelectorAll('.wo-slot:not(.filled)').forEach(s=>s.style.pointerEvents='none');
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};


window.rwClick=function(el){SFX.click();el.classList.toggle('sel');};


window.doMC=function(ci,chosen){
  SFX.click();
  const c=deck[ci];
  document.querySelectorAll('.mc-opt').forEach((o,j)=>{
    o.setAttribute('disabled','true');
    if(j===chosen)o.classList.add(chosen===c.ans?'correct':'wrong');
    else if(j===c.ans&&chosen!==c.ans)o.classList.add('reveal');
  });
  const ok=chosen===c.ans;
  showFB(ok,c.exp);
  if(ok)confetti();
  
  setTimeout(()=>autoGrade(ci,ok),600);
};


window.doGap=function(ci){
  SFX.click();
  const c=deck[ci];
  const inp=document.getElementById('gapIn');
  const val=(inp.value||'').trim().toLowerCase();
  const ok=val===c.ans.toLowerCase();
  inp.classList.add(ok?'ok':'no');inp.setAttribute('readonly','true');
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};


window.doOOO=function(ci,chosen){
  SFX.click();
  const c=deck[ci];
  document.querySelectorAll('.ooo-opt').forEach((o,j)=>{
    o.setAttribute('disabled','true');
    if(j===chosen)o.classList.add(chosen===c.ans?'correct':'wrong');
    else if(j===c.ans&&chosen!==c.ans)o.classList.add('reveal');
  });
  const ok=chosen===c.ans;
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};


let selEW=null;
window.pickEW=function(el,errIdx){
  SFX.click();
  document.querySelectorAll('.ew').forEach(e=>e.classList.remove('sel'));
  el.classList.add('sel');
  selEW=+el.dataset.j;
  
  const inp=document.getElementById('errIn');
  if(inp&&!inp.readOnly)inp.focus();
};
window.doErr=function(ci){
  SFX.click();
  const c=deck[ci];
  const inp=document.getElementById('errIn');
  const val=(inp.value||'').trim().toLowerCase();
  const wOk=selEW===c.errIdx;
  const fOk=val===c.fix.toLowerCase()||val.replace(/'/g,"'")===c.fix.toLowerCase().replace(/'/g,"'");
  const ok=wOk&&fOk;
  document.querySelectorAll('.ew').forEach((e,j)=>{
    e.style.pointerEvents='none';
    if(j===selEW)e.classList.add(wOk?'correct':'wrong');
    if(!wOk&&j===c.errIdx)e.classList.add('reveal-c');
  });
  inp.classList.add(ok?'ok':'no');inp.setAttribute('readonly','true');
  showFB(ok,c.exp);
  if(ok)confetti();
  setTimeout(()=>autoGrade(ci,ok),600);
};

function replFoot(ci){
  const ft=document.querySelector('.cm-ft');if(!ft)return;
  ft.innerHTML=`<button class="ftb ftb-back" onclick="closeCard()">✕ Back</button>
    <button class="ftb ftb-no" onclick="grade(${ci},false)">✗ Wrong</button>
    <button class="ftb ftb-ok" onclick="grade(${ci},true)">✓ Correct</button>`;
}

window.autoGrade=function(ci,ok){
  const c=deck[ci];
  const pts=ok?c.pts:-3;
  if(ok){
    players[curP].score+=c.pts;
    SFX.correct();
    animateScore('+'+c.pts,true);
    toast('+'+c.pts+' pts → '+players[curP].name+'!');
  } else {
    players[curP].score-=3;
    SFX.wrong();
    animateScore('-3',false);
    toast('-3 pts → '+players[curP].name);
  }
  doneSet.add(ci);
  const tc=document.getElementById('tc'+ci);if(tc)tc.classList.add('done');
  curP=(curP+1)%players.length;
  renderChips();
  const ftw=document.querySelector('.cm-ft-wrap');
  const ft=document.querySelector('.cm-ft');
  if(ft){
    ft.innerHTML=`<button class="ftb ftb-back" onclick="closeCard()">✕ Back to board</button>`;
  }
  if(doneSet.size>=deck.length)setTimeout(showWin,1200);
};

window.grade=function(ci,ok){
  const c=deck[ci];
  if(ok){
    players[curP].score+=c.pts;
    SFX.correct();
    animateScore('+'+c.pts,true);
    confetti();
    toast('+'+c.pts+' pts → '+players[curP].name+'!');
  } else {
    players[curP].score-=3;
    SFX.wrong();
    animateScore('-3',false);
    toast('-3 pts → '+players[curP].name);
  }
  doneSet.add(ci);
  const tc=document.getElementById('tc'+ci);if(tc)tc.classList.add('done');
  curP=(curP+1)%players.length;
  renderChips();
  closeCard();
  if(doneSet.size>=deck.length)setTimeout(showWin,600);
};

function showFB(ok,exp){
  ok?SFX.correct():SFX.wrong();
  const fb=document.getElementById('fb');if(!fb)return;
  fb.className='fb show '+(ok?'ok':'no');
  fb.innerHTML=(ok?'✅ ':'❌ ')+exp;
}

function showWin(){
  SFX.confetti();showScr('sWin');
  const s=[...players].sort((a,b)=>b.score-a.score);
  document.getElementById('winList').innerHTML=s.map((p,i)=>`
    <div class="wrow"><div class="wrank">${['🥇','🥈','🥉'][i]||i+1+'.'}</div>
    <img class="wav" src="${p.av}" alt=""><div class="wname">${p.name}</div>
    <div class="wpts">${p.score>0?'+':''}${p.score} pts</div></div>`).join('');
}

function showScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function confetti(){
  const shapes=['★','✦','◆','●','▲','✿'];
  const colors=['#f7c948','#06d6a0','#4cc9f0','#f72585','#a78bfa','#fb923c'];
  shapes.forEach((sh,i)=>{
    setTimeout(()=>{
      const el=document.createElement('div');el.className='conf';el.textContent=sh;
      el.style.cssText=`left:${10+Math.random()*80}%;top:${10+Math.random()*40}%;color:${colors[i%colors.length]};font-size:${0.9+Math.random()*0.8}rem`;
      document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
    },i*80);
  });
}
let tT;
function toast(m){const t=document.getElementById('toastEl');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2800);}
</script>
</body>
