<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SnugKit</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="snugcore/snugfonts.css">
<link rel="stylesheet" href="snugcore/snugkit.css">
</head>
<body data-snugscreen="hub" data-snugfmt="cw">
<main class="snugmain">
<section class="snugscreen is-on" id="snughub">
  <div class="snughub">
    <div class="snugfmts" role="group" aria-label="Activity">
      <button type="button" class="snugfmt" data-f="cw"><span class="snugfmtprev" id="snugprevcw"></span><span class="snugfmtname">Crossword</span><span class="snugfmttext">The grid builds itself, students fill it from the clues</span></button>
      <button type="button" class="snugfmt" data-f="ws"><span class="snugfmtprev" id="snugprevws"></span><span class="snugfmtname">Word search</span><span class="snugfmttext">Hidden words, found from their definitions</span></button>
      <button type="button" class="snugfmt" data-f="ss"><span class="snugfmtprev" id="snugprevss"></span><span class="snugfmtname">Sentence scramble</span><span class="snugfmttext">Students click the words into the right order</span></button>
      <button type="button" class="snugfmt" data-f="lv"><span class="snugfmtprev" id="snugprevlv"></span><span class="snugfmtname">Level Up</span><span class="snugfmttext">Every right answer moves the hero forward</span></button>
    </div>
    <div class="snuggrid">
      <section class="snugcard">
        <div class="snuglabelrow"><label id="snugtinlabel" for="cwtin">Words and clues</label><span id="snugtinhint">word | clue</span></div>
        <textarea class="snugtin" id="cwtin" spellcheck="false" placeholder="library | A place where you can borrow books&#10;umbrella | You open it when it rains&#10;breakfast | The first meal of the day&#10;kitchen | The room where you cook food&#10;bicycle | It has two wheels and pedals&#10;teacher | A person who works at a school"></textarea>
        <textarea class="snugtin" id="sstin" spellcheck="false" hidden placeholder="The sun is shining brightly.&#10;She walked across the road.&#10;Children are playing in the garden.&#10;The cat sleeps on the sofa.&#10;Spring arrived unexpectedly."></textarea>
        <textarea class="snugtin" id="lvtin" spellcheck="false" hidden placeholder="She ___ to school every day. | goes | go | going&#10;The opposite of “hot” | cold | warm | wet&#10;I have ___ apple. | an | a | the&#10;They ___ football yesterday. | played | play | plays&#10;The plural of “mouse” | mice | mouses | mousies"></textarea>
        <div class="snugmsg" id="snugmsg" role="status"></div>
        <div class="snughelp"><span id="snughelptext"></span><button type="button" class="snugghost" id="snugtpl" onclick="snugCopyTemplate()">Copy template</button></div>
      </section>
      <section class="snugcard snugside">
        <div class="snuglabelrow"><b id="snuglooklabel">Look</b><div class="snugseg" id="snugmodeseg" role="radiogroup" aria-label="Light or dark"><button type="button" data-m="light" role="radio">Light</button><button type="button" data-m="dark" role="radio">Dark</button></div></div>
        <div class="snuglooks" id="snuglooks" role="radiogroup" aria-label="Look"></div>
        <div class="world-row" id="world-row" role="radiogroup" aria-label="Hero" hidden></div>
        <div class="snuglabelrow">Options</div>
        <div class="snugopts" id="cwopts">
          <button type="button" class="snugpill" data-e="cw" data-k="sh" title="A new grid layout every time"><i class="snugdot"></i>Shuffle</button>
          <button type="button" class="snugpill" data-e="cw" data-k="lc"><i class="snugdot"></i>Letter count</button>
          <button type="button" class="snugpill" data-e="cw" data-k="ic" title="Check each word as soon as it is filled in"><i class="snugdot"></i>Instant check</button>
          <button type="button" class="snugpill" data-e="cw" data-k="ans"><i class="snugdot"></i>Show answers</button>
          <button type="button" class="snugpill" data-e="cw" data-k="tm"><i class="snugdot"></i>Timer</button>
          <div class="snugtimer" data-e="cw"></div>
        </div>
        <div class="snughintrow" id="cwhints"><span>Hints per word</span><div class="snugseg" id="cwhintseg" role="radiogroup" aria-label="Hints per word"><button type="button" data-h="0" role="radio">Off</button><button type="button" data-h="1" role="radio">1</button><button type="button" data-h="2" role="radio">2</button><button type="button" data-h="3" role="radio">3</button><button type="button" data-h="99" role="radio">All</button></div></div>
        <div class="snugopts" id="ssopts" hidden>
          <button type="button" class="snugpill" data-e="ss" data-k="sh"><i class="snugdot"></i>Shuffle</button>
          <button type="button" class="snugpill" data-e="ss" data-k="ans"><i class="snugdot"></i>Show answers</button>
          <button type="button" class="snugpill" data-e="ss" data-k="au" title="Move to the next sentence automatically after checking"><i class="snugdot"></i>Auto next</button>
          <button type="button" class="snugpill" data-e="ss" data-k="tm"><i class="snugdot"></i>Timer</button>
          <div class="snugtimer" data-e="ss"></div>
        </div>
        <div class="snughintrow" id="sshints" hidden><span>Hints per sentence</span><div class="snugseg" id="sshintseg" role="radiogroup" aria-label="Hints per sentence"><button type="button" data-h="0" role="radio">Off</button><button type="button" data-h="1" role="radio">1</button><button type="button" data-h="2" role="radio">2</button><button type="button" data-h="3" role="radio">3</button><button type="button" data-h="99" role="radio">All</button></div></div>
        <div class="snugopts" id="lvopts" hidden>
          <button type="button" class="snugpill" data-e="lv" data-k="sh"><i class="snugdot"></i>Shuffle</button>
          <button type="button" class="snugpill" data-e="lv" data-k="lv"><i class="snugdot"></i>3 lives</button>
          <button type="button" class="snugpill" data-e="lv" data-k="tm"><i class="snugdot"></i>Timer</button>
          <div class="snugtimer" data-e="lv"></div>
        </div>
        <div class="snugactions">
          <button type="button" class="snugstart" onclick="snugStart()">Start</button>
          <button type="button" class="snugghost" onclick="snugShare()">Share link</button>
        </div>
        <div class="snugshare" id="snugsharepanel" hidden><label class="snugfieldlabel" for="snugshareurl">Assignment link</label><input id="snugshareurl" class="snugshareurl" readonly onclick="this.select()"><button type="button" class="snugghost snugsmall" onclick="snugCopyLink()">Copy link</button><p class="snugsharestatus" id="snugsharestatus" role="status"></p></div>
      </section>
    </div>
  </div>
</section>
</main>
<script src="snugcore/snugengine.js"></script>
<script src="snugcore/snughub.js"></script>
</body>
</html>
