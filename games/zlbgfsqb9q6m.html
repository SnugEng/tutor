(function(){
'use strict';
const G=window.GAME;
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const reduced=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const store={get(k,d){try{const v=localStorage.getItem(G.id+':'+k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(G.id+':'+k,v)}catch(e){}}};

let ac=null,muted=store.get('mute','0')==='1',nbuf=null;
function ctx(){if(muted)return null;if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ac=new C()}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
function tone(f,t0,dur,vol){const a=ctx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03)}
function click(vol,hp){const a=ctx();if(!a)return;if(!nbuf){nbuf=a.createBuffer(1,Math.floor(a.sampleRate*0.03),a.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3)}const s=a.createBufferSource();s.buffer=nbuf;const f=a.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=a.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(a.destination);s.start()}
const SFX={key(){click(0.09,1500+Math.random()*1000)},enter(){click(0.2,600)},ding(){tone(1175,0,0.45,0.13);tone(1568,0.11,0.7,0.11)},tick(){tone(880,0,0.12,0.05)},untick(){tone(520,0,0.1,0.04)},all(){tone(784,0,0.18,0.07);tone(1175,0.12,0.35,0.07)}};

const root=document.documentElement;
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const savedTheme=store.get('theme','');if(savedTheme==='dark'||savedTheme==='light')root.setAttribute('data-theme',savedTheme);
function isDark(){const t=root.getAttribute('data-theme');if(t==='dark')return true;if(t==='light')return false;return !!(mq&&mq.matches)}
let level=store.get('level','a');if(!G.help[level])level='a';
let tr=store.get('tr','0')==='1';
let order=[],pos=0,cur=null,twist=false,marks=new Set(),busy=false;
let run=0,fast=false,skippers=[];
const ABORT={};
const stageEl=$('#stage'),qaEl=$('#qa');

function items(){return cur.items.concat(twist?[cur.twist]:[])}
function mkCtl(){const id=++run;fast=false;skippers=[];return{play(n){if(!fast)SFX[n]()},async sleep(ms){await new Promise(r=>{if(fast)return r();const t=setTimeout(r,ms);skippers.push(()=>{clearTimeout(t);r()})});if(id!==run)throw ABORT}}}
function sync(){
  document.body.classList.toggle('is-tr',tr);

  $$('[data-act="mute"]').forEach(b=>b.setAttribute('aria-pressed',String(muted)));
  $$('[data-level-label]').forEach(e=>{e.textContent=level==='a'?'A1–A2':'B1+'});

  stageEl.classList.toggle('is-busy',busy);
}
function setBusy(b){busy=b;sync()}
function qaHTML(lv){return G.help[lv].map(h=>'<button type="button" class="qa" aria-expanded="false"><span class="qa-q">'+esc(h[0])+'</span><span class="qa-a" aria-hidden="true">'+esc(h[1])+'</span></button>').join('')}
function renderQA(){qaEl.innerHTML=qaHTML(level)}
function reserveQA(){const keep=qaEl.innerHTML;qaEl.style.minHeight='';let m=0;for(const lv in G.help){qaEl.innerHTML=qaHTML(lv);m=Math.max(m,qaEl.offsetHeight)}qaEl.innerHTML=keep;qaEl.style.minHeight=m+'px'}
qaEl.addEventListener('click',e=>{const b=e.target.closest('.qa');if(!b)return;const open=!b.classList.contains('is-open');b.classList.toggle('is-open',open);b.setAttribute('aria-expanded',String(open));b.querySelector('.qa-a').setAttribute('aria-hidden',String(!open));if(open)SFX.tick();else SFX.untick()});
const api={esc:esc,
  gloss(it){return it.w&&it.w.length?'<span class="gl">'+it.w.map(w=>'<span class="gp"><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>').join('')+'</span>':''},
  toggle(i){if(i>=items().length)return;const on=!marks.has(i);if(on)marks.add(i);else marks.delete(i);G.stage.mark(i,on);const all=marks.size===items().length;G.stage.done(all);if(all)SFX.all();else if(on)SFX.tick();else SFX.untick()}};
async function load(i,animate){
  cur=G.cases[i];twist=false;marks=new Set();
  const c=mkCtl();setBusy(true);
  try{if(animate&&!reduced)await G.stage.leave(c);G.stage.done(false);await G.stage.show(cur,animate&&!reduced,c)}catch(e){if(e===ABORT)return;throw e}
  setBusy(false);
}
async function addTwist(){
  if(twist||busy)return;twist=true;G.stage.done(false);
  const c=mkCtl();setBusy(true);
  try{await G.stage.twist(cur,!reduced,c)}catch(e){if(e===ABORT)return;throw e}
  setBusy(false);
}
function next(){
  pos++;
  if(pos>=order.length){const last=order[order.length-1];order=shuffle(G.cases.map((_,i)=>i));if(order[0]===last)order.push(order.shift());pos=0}
  load(order[pos],true);

stageEl.addEventListener('click',e=>{if(!busy||e.target.closest('[data-act]'))return;fast=true;skippers.splice(0).forEach(f=>f())});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act;

  else if(a==='twist')addTwist();
  else if(a==='translate'){tr=!tr;store.set('tr',tr?'1':'0');sync()}

  else if(a==='theme'){const n=isDark()?'light':'dark';root.setAttribute('data-theme',n);store.set('theme',n);sync();SFX.tick()}
  else if(a==='mute'){muted=!muted;store.set('mute',muted?'1':'0');sync();if(!muted)SFX.tick()}

G.stage.init(api);
const glowEl=$('.glow'),glowAt=$('[data-glow]')||stageEl;
function place(){if(!glowEl)return;const r=glowAt.getBoundingClientRect(),b=document.body.getBoundingClientRect();const s=glowEl.style;s.setProperty('--gx',Math.round(r.left+r.width/2-b.left)+'px');s.setProperty('--gy',Math.round(r.top+r.height/2-b.top)+'px');s.setProperty('--gw',Math.round(Math.max(r.width*1.4,r.height*1.5))+'px');s.setProperty('--gh',Math.round(r.height*1.4)+'px')}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{reserveQA();place();if(G.stage.relayout)G.stage.relayout()});
place();addEventListener('resize',()=>{reserveQA();place();if(G.stage.relayout)G.stage.relayout()});try{new ResizeObserver(place).observe(document.body)}catch(e){}
if(mq&&mq.addEventListener)mq.addEventListener('change',sync);
try{new MutationObserver(sync).observe(root,{attributes:true,attributeFilter:['data-theme']})}catch(e){}
renderQA();reserveQA();sync();
order=[0].concat(shuffle(G.cases.map((_,i)=>i).slice(1)));
load(order[0],false);
})();
