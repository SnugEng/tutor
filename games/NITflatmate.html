*{box-sizing:border-box;margin:0;padding:0}
:root{--k:#000;--navy:#1d2b53;--plum:#7e2553;--grey:#5f574f;--lgrey:#c2c3c7;--cream:#fff1e8;--red:#ff004d;--orange:#ffa300;--yellow:#ffec27;--green:#00e436;--dgreen:#008751;--blue:#29adff;--lav:#83769c;--pink:#ff77a8;
 --px:'Press Start 2P',monospace;--body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif}
html,body{height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--k)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}
#fit{position:fixed;inset:0}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:760px;transform:translate(-50%,-50%) scale(var(--s,1));background:#000;overflow:hidden}
#rotate{position:fixed;inset:0;background:#000;color:#fff;display:grid;place-items:center;font:16px var(--px);text-align:center;padding:30px;z-index:99;line-height:1.8}
img.pxbg,img.pximg{image-rendering:pixelated;image-rendering:crisp-edges}

#hud{position:absolute;left:0;top:0;width:1280px;height:56px;background:#000;border-bottom:4px solid var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:20;color:var(--cream)}
.hlogo{font:16px var(--px);color:var(--pink);text-shadow:3px 3px 0 var(--plum)}
#where{font:22px var(--body);color:var(--lgrey)}
.hr{display:flex;gap:12px;align-items:center}
#pts{font:14px var(--px);color:var(--yellow)}
.hbtn{font:11px var(--px);color:var(--cream);border:3px solid var(--lgrey);padding:8px 10px;background:var(--navy)}
.hbtn:hover{border-color:var(--yellow)}
#screen{position:absolute;left:0;top:56px;width:1280px;height:664px;overflow:hidden;background:#000}
.pxbg{position:absolute;left:0;top:0;width:1280px;height:664px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35)}
#foot{position:absolute;left:0;bottom:0;width:1280px;height:40px;background:#000;border-top:4px solid var(--navy);display:flex;align-items:center;gap:16px;padding:0 14px;color:var(--lgrey);font:16px var(--body);z-index:20}
.f-link{color:var(--pink);text-decoration:none;font:10px var(--px)}
.f-mid{flex:1;display:flex;gap:12px;align-items:center;white-space:nowrap;overflow:hidden}
.f-level{background:var(--green);color:#000;font:10px var(--px);padding:4px 6px}
.f-unit{color:var(--cream)}
#b-teach{color:var(--grey);font-size:18px;width:30px;height:30px}
#b-teach:hover{color:var(--yellow)}
#tpop{position:absolute;right:10px;bottom:48px;z-index:950;background:var(--cream);border:4px solid #000;box-shadow:6px 6px 0 #000;padding:10px;display:flex;gap:8px;align-items:center;font:10px var(--px)}
#tpop input{width:100px;height:38px;border:3px solid #000;padding:0 8px;font:20px var(--body)}
#toast{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);background:var(--navy);color:var(--cream);border:4px solid var(--cream);box-shadow:0 0 0 4px #000;padding:10px 16px;font:20px var(--body);z-index:950}
#toast.in{animation:pop .2s steps(3)}

.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:13px var(--px);color:#000;background:var(--yellow);border:4px solid #000;box-shadow:4px 4px 0 #000;padding:11px 16px;white-space:nowrap}
.pbtn:hover{background:#fff27a}
.pbtn:active{transform:translate(4px,4px);box-shadow:none}
.pbtn.big{font-size:16px;padding:14px 22px}
.pbtn.alt{background:var(--cream)}
.ib{font:11px var(--px);border:3px solid #000;background:var(--cream);padding:6px 8px}
.ib:hover{background:var(--yellow)}
#w-hint.give{background:var(--orange)}

.title{position:absolute;left:0;right:0;top:40px;text-align:center;color:var(--cream)}
.logo8{font:56px/1.1 var(--px);color:var(--pink);text-shadow:6px 6px 0 var(--plum),10px 10px 0 #000}
.sub8{font:22px var(--px);color:var(--yellow);margin-top:18px;text-shadow:4px 4px 0 #000}
.title p{font:28px/1.35 var(--body);max-width:700px;margin:22px auto 0;text-shadow:3px 3px 0 #000}
.startcard{position:absolute;left:50%;top:330px;transform:translateX(-50%);width:440px;background:var(--cream);border:4px solid #000;box-shadow:8px 8px 0 #000;padding:18px;display:flex;flex-direction:column;gap:12px}
.startcard label{font:12px var(--px)}
.startcard input{height:52px;border:4px solid #000;padding:0 12px;font:28px var(--body);background:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}
.startcast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:40px}
.startcast .spr{width:64px;height:104px}

#sprites{position:absolute;inset:0}
.spr{width:64px;height:104px;display:block}
.bigspr{position:absolute;left:20px;bottom:30px}
.bigspr .spr{width:112px;height:182px}
.actor{position:absolute;display:block}
.actor img{display:block}
.who .tag{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-8px);font:11px var(--px);background:var(--cream);border:3px solid #000;padding:6px 8px;white-space:nowrap;box-shadow:3px 3px 0 #000}
.who.go .tag{background:var(--yellow)}
.who.did .tag{background:var(--green)}
.who:hover .tag,.who:focus-visible .tag{background:var(--yellow)}
.bang{position:absolute;left:50%;margin-left:-8px;top:-78px;font:22px var(--px);color:var(--yellow);text-shadow:3px 3px 0 #000;animation:bob 1s steps(2) infinite}

#dlghost{position:absolute;left:140px;top:12px;width:1000px;z-index:600}
#dlghost.solo{top:auto;bottom:14px}
#dlghost.solo .dlg{min-height:128px}
.dlg{display:flex;gap:16px;background:var(--navy);border:4px solid var(--cream);box-shadow:0 0 0 4px #000,8px 8px 0 4px #000;padding:10px 18px 10px 10px;min-height:112px;cursor:pointer}
.dport{width:92px;height:92px;flex:none;background:var(--lav);border:4px solid #000;align-self:flex-start}
.dport img{width:84px;height:84px;display:block}
.dtext{flex:1;position:relative;color:var(--cream)}
.dname{font:12px var(--px);display:block;margin:2px 0 8px}
.dsay{font:25px/1.35 var(--body);display:grid;padding-right:150px}
.dsay .ghost,.dsay .typed{grid-area:1/1}
.dsay .ghost{visibility:hidden}
.dnext{position:absolute;right:0;bottom:0}
.dmore{position:absolute;right:0;bottom:-4px;color:var(--yellow);font:14px var(--px);animation:bob .8s steps(2) infinite}
#navhost{position:absolute;right:24px;bottom:16px;z-index:700;display:flex;gap:10px}

#winhost{position:absolute;inset:0;pointer-events:none;z-index:500}
.win{pointer-events:auto;position:absolute;left:140px;top:148px;width:1000px;height:502px;background:var(--cream);border:4px solid #000;box-shadow:0 0 0 4px var(--cream),0 0 0 8px #000,12px 12px 0 8px rgba(0,0,0,.6);display:flex;flex-direction:column;animation:pop .2s steps(3)}
.win.tall{top:20px;height:628px}
.wh{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:4px solid #000;background:var(--yellow)}
.wt{font:12px var(--px);white-space:nowrap}
.wi{flex:1;font:20px/1.2 var(--body);color:#333}
.wb{display:flex;gap:8px}

  function ac(){if(!ctx){try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(ctx&&ctx.state==="suspended"){ctx.resume();}return ctx;}
  function sq(f,d,at,type,vol,to){var c=ac();if(!c||!on){return;}var t=c.currentTime+(at||0),o=c.createOscillator(),g=c.createGain();o.type=type||"square";o.frequency.setValueAtTime(f,t);if(to){o.frequency.linearRampToValueAtTime(to,t+d);}g.gain.setValueAtTime(vol||.05,t);g.gain.setValueAtTime(0,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02);}
  var S={blip:function(){sq(880,.035);},tick:function(){sq(1320,.02,0,"square",.025);},
   ok:function(){sq(523,.07);sq(659,.07,.07);sq(1047,.12,.14);},bad:function(){sq(140,.18,0,"square",.05,90);},
   page:function(){sq(400,.05,0,"triangle",.08,700);},coin:function(){sq(988,.06);sq(1319,.16,.06);},

var MUS=(function(){
  var ctx=null,on=true,timer=null,step=0,next=0,master=null;try{on=localStorage.getItem("fm-mus")!=="off";}catch(e){}
  var CH=[[48,52,55],[45,48,52],[41,45,48],[43,47,50]];
  var MEL=[72,0,74,76,79,0,76,0,74,0,72,0,69,0,0,0,72,0,74,76,79,0,81,0,79,0,76,0,74,0,0,0];
  function hz(m){return 440*Math.pow(2,(m-69)/12);}
  function note(m,t,d,type,vol){var o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(hz(m),t);g.gain.setValueAtTime(vol,t);g.gain.setValueAtTime(0,t+d*.9);o.connect(g);g.connect(master);o.start(t);o.stop(t+d);}
  function sched(){var s=60/92/4;while(next<ctx.currentTime+.25){var bar=Math.floor(step/16)%4,i=step%16,ch=CH[bar];
      if(i%8===0){note(ch[0]-12,next,s*6,"triangle",.5);}
      if(i%2===0){note(ch[[0,1,2,1][(i/2)%4]]+12,next,s*1.6,"square",.08);}
      if(i%2===0){var m=MEL[(Math.floor(step/2))%32];if(m){note(m,next,s*1.8,"square",.12);}}
      next+=s;step++;}}
  function start(){if(!on||timer){return;}try{if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.05;master.connect(ctx.destination);}if(ctx.state==="suspended"){ctx.resume();}}catch(e){return;}next=ctx.currentTime+.1;timer=setInterval(sched,60);}
  function stop(){if(timer){clearInterval(timer);timer=null;}}

  return {start:start,duck:duck,isOn:function(){return on;},toggle:function(){on=!on;try{localStorage.setItem("fm-mus",on?"on":"off");}catch(e){}if(on){start();}else{stop();}return on;}};
})();

  function finish(){if(fin){return;}fin=true;el.innerHTML=html;done&&done();}
  if(REDUCED){finish();return {finish:finish,busy:function(){return false;}};}
  var t0=performance.now();
  (function tick(){if(fin||!el.isConnected){return;}var k=Math.min(plain.length,Math.floor((performance.now()-t0)/1000*48));if(k>n){n=k;tg.textContent=plain.slice(0,n);if(n%3===0){SND.play("tick");}}if(n>=plain.length){finish();return;}requestAnimationFrame(tick);})();

}
