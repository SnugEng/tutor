*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F8F7F4;--white:#FFFFFF;--ink:#181818;--sub:#888888;--muted:#C0BFB8;--line:#E8E6E1;--hover:#F2F1EC;--gold:#C9A84C;--accent:#2a5cff;--acc-bg:#F0F3FF;--err:#B82828;--err-bg:#FFF0F0;--err-ln:#F5C4BE;--r:6px}
[data-theme="dark"]{--bg:#0f0f11;--white:#17171a;--ink:#e8e6e0;--sub:#6b6b70;--muted:#3a3a40;--line:#252528;--hover:#1e1e22;--gold:#c9a84c;--accent:#7eb8a0;--acc-bg:#152520;--err:#c96060;--err-bg:#1f1212;--err-ln:#3d1f1f}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-synthesis:none;text-rendering:optimizeLegibility;transition:background .25s,color .25s}
body.is-play{height:100vh;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted)}
::-webkit-scrollbar-thumb:hover{background:var(--sub)}
::-webkit-scrollbar-button{display:none}
*{scrollbar-width:thin;scrollbar-color:var(--muted) transparent}
[hidden]{display:none!important}

.snugtop{flex-shrink:0;position:relative;z-index:10;height:50px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--white);border-bottom:1px solid var(--line);transition:background .25s,border-color .25s}
.snugtopside{display:flex;align-items:center;gap:8px;min-width:0}
.snugmark{margin-right:4px;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.snugtool{height:28px;min-width:28px;padding:0 9px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--sub);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font:500 11px/1 'Syne',sans-serif;white-space:nowrap;transition:border-color .2s,color .2s}
.snugtool:hover{border-color:var(--accent);color:var(--accent)}
.snugsmall{padding:4px 11px;font-size:10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
body:not([data-snugscreen="play"]) .snugplayonly{display:none}

.snugfoot{flex-shrink:0;position:relative;z-index:10;padding:8px 24px;display:flex;align-items:center;justify-content:space-between;background:var(--white);border-top:1px solid var(--line);transition:background .25s,border-color .25s}
.snugfootname{font:800 12px/1 'Syne',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.snugfootlinks{display:flex;gap:6px}
.snugfootlink{padding:4px 12px;border-radius:4px;border:1px solid var(--line);color:var(--sub);text-decoration:none;font:500 11px/1.4 'Syne',sans-serif;letter-spacing:.08em;text-transform:uppercase;transition:border-color .2s,color .2s}
.snugfootlink:hover{border-color:var(--accent);color:var(--accent)}

.snugmain{flex:1;display:flex;flex-direction:column;min-height:0}
.snugscreen{display:none;flex:1;flex-direction:column;min-height:0}
.snugscreen.is-on{display:flex}
#snugplay{overflow-y:auto}
.snugfmt{display:flex;flex-direction:column;gap:9px;padding:9px 9px 14px;border:1px solid var(--line);border-radius:16px;background:var(--white);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.snugfmt:hover{border-color:var(--muted)}
.snugfmt.is-on{border-color:var(--accent);box-shadow:0 0 0 3px var(--acc-bg)}
.snuglook{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 4px 9px;border:1px solid var(--line);border-radius:12px;background:var(--white);color:var(--sub);cursor:pointer;font:700 11.5px/1.1 'Nunito',sans-serif}
.snuglook:hover{border-color:var(--muted)}
.snuglook.is-on{border-color:var(--accent);box-shadow:0 0 0 2px var(--acc-bg);color:var(--ink)}
.snugghost{padding:14px 18px;border:1px solid var(--line);border-radius:var(--r);background:none;color:var(--sub);font:500 12px/1.2 'Nunito',sans-serif;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.snugghost:hover{border-color:var(--muted);color:var(--ink)}
.snugghost:disabled{opacity:.3;cursor:default}
.snugghost.snugsmall{padding:4px 11px;font-size:10px}
.snugprimary{flex:1;padding:14px 20px;border:0;border-radius:var(--r);background:var(--ink);color:var(--bg);font:700 13px/1.2 'Nunito',sans-serif;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:opacity .15s,transform .12s,background .25s,color .25s}
.snugprimary:hover:not(:disabled){opacity:.78}
.snugprimary:disabled{opacity:.22;cursor:default}

.snugbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;padding:18px 20px 22px;background:var(--snugpage,var(--bg));color:var(--ink);transition:background .25s}
.snugstage{position:relative;width:100%;max-width:1180px;display:flex;flex-direction:column;align-items:center;gap:12px}
.snugstage>*{width:100%}
.snugprog{position:relative}
.snugprognums{position:relative;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.snugidx{font:500 13px/1.2 'Nunito',sans-serif;color:var(--muted);letter-spacing:.06em}
.snugscore{font:800 13px/1.2 'Nunito',sans-serif;color:var(--accent)}
.snugprogright{display:inline-flex;align-items:center;gap:10px}
.snugbar{height:2px;background:var(--line);border-radius:2px}
.snugbarfill{width:0;height:100%;background:var(--ink);border-radius:2px;transition:width .5s ease,background .25s}
.snugview{display:none}
.snugtstrip{display:none;align-items:center;gap:12px}
.snugtstrip.is-on{display:flex}
.snugttrack{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.snugtfill{height:100%;background:var(--ink);transition:width 1s linear,background .5s}
.snugtnum{min-width:28px;text-align:right;font:500 13px/1 'Nunito',sans-serif;color:var(--muted)}
.snuglabel{display:block;margin-bottom:12px;font:500 11px/1.2 var(--snugfontui,'Nunito'),'Nunito',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.snugplate{position:fixed;inset:0;z-index:140;display:grid;place-items:center;pointer-events:none;background:rgba(10,10,20,.16)}
.snugplatecard{position:relative;z-index:2;min-width:260px;max-width:min(420px,90vw);padding:26px 34px 24px;text-align:center;color:var(--ink);background:var(--snugpanel,var(--white));border:var(--snugpanelbd,1px solid var(--line));border-radius:var(--snugpanelr,18px);box-shadow:var(--snugpanelsh,0 0 0 transparent),0 24px 60px rgba(0,0,0,.28)}
.snugplate.is-on .snugplatecard{animation:snugplatein .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes snugplatein{from{transform:scale(.6) translateY(20px);opacity:0}}
.snugplateico{display:flex;justify-content:center;margin-bottom:8px}
.snugplatet{font-family:var(--snugfont,'Syne'),'Syne',sans-serif;font-weight:var(--snugfw,800);font-size:30px;line-height:1.1;color:var(--accent)}
.snugplates{margin-top:8px;font-family:var(--snugfontui,'Nunito'),'Nunito',sans-serif;font-size:16px;color:var(--sub)}
.snugconfetti{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.snugconfetti i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:snugconf 1.8s cubic-bezier(.3,.6,.5,1) both}
@keyframes snugconf{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}

.snugstamp{position:absolute;z-index:150;width:124px;height:124px;left:50%;top:80px;pointer-events:none;opacity:0;transform:translate(-50%,-50%) rotate(12deg) scale(.1);filter:drop-shadow(0 4px 16px rgba(0,0,0,.15))}
.snugstamp.is-on{animation:snugstamp 1.9s cubic-bezier(.34,1.56,.64,1) both}
@keyframes snugstamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(12deg) scale(.1)}20%{opacity:1;transform:translate(-50%,-50%) rotate(12deg) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) rotate(12deg) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) rotate(12deg) scale(.96)}}
.snugstamp svg,.snugrevstamp svg{display:block;width:100%;height:100%}

.snugresbody{flex:1;padding:40px 20px 60px;overflow-y:auto;background:var(--snugpage,var(--bg));color:var(--ink)}
.snugrespanel{width:100%;max-width:560px;margin:0 auto}
.snugresbig{font:800 clamp(4rem,11vw,8rem)/1 'Syne',sans-serif;letter-spacing:-.02em;color:var(--ink)}
.snugrescap{margin:4px 0 32px;font:500 12px/1.2 'Nunito',sans-serif;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.snugstats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-bottom:24px;overflow:hidden;background:var(--line);border:1px solid var(--line);border-radius:10px}
.snugstat{padding:18px 14px;text-align:center;background:var(--white)}
.snugstatval{display:block;font:800 2rem/1.2 'Syne',sans-serif;color:var(--ink)}
.snugstatkey{display:block;margin-top:4px;font:500 10px/1.2 'Nunito',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.snugreslist{margin-bottom:24px}
.snugrevhead{margin-bottom:10px;font:500 10px/1.2 'Nunito',sans-serif;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.snugrev{display:flex;align-items:center;gap:10px;width:calc(100% + 8px);margin:0 -4px;padding:9px 4px;border:0;border-bottom:1px solid var(--line);border-radius:4px;background:none;text-align:left;font:400 17px/1.45 'Nunito',sans-serif;color:var(--sub);cursor:pointer}
.snugrev:hover{background:var(--hover)}
.snugrevdot{flex-shrink:0;font-size:9px;color:var(--ink)}
.snugrev.is-err{color:var(--muted)}
.snugrev.is-err .snugrevdot{color:var(--err)}
.snugrevtxt{flex:1;min-width:0}
.snugrevword{display:inline-block;margin-right:8px;padding:0 9px;border-radius:99px;background:var(--acc-bg);color:var(--accent);font-weight:800;font-size:14px;letter-spacing:.04em}
.snugrevword.is-caps{text-transform:uppercase;letter-spacing:.06em}
.snugrev.is-err .snugrevword{background:var(--hover);color:var(--sub)}
.snugrevstamp{flex-shrink:0;width:46px;height:46px;margin:-6px 0 -6px auto}
.snugresactions{display:flex;gap:8px}

.snugmodal{display:none;position:fixed;inset:0;z-index:1000;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.45)}
.snugmodal.is-on{display:flex}

html.is-fullscreen body{position:fixed;inset:0;width:100%;height:100dvh;min-height:0;overflow:hidden}
html.is-fullscreen .snugstage{max-width:1500px}
html.is-fullscreen #ssview{--ssfs:clamp(28px,3.2vw,52px)}
html.is-fullscreen #snugres{overflow:auto}
#snugmessage{align-items:center;justify-content:center;padding:28px 20px}
.snugmessagecard{max-width:460px;padding:28px;text-align:center;background:var(--white);border:1px solid var(--line);border-radius:12px}
.snugmessagecard h1{margin-bottom:12px;font-size:28px}
.snugmessagecard p{font:600 17px/1.5 'Nunito',sans-serif;color:var(--sub)}
</style>
</head>

    ret=wait(700).then(function(){cameraTo(back.y);return jumpTo(back,520);});
  }else if(W.fail==='crumble'){
    snugSound.play('fall');snugState('is-drop');burst(W.bits||'bricks',p.x,p.y-6,14);
    ret=wait(760).then(emerge);
  }else if(W.fail==='erase'){
    snugSound.play('crumple');snugState('is-erased');burst('crumbs',p.x,p.y-20,14);
    if(lastTrail){(function(t){t.classList.add('bad');later(function(){t.classList.add('fade');t.style.opacity=0;},300);later(function(){t.remove();},1400);})(lastTrail);lastTrail=null;}
    ret=wait(760).then(emerge);
  }else if(W.fail==='soggy'){
    snugSound.play('splash');later(function(){snugSound.play('wrong');},260);
    snugState('is-sinking');burst('drops',p.x,p.y-10,9);ripple(p.x,p.y-8,60);
    ret=wait(820).then(emerge);
  }else if(W.fail==='drift'){
    snugSound.play('drift');snugState('is-drift');burst('neon',p.x,p.y-20,10);
    ret=wait(950).then(emerge);
  }else if(W.fail==='squish'){
    snugSound.play('squish');later(function(){snugSound.play('splash');},200);
    snugState('is-sinking');burst('crumbs',p.x,p.y-10,12);burst('choc',p.x,p.y-10,8);ripple(p.x,p.y-8,80);
    ret=wait(800).then(emerge);
  }else{
    zapFx(p.x,p.y);if(lastTrail){lastTrail.classList.add('bad');(function(t){later(function(){t.classList.add('fade');},500);later(function(){t.remove();},1400);})(lastTrail);lastTrail=null;}
    ret=wait(800).then(function(){burst('smoke',fx,fy-14,7);cameraTo(back.y);return walkTo(back,{noTrail:true});});
  }
  later(function(){b.classList.add('is-gone');},950);
  var plate=wait(620).then(function(){return showPlate(out?'over':'miss',{ms:1700});});
  if(out){gameOver=true;return;}
  Promise.all([ret,plate]).then(rearm);
}
function rearm(){
  if(gameOver)return;
  var row=G.rows[cur];
  row.el.classList.remove('is-frozen');
  answered=false;busy=false;snugState('');lookAhead();

  if(pills.tm)startT(tsecs,onTimeout,lvTimer,lvFreeze);
}
function onTimeout(){
  if(answered||gameOver)return;
  answered=true;busy=true;
  var it=items[cur],row=G.rows[cur];
  row.el.classList.add('is-frozen');
  if(!row.failed){row.failed=true;log.push({q:it.q,a:it.a[0],given:null,ok:false});}
  snugSound.play('wrong');if(!isPx())snugState('is-sad');
  loseLife();
  var out=pills.lv&&lives<=0;
  if(out){gameOver=true;}
  showPlate(out?'over':'time',{ms:1700}).then(rearm);
}
function advance(){
  G.rows[cur].el.classList.remove('is-current');G.rows[cur].el.classList.add('is-past');
  cur++;
  if(cur>=items.length)reachGoal();else loadQ();
}
function reachGoal(){
  busy=true;answered=true;done=true;stopT();snugSound.musicStop();

  var p=snugPoint({k:'finish'});cameraTo(p.y);
  later(function(){
    moveTo(p).then(function(){
      snugAt={k:'finish'};
      if(world==='tower'){var ch=$('decor').querySelector('.chest');if(ch)ch.innerHTML=pxChest(true);snugSound.play('win');burst('stars',p.x+50,p.y-40,16);}
      else if(world==='bug'){var g=$('decor').querySelector('.goal-srv');if(g)g.classList.add('alarm');snugSound.play('alarm');burst('bits',p.x+40,p.y-40,22);}
      else if(world==='scat'){pxIdle(false);setFrame('sleep');snugSound.play('win');burst('zzz',p.x+18,p.y-40,3);}
      else if(world==='blueprint'){bpProgress(true);snugState('is-cheer');snugSound.play('win');}
      else{snugState('is-cheer');snugSound.play('win');burst('conf',p.x,p.y-60,30);}

      later(function(){showPlate('win',{ms:2600}).then(showRes);},isPx()?700:500);
    });
  },350);
}

document.addEventListener('keydown',function(e){
  if(!isOn()||snugModalOpen())return;
  var p=$('plate');
  if(!p.hidden&&(e.key==='Enter'||e.key===' ')&&p.onclick){e.preventDefault();p.onclick();return;}
  var row=G.rows[cur];
  if(row&&/^[1-4]$/.test(e.key)&&row.pads[+e.key-1]&&!answered){e.preventDefault();choose(cur,+e.key-1);return;}
  if(row&&!answered&&/^Arrow(Left|Right|Up|Down)$/.test(e.key)){
    e.preventDefault();var els=row.pads.map(function(q){return q.el;}).filter(function(el){return !el.classList.contains('is-gone');}),k=els.indexOf(document.activeElement);
    var fwd=e.key==='ArrowRight'||e.key==='ArrowDown';
    k=k<0?0:(k+(fwd?1:-1)+els.length)%els.length;els[k].focus({preventScroll:true});
  }
});
var _rsz=null;
function onStageResize(){
  if(!isOn())return;
  if(!G.rows.length)return;
  clearTimeout(_rsz);_rsz=setTimeout(function(){
    fitQuestion();
    var f=$('field');
    if(Math.abs(f.clientWidth-G.lastW)>2||Math.abs(f.clientHeight-G.lastH)>40)relayoutWorld();
    else{G.H=f.clientHeight;if(G.rows[cur])fitRow(G.rows[cur]);}
    $('amb').style.setProperty('--fh-amb',G.H+'px');
    if(!busy){snugPlace(snugPoint(snugAt));cameraTo(fy,true);}
  },140);
}
window.addEventListener('resize',onStageResize);

function showRes(){
  snugClear();hidePlate();
  var ok=log.filter(function(x){return x.ok;}).length,er=log.length-ok,pct=Math.round(ok/items.length*100);
  snugProgress(null,null,1);
  snugResults({pct:pct,cap:gameOver?'out of lives':pct===100?'perfect':pct>=80?'excellent':pct>=60?'good job':'first try',
    stats:[[score,'Points'],[ok,'Correct'],[er,'Errors']],
    items:log.map(function(en){
      var html='<span class="snugmq">'+esc(en.q)+'</span><span class="snugmrow">Answer: <b>'+esc(en.a)+'</b></span>';
      if(!en.ok)html+='<span class="snugmrow">'+(en.given===null?'Time ran out':'First try: <b>'+esc(en.given)+'</b>')+'</span>';
      return {ok:en.ok,word:en.a,after:true,text:en.q,stamp:-1,label:en.ok?'Correct':'Missed',modal:html};
    })});
}

function loadShared(d){
  if(GONE_WORLDS[d.w])d.w=GONE_WORLDS[d.w];
  var okStr=function(x){return typeof x==='string'&&x.trim()&&x.length<2000&&!/[\r\n|]/.test(x);};
  if(d.v!==1||!Array.isArray(d.q)||!d.q.length||d.q.length>500||!d.q.every(function(r){return Array.isArray(r)&&r.length>=3&&r.length<=5&&r.every(okStr);})||!['sh','lv','tm'].every(function(k){return typeof d[k]==='boolean';})||!TIMES.includes(d.t)||(d.w!==undefined&&!WORLDS[d.w]))throw Error('Invalid assignment data.');
  world=d.w||'tower';
  items=d.q.map(function(r){var a=[];r.slice(1).forEach(function(s){s=s.trim();if(!a.some(function(x){return x.toLowerCase()===s.toLowerCase();}))a.push(s);});if(a.length<2)throw Error('Invalid assignment data.');return {q:r[0].trim(),a:a};});if(d.sh)items=shuf(items);
  pills.sh=d.sh;pills.lv=d.lv;pills.tm=d.tm;tsecs=d.t;
  return {fmt:'lv'};
}
function lvTimer(left,total,first){
  var q=$('qtime'),now=total?left/total:0;
  $('lvtnum').textContent=fmtT(left);
  if(first){q.style.transition='none';q.style.transform='scaleX(1)';void q.offsetWidth;}
  q.style.transition='transform 1s linear';q.style.transform='scaleX('+(total?Math.max(0,left-1)/total:0)+')';
  q.classList.toggle('is-mid',now<=.5&&now>.25);q.classList.toggle('is-low',now<=.25);
}
function lvFreeze(){var q=$('qtime');if(!q)return;var tr=getComputedStyle(q).transform;q.style.transition='none';q.style.transform=tr&&tr!=='none'?tr:'';}

var LV_MUSIC={tower:'arcade',bug:'blueprint',scat:'pocket',doodle:'notebook',lcd:'pocket',shadow:'vintage',stitch:'kids',blueprint:'blueprint',board:'typewriter'};

function isOn(){return snugPlaying()&&snugFmt==='lv';}
return {start:beginRun,restart:restartGame,stop:stopRun,running:function(){return !done&&!gameOver;},resize:onStageResize,load:loadShared,music:function(){return LV_MUSIC[world]||'classic';}};

})();

var SNUGLOOKS=['classic','blueprint','typewriter','kids','arcade','vintage','notebook','pocket'];
var SNUGENG={cw:snugCw,ss:snugSs,lv:snugLv};
function snugEngine(f){f=f||snugFmt;return f==='ss'?snugSs:f==='lv'?snugLv:snugCw;}
function snugMusicStyle(){return snugFmt==='lv'?snugLv.music():snugLook;}
function snugGameOn(){return snugPlaying()&&snugEngine().running();}

function snugSetFmt(f){var names={cw:'Crossword',ws:'Word search',ss:'Sentence scramble',lv:'Level Up'};if(!Object.prototype.hasOwnProperty.call(names,f))throw Error('Invalid activity.');snugFmt=f;if(f==='cw'||f==='ws')snugCw.fmt=f;document.body.setAttribute('data-snugfmt',f);document.title='SnugKit · '+names[f];}
function snugSetMode(m){var d=document.documentElement;if(m==='dark')d.setAttribute('data-theme','dark');else d.removeAttribute('data-theme');}

function snugSetLook(k){if(!SNUGLOOKS.includes(k))throw Error('Invalid look.');snugLook=k;snugApplyLook();}

function snugAgain(){if(!assignmentReady)return;$('snugmodal').classList.remove('is-on');try{snugEngine().restart();}catch{studentNotFound();}}

var assignmentReady=false,assignmentLoad=0;
function studentNotFound(){assignmentReady=false;stopT();snugSound.musicStop();location.replace('https://snugenglish.ru/404.html');}
async function openStudentAssignment(){
 var request=++assignmentLoad;assignmentReady=false;stopT();snugSound.musicStop();snugEngine().stop();show('snugmessage');
 try{
  var d=await decodeTask();if(request!==assignmentLoad)return;if(!d||typeof d!=='object'||Array.isArray(d))throw Error('Invalid assignment.');
  var k=d.k==='cw'?'cw':d.k==='ss'||(d.k===undefined&&Array.isArray(d.s))?'ss':['lv','snug','frog'].includes(d.k)?'lv':null;
  if(!k)throw Error('Invalid activity.');
  var r=SNUGENG[k].load(d);snugApplyTheme(d.theme||'');snugLook='classic';if(r.look)snugSetLook(r.look);snugSetFmt(r.fmt);snugEngine().start();assignmentReady=true;
 }catch{if(request===assignmentLoad)studentNotFound();}
}
snugSound.sync();window.addEventListener('hashchange',openStudentAssignment);openStudentAssignment();
</script>
