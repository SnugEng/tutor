<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>404 · Страница не найдена · Анастасия</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" as="style" href="fonts.css">
<link rel="stylesheet" href="fonts.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--w:600px;--p:20px;--sans:'DM Sans';--black:#1a1a1a;--acid:#f4ed6b;--white:#f0ece0;--gray:#8a8a8a}
html,body{min-height:100%}
body{font-family:var(--sans);font-weight:400;background:var(--black);color:var(--white);line-height:1.5;overflow-x:hidden;display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
.nav{position:sticky;top:0;z-index:100;background:var(--black);border-bottom:2px solid var(--acid)}
.nav-in{width:100%;max-width:var(--w);margin:0 auto;padding:8px var(--p);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;min-height:50px}
.nav-logo{justify-self:center;color:var(--acid);line-height:0;text-decoration:none}
.nav-logo svg{width:18px;height:18px;display:block}
.nav-links{display:flex;align-items:center;gap:24px;justify-self:end}
.nav-link{font-size:.65rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:rgba(240,236,224,.45);text-decoration:none;transition:.2s}
.nav-link:hover{color:var(--acid)}
.nav-cta{font-size:.65rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--black);background:var(--acid);padding:11px 18px;text-decoration:none;justify-self:end;transition:.2s}
.nav-cta:hover{background:var(--white)}
.main{position:relative;overflow:hidden;display:flex;align-items:center;min-height:calc(100vh - 104px);background:radial-gradient(circle at 50% 0,rgba(244,237,107,.11),transparent 35%),var(--black)}
.main::before{content:'404';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:min(58vw,32rem);font-weight:900;letter-spacing:.08em;color:rgba(244,237,107,.05);line-height:.8;pointer-events:none}
.wrap{width:100%;max-width:var(--w);margin:0 auto;padding:76px var(--p);position:relative;z-index:2}
.kicker{display:block;font-size:.63rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:var(--acid);margin-bottom:14px}
.title{font-size:clamp(3.9rem,12vw,7.2rem);line-height:.86;letter-spacing:-.07em;text-transform:uppercase;font-weight:900;max-width:560px;color:var(--white);margin-bottom:24px}
.title span{display:block;color:var(--acid)}
.text{max-width:390px;font-size:.92rem;color:rgba(240,236,224,.58);line-height:1.7;margin-bottom:30px}
.actions{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:43px;background:var(--acid);color:var(--black);padding:0 26px;text-decoration:none;font-size:.7rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;transition:.2s}
.btn:hover{background:var(--white)}
.ghost{display:inline-flex;align-items:center;color:rgba(240,236,224,.38);text-decoration:none;border-bottom:1px solid rgba(240,236,224,.2);font-size:.68rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;transition:.2s}
.ghost:hover{color:var(--acid);border-color:var(--acid)}
.footer{background:var(--black);border-top:2px solid var(--acid)}
.footer-in{width:100%;max-width:var(--w);margin:0 auto;padding:17px var(--p);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.footer a{color:rgba(240,236,224,.3);text-decoration:none;font-size:.62rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;transition:.2s}
.footer a:hover{color:var(--acid)}
@media(max-width:700px){.main::before{display:none}.nav-links{display:none}.nav-in{grid-template-columns:1fr auto 1fr}.nav-cta{padding:10px 14px;font-size:.58rem}.wrap{padding-top:58px;padding-bottom:58px}.title{font-size:clamp(3.2rem,18vw,5.4rem)}}
</style>
</head>
<body>
<header class="nav">
  <div class="nav-in">
  </div>
</header>
<main class="main">
  <section class="wrap">
    <span class="kicker">Ошибка 404</span>
    <h1 class="title">Свернули<span>не туда.</span></h1>
    <p class="text">Такой страницы нет или она переехала. Вернитесь на главную — там всё на месте.</p>
    <div class="actions">
      <a class="btn" href="index.html">На главную</a>
    </div>
  </section>
</main>
<footer class="footer">
  <div class="footer-in">
    <a href="https://t.me/m/E980QaoaYzgy">Анастасия · Преподаватель →</a>
    <a href="index.html">Вернуться на главную →</a>
  </div>
</footer>
</body>
</html>
