html,body{height:100%;margin:0;padding:0;}

.logo svg{width:13px;height:13px;flex-shrink:0;color:var(--accent);}

.main{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  overflow:hidden;
  position:relative;
}

.map-bg{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;user-select:none;animation:mapIn 1.2s .2s ease forwards;overflow:hidden}
.map-bg svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:max(1400px,130%);height:auto;display:block}
.map-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 520px 340px at center,rgba(24,18,12,.78) 0%,rgba(24,18,12,.5) 45%,transparent 78%);pointer-events:none}
@keyframes mapIn{from{opacity:0;transform:scale(.98)}to{opacity:.75;transform:scale(1)}}

.content{
  position:relative;
  z-index:2;
  text-align:center;
  width:100%;
  max-width:var(--w);
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:80px var(--p);
}

.title{
  font-family:var(--serif);font-size:clamp(2.2rem,6vw,3.6rem);
  font-weight:300;line-height:1.1;
  color:var(--white);margin-bottom:14px;
  opacity:0;animation:up .8s .7s ease forwards;
}
.title em{font-style:italic;color:rgba(212,169,74,.95)}
.desc{
  font-size:.87rem;color:var(--dim);line-height:1.85;
  max-width:360px;margin:0 auto 32px;
  opacity:0;animation:up .8s .85s ease forwards;
}
.btn{
  display:inline-block;background:var(--accent);color:var(--white);
  padding:13px 32px;font-size:.73rem;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;text-decoration:none;
  transition:background .3s;
  opacity:0;animation:up .8s 1s ease forwards;
}
.btn:hover{background:rgba(191,140,48,.8)}

.footer-band{background:rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.05);}
.footer{max-width:var(--w);margin:0 auto;padding:20px var(--p);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.footer a{font-family:var(--serif);font-style:italic;font-size:.82rem;color:var(--dim);text-decoration:none;transition:color .2s;}
.footer a:hover{color:var(--accent)}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
</style>
