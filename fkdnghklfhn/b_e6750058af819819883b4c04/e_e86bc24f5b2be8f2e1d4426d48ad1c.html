function render(){renderNav();document.getElementById('tabTitle').textContent=activeTab.name;document.getElementById('smallTitle').textContent=activeTab.name.toLocaleLowerCase('ru');const q=search.value.trim().toLocaleLowerCase('ru');let visibleCards=0;const sections=[];for(const section of activeTab.sections){const cards=section.cards.filter(card=>!q||[card.title,card.description,card.service].join(' ').toLocaleLowerCase('ru').includes(q));if(!cards.length)continue;visibleCards+=cards.length;const sectionEl=el('section','column');const head=el('header','column-head');head.append(el('h3','column-title',section.title),el('span','column-count',String(cards.length).padStart(2,'0')));const list=el('div','cards');for(const card of cards){const cardEl=el('article','card');const previewLink=el('a','preview-link');previewLink.href=card.url||'#';previewLink.target='_blank';previewLink.rel='nofollow noopener noreferrer';if(card.preview){const img=el('img','preview');img.src=card.preview;img.alt='';img.loading='lazy';previewLink.append(img)}else{const placeholder=el('div','placeholder'+(card.type==='audio'?' audio':''));placeholder.dataset.label=card.service;previewLink.append(placeholder)}const body=el('div','card-body');body.append(el('div','service',card.service),el('h4','card-title',card.title));if(card.description)body.append(el('p','description',card.description));if(card.type==='audio'){const audio=el('audio','audio-control');audio.controls=true;audio.preload='none';audio.src=card.url;body.append(audio)}else{const actions=el('div','card-actions');for(const item of cardLinks(card)){const action=el('a','card-action'+(item.alt?' alt':''),item.label+' ↗');action.href=item.url;action.target='_blank';action.rel='nofollow noopener noreferrer';actions.append(action)}body.append(actions)}cardEl.append(previewLink,body);list.append(cardEl)}sectionEl.append(head,list);sections.push(sectionEl)}boardEl.replaceChildren(...sections);const isEmpty=!sections.length;boardEl.classList.toggle('hidden',isEmpty);empty.classList.toggle('hidden',!isEmpty);document.getElementById('tabStats').textContent=String(visibleCards).padStart(2,'0')+' материалов · '+String(sections.length).padStart(2,'0')+' секций';document.getElementById('boardWrap').scrollTo({top:0})}
search.addEventListener('input',render);window.addEventListener('hashchange',()=>{const next=data.tabs.find(t=>t.id===location.hash.slice(1));if(next&&next.id!==activeTab.id){activeTab=next;search.value='';render()}});render();
</script>
