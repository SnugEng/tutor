<script>
const data=JSON.parse(document.getElementById('boardData').textContent);
const cleanText=value=>String(value??'').normalize('NFKC').replace(/\s+/g,' ').trim();
for(const tab of data.tabs)tab.name=cleanText(tab.name);
const nav=document.getElementById('nav'),boardEl=document.getElementById('board'),empty=document.getElementById('empty'),search=document.getElementById('search');
let activeTab=(location.hash.slice(1)&&data.tabs.find(t=>t.id===location.hash.slice(1)))||data.tabs[0];
const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
function navGroupName(name,fallback){const normalized=cleanText(name);const explicit=normalized.match(/(?:^| )Units? +([0-9]+)(?: *[-–&] *([0-9]+))?/i);if(explicit)return explicit[2]?'UNITS '+explicit[1]+'–'+explicit[2]:'UNIT '+explicit[1];const direct=normalized.match(/^([0-9]+)[.]([0-9]+)(?: |$)/);if(direct)return 'UNIT '+direct[1];const review=normalized.match(/(?:Review|Revision) +([0-9]+)(?: *[&–-] *([0-9]+))?/i);if(review)return review[2]?'UNITS '+review[1]+'–'+review[2]:'UNIT '+review[1];return fallback||'COURSE FILES'}
function renderNav(){const hasUnits=data.tabs.some(tab=>/^([0-9]+)[.]([0-9]+)(?: |$)/.test(tab.name)||/(?:^| )Units? +[0-9]+/i.test(tab.name));const items=[];let lastGroup='';for(const tab of data.tabs){const group=navGroupName(tab.name,lastGroup||(hasUnits?'COURSE FILES':'SECTIONS'));if(group!==lastGroup){items.push(el('div','nav-group',group));lastGroup=group}const btn=el('button','nav-btn'+(tab.id===activeTab.id?' active':''));btn.type='button';btn.append(el('span','nav-name',tab.name),el('span','nav-count',String(tab.count).padStart(2,'0')));btn.onclick=()=>{activeTab=tab;location.hash=tab.id;search.value='';render()};items.push(btn)}nav.replaceChildren(...items)}
function cardLinks(url){try{const parsed=new URL(url,location.href);if(/(^|\.)vznaniya\.com$/i.test(parsed.hostname)){const alt=new URL(parsed.href);alt.protocol='https:';alt.hostname=alt.hostname.replace(/vznaniya\.com$/i,'shkola.app');return[{label:'VZNANIYA',url:parsed.href},{label:'SHKOLA',url:alt.href,alt:true}]}if(/(^|\.)shkola\.app$/i.test(parsed.hostname)){const alt=new URL(parsed.href);alt.protocol='https:';alt.hostname=alt.hostname.replace(/shkola\.app$/i,'vznaniya.com');return[{label:'SHKOLA',url:parsed.href,alt:true},{label:'VZNANIYA',url:alt.href}]}return[{label:'ОТКРЫТЬ',url:url}]}catch{return[{label:'ОТКРЫТЬ',url:url||'#'}]}}
function render(){renderNav();document.getElementById('tabTitle').textContent=activeTab.name;document.getElementById('smallTitle').textContent=activeTab.name.toLocaleLowerCase('ru');const q=search.value.trim().toLocaleLowerCase('ru');let visibleCards=0;const sections=[];for(const section of activeTab.sections){const cards=section.cards.filter(card=>!q||[card.title,card.description,card.service].join(' ').toLocaleLowerCase('ru').includes(q));if(!cards.length)continue;visibleCards+=cards.length;const sectionEl=el('section','column');const head=el('header','column-head');head.append(el('h3','column-title',section.title),el('span','column-count',String(cards.length).padStart(2,'0')));const list=el('div','cards');for(const card of cards){const cardEl=el('article','card');const previewLink=el('a','preview-link');previewLink.href=card.url||'#';previewLink.target='_blank';previewLink.rel='nofollow noopener noreferrer';if(card.preview){const img=el('img','preview');img.src=card.preview;img.alt='';img.loading='lazy';previewLink.append(img)}else{previewLink.append(el('div','placeholder',card.service))}const body=el('div','card-body');body.append(el('div','service',card.service),el('h4','card-title',card.title));if(card.description)body.append(el('p','description',card.description));const actions=el('div','card-actions');for(const item of cardLinks(card.url)){const action=el('a','card-action'+(item.alt?' alt':''),item.label+' ↗');action.href=item.url;action.target='_blank';action.rel='nofollow noopener noreferrer';actions.append(action)}body.append(actions);cardEl.append(previewLink,body);list.append(cardEl)}sectionEl.append(head,list);sections.push(sectionEl)}boardEl.replaceChildren(...sections);const isEmpty=!sections.length;boardEl.classList.toggle('hidden',isEmpty);empty.classList.toggle('hidden',!isEmpty);document.getElementById('tabStats').textContent=String(visibleCards).padStart(2,'0')+' materials · '+String(sections.length).padStart(2,'0')+' sections';document.getElementById('boardWrap').scrollTo({top:0})}
search.addEventListener('input',render);window.addEventListener('hashchange',()=>{const next=data.tabs.find(t=>t.id===location.hash.slice(1));if(next&&next.id!==activeTab.id){activeTab=next;search.value='';render()}});render();
</script>
