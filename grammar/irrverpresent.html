<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<title>Irregular Present Forms</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="../assets/snug.css">
<script src="../assets/snug.js"></script>
</head>
<body translate="no">
<script>
const GROUPS = [
  { title: 'Special verbs: be & have', verbs: [
    { verb: 'be', rows: [
      ['I',           "am ('m)",    "am not ('m not)"],
      ['you/we/they', "are ('re)",  "are not (aren't)"],
      ['he/she/it',   "is ('s)",    "is not (isn't)"] ] },
    { verb: 'have', rows: [
      ['I/you/we/they', "have ('ve)", "have not (haven't)"],
      ['he/she/it',     "has ('s)",   "has not (hasn't)"] ] }
  ] },
  { title: 'Verbs ending in', ending: '-o', verbs: [
    { verb: 'do', rows: [['I/you/we/they', 'do', "do not (don't)"], ['he/she/it', 'does', "does not (doesn't)"]] },
    { verb: 'go', rows: [['I/you/we/they', 'go', "don't go"],       ['he/she/it', 'goes', "doesn't go"]] }
  ] },
  { title: 'Verbs ending in', ending: 'consonant + -y', rule: '→ -ies', verbs: [
    { verb: 'fly',   tag: 'y → ies', rows: [['I/you/we/they', 'fly',   "don't fly"],   ['he/she/it', 'flies',   "doesn't fly"]] },
    { verb: 'study', tag: 'y → ies', rows: [['I/you/we/they', 'study', "don't study"], ['he/she/it', 'studies', "doesn't study"]] }
  ] },
  { title: 'Verbs ending in', ending: '-s, -z, -ch, -sh, -x', rule: '→ +es', verbs: [
    { verb: 'pass',  tag: '-s +es',  rows: [['I/you/we/they', 'pass',  "don't pass"],  ['he/she/it', 'passes',  "doesn't pass"]] },
    { verb: 'buzz',  tag: '-z +es',  rows: [['I/you/we/they', 'buzz',  "don't buzz"],  ['he/she/it', 'buzzes',  "doesn't buzz"]] },
    { verb: 'watch', tag: '-ch +es', rows: [['I/you/we/they', 'watch', "don't watch"], ['he/she/it', 'watches', "doesn't watch"]] },
    { verb: 'wish',  tag: '-sh +es', rows: [['I/you/we/they', 'wish',  "don't wish"],  ['he/she/it', 'wishes',  "doesn't wish"]] },
    { verb: 'mix',   tag: '-x +es',  rows: [['I/you/we/they', 'mix',   "don't mix"],   ['he/she/it', 'mixes',   "doesn't mix"]] }
  ] }
];

const MCQ = [
  {q:'He _____ to school every day.',            opts:['go','goes','gos','is go'],          ans:'goes'},
  {q:'She _____ not like coffee.',               opts:['do','is','does','has'],              ans:'does'},
  {q:'They _____ playing football now.',         opts:['is','am','are','be'],                ans:'are'},
  {q:'He _____ a dog.',                          opts:["haven't","hasn't","don't have","not have"], ans:"hasn't"},
  {q:'The bird _____ south in winter.',          opts:['flys','fly','flies','flyes'],        ans:'flies'},
  {q:'She _____ the bus every morning.',         opts:['miss','misses','mises','missies'],   ans:'misses'},
  {q:'He _____ the music very loud.',            opts:['mix','mixes','mixs','mixed'],        ans:'mixes'},
  {q:'I _____ not ready yet.',                   opts:['is','are','am','be'],                ans:'am'},
  {q:'She _____ her hands before eating.',       opts:['washs','wash','washes','washies'],   ans:'washes'},
  {q:'He _____ TV every evening.',               opts:['watch','watchs','watches','watche'], ans:'watches'},
  {q:'They _____ have a car.',                   opts:["don't","doesn't","isn't","aren't"],  ans:"don't"},
  {q:'She _____ English at university.',         opts:['study','studys','studies','studyes'],ans:'studies'},
  {q:'He _____ the bus to work.',                opts:['catch','caches','catchs','catches'], ans:'catches'},
  {q:'The baby _____ all night.',                opts:['cry','crys','cries','cryes'],        ans:'cries'},
  {q:'She _____ a lot of books.',                opts:['reads','read','reades','is read'],   ans:'reads'},
];

const GAP = [
  {s:'She _____ (watch) TV every night.',        ans:'watches'},
  {s:'He _____ (fly) to London twice a year.',   ans:'flies'},
  {s:'It _____ (buzz) loudly.',                  ans:'buzzes'},
  {s:'I _____ (be) a student.',                  ans:'am'},
  {s:'She _____ (have) two cats.',               ans:'has'},
  {s:'He _____ (do) his homework every day.',    ans:'does'},
  {s:'She _____ (go) to the gym on Mondays.',    ans:'goes'},
  {s:'He _____ (mix) the ingredients carefully.',ans:'mixes'},
  {s:'She _____ (wish) she could travel more.',  ans:'wishes'},
  {s:'The team _____ (pass) the ball quickly.',  ans:'passes'},
  {s:'He _____ (study) medicine at university.', ans:'studies'},
  {s:'She _____ (catch) the early train.',       ans:'catches'},
  {s:'The baby _____ (cry) every night.',        ans:'cries'},
  {s:'He _____ (be) very happy today.',          ans:'is'},
];

Snug.present({
  groups: GROUPS,
  mcq: MCQ,
  gaps: GAP
});
</script>
</body>
</html>
