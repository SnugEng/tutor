<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<title>Unit 33 – Vocabulary: Creating and building</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --accent:   #e8b84b;
    --accent-h: #f0cc72;
    --green:    #5aaa85;
    --red:      #d95f5f;
  }

  [data-theme="dark"] {
    --bg:       #0d0d12;
    --surface:  #17171f;
    --surface2: #1f1f2a;
    --text:     #e8e8f0;
    --text2:    #7a7a96;
    --border:   rgba(255,255,255,0.08);
  }

  [data-theme="light"] {
    --bg:       #f4f3ef;
    --surface:  #ffffff;
    --surface2: #eceae6;
    --text:     #1a1a24;
    --text2:    #6b6b7e;
    --border:   rgba(0,0,0,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background 0.3s, color 0.3s;
  }

  header {
    padding: 1.6rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem;
  }
  header h1 { font-family: 'Playfair Display', serif; font-size: 1.7rem; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .header-title { display: flex; align-items: center; gap: 1rem; }

  .back-btn {
    padding: 0.4rem 1rem; border-radius: 2rem; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.83rem; font-weight: 500;
    text-decoration: none; display: inline-flex; align-items: center; gap: 0.3rem;
    transition: all 0.2s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .theme-switch {
    position: relative;
    width: 56px; height: 28px;
    border-radius: 14px;
    cursor: pointer;
    border: none;
    padding: 0;
    background: #3a3a4a;
    transition: background 0.35s;
    flex-shrink: 0;
  }
  [data-theme="light"] .theme-switch { background: #e8e0d4; }

  .theme-switch-knob {
    position: absolute;
    top: 50%; left: 4px;
    transform: translateY(-50%);
    width: 22px; height: 22px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    transition: left 0.35s cubic-bezier(.4,0,.2,1);
    pointer-events: none;
    line-height: 1;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  [data-theme="light"] .theme-switch-knob { left: 30px; }

  .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .tab {
    padding: 0.45rem 1.1rem; border-radius: 2rem; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.83rem; font-weight: 500;
    transition: all 0.2s;
  }
  .tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .tab:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

  main { flex: 1; }

  footer { padding: 1.2rem 2rem; border-top: 1px solid var(--border); }
  .footer-content { display: flex; align-items: center; justify-content: center; gap: 1.5rem; flex-wrap: wrap; }
  .footer-brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--text2); letter-spacing: 0.5px; }
  .footer-brand span { color: var(--accent); }
  .footer-links { display: flex; gap: 0.7rem; }
  .footer-link {
    padding: 0.3rem 0.9rem; border-radius: 2rem;
    border: 1px solid var(--border); background: transparent;
    color: var(--text2); text-decoration: none; font-size: 0.83rem;
    transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.3rem;
  }
  .footer-link:hover { border-color: var(--accent); color: var(--accent); }

  #dict, #wordForm { padding: 1.5rem 2rem; }
  .search-bar { display: flex; gap: 0.8rem; margin-bottom: 1.2rem; }
  .search-bar input {
    flex: 1; padding: 0.65rem 1rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 0.6rem; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.92rem;
    outline: none; transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .filter-btns { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .filter-btn {
    padding: 0.35rem 0.85rem; border-radius: 1rem; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer; font-size: 0.77rem;
    transition: all 0.2s; font-family: 'DM Sans', sans-serif;
  }
  .filter-btn.on { background: var(--red); color: #fff; border-color: var(--red); }

  .dict-table { width: 100%; border-collapse: collapse; }
  .dict-table th {
    text-align: left; padding: 0.65rem 1rem;
    font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text2); border-bottom: 1px solid var(--border);
  }
  .dict-table td { padding: 0.85rem 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: top; }
  .dict-table tr:hover td { background: var(--surface2); }
  .word-cell { font-weight: 500; white-space: nowrap; }
  .pos { font-size: 0.71rem; color: var(--red); font-style: italic; margin-left: 4px; }
  .def-cell { color: var(--text); opacity: 0.85; }
  .ex-cell { color: var(--text2); font-style: italic; font-size: 0.84rem; }
  .no-results { text-align: center; padding: 3rem; color: var(--text2); }

  .speak-btn {
    background: none; border: none; cursor: pointer;
    color: var(--text2); font-size: 1rem; padding: 0.2rem 0.3rem;
    border-radius: 0.3rem; transition: color 0.15s, transform 0.15s;
    line-height: 1; display: inline-flex; align-items: center;
  }
  .speak-btn:hover { color: var(--accent); transform: scale(1.2); }
  .speak-btn:active { transform: scale(0.95); }
  .card-speak {
    margin-top: 0.8rem;
    background: none; border: 1px solid var(--border); cursor: pointer;
    color: var(--text2); padding: 0.4rem 0.9rem;
    border-radius: 2rem; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
  }
  .card-speak:hover { border-color: var(--accent); color: var(--accent); }

  .wf-forms {
    color: var(--accent);
    font-size: 0.9rem;
    display: flex; flex-wrap: wrap; gap: 0.4rem 0.6rem;
  }
  .wf-forms span {
    background: rgba(232,184,75,0.1);
    padding: 0.2rem 0.6rem; border-radius: 0.4rem;
    border: 1px solid rgba(232,184,75,0.25);
    display: inline-flex; align-items: baseline; gap: 0.3rem;
  }
  .wf-pos {
    font-size: 0.65rem; color: var(--text2);
    font-style: italic; font-weight: 400;
  }

  #cards { display: none; padding: 2rem; flex-direction: column; align-items: center; }
  .card-counter { color: var(--text2); font-size: 0.84rem; margin-bottom: 1.5rem; }
  .card-wrap { perspective: 1200px; width: 100%; max-width: 560px; height: 350px; cursor: pointer; }
  .card-inner {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(.4,0,.2,1);
  }
  .card-wrap.flipped .card-inner { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    background: var(--surface); border: 1px solid var(--border); border-radius: 1.2rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 2.2rem; text-align: center;
  }
  .card-face.back { transform: rotateY(180deg); background: var(--surface2); justify-content: flex-start; padding-top: 2rem; overflow-y: auto; }
  .card-word { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--accent); }
  .card-pos-badge { margin-top: 0.6rem; padding: 0.2rem 0.7rem; border-radius: 1rem; background: rgba(232,184,75,0.15); color: var(--accent); font-size: 0.8rem; }
  .card-hint { color: var(--text2); font-size: 0.77rem; margin-top: 1.2rem; }
  .card-def { font-size: 1.05rem; color: var(--text); line-height: 1.6; padding: 0 0.5rem; }
  .card-ex { margin-top: 1.2rem; font-style: italic; color: var(--text2); font-size: 1rem; border-top: 1px solid var(--border); padding: 1.2rem 0.5rem 0; width: 100%; }
  .card-controls { display: flex; gap: 1rem; margin-top: 1.8rem; }
  .ctrl-btn {
    padding: 0.6rem 1.5rem; border-radius: 2rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem; transition: all 0.2s;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .ctrl-btn.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
  .ctrl-btn.primary:hover { background: var(--accent-h); }
  .shuffle-row { margin-top: 1rem; display: flex; gap: 0.7rem; }

  .category-selector { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; justify-content: center; }
  .category-btn {
    padding: 0.45rem 1.1rem; border-radius: 2rem; border: 1px solid var(--border);
    background: var(--surface); color: var(--text2); cursor: pointer;
    font-family: 'DM Sans', sans-serif; font-size: 0.83rem; transition: all 0.2s;
  }
  .category-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
  .category-btn.random { background: var(--red); color: #fff; border-color: var(--red); opacity: 0.9; }
  .category-btn.random.active { opacity: 1; filter: brightness(1.1); }

  .random-controls {
    display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem;
    background: var(--surface); padding: 0.5rem 1rem;
    border-radius: 3rem; border: 1px solid var(--border);
  }
  .random-input {
    width: 70px; padding: 0.45rem;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 1.5rem; color: var(--text); text-align: center;
    font-family: 'DM Sans', sans-serif; font-size: 0.88rem; outline: none;
    -moz-appearance: textfield;
  }
  .random-input::-webkit-outer-spin-button,
  .random-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .random-input:focus { border-color: var(--accent); }
  .random-label { color: var(--text2); font-size: 0.88rem; }

  #quiz { display: none; padding: 2rem; max-width: 600px; margin: 0 auto; }
  .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
  .quiz-score { font-size: 0.84rem; color: var(--text2); }
  .score-val { color: var(--accent); font-weight: 600; }
  .progress-bar { height: 4px; background: var(--surface); border-radius: 2px; margin-bottom: 2rem; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
  .q-card { background: var(--surface); border: 1px solid var(--border); border-radius: 1rem; padding: 1.8rem; margin-bottom: 1.5rem; }
  .q-label { font-size: 0.71rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text2); margin-bottom: 0.6rem; }
  .q-text { font-size: 1.1rem; font-weight: 500; line-height: 1.5; }
  .q-options { display: grid; gap: 0.7rem; }
  .q-opt {
    padding: 0.85rem 1.1rem; border-radius: 0.7rem; border: 1px solid var(--border);
    background: var(--surface2); cursor: pointer; font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem; color: var(--text); transition: all 0.18s; text-align: left;
  }
  .q-opt:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .q-opt.correct { border-color: var(--green); background: rgba(90,170,133,0.12); color: var(--green); }
  .q-opt.wrong   { border-color: var(--red);   background: rgba(217,95,95,0.1);   color: var(--red);   }
  .q-feedback { font-size: 0.84rem; margin-top: 0.5rem; min-height: 1.2em; }
  .q-next-btn {
    display: none; width: 100%; padding: 0.85rem; border-radius: 0.7rem; border: none;
    background: var(--accent); color: #000; font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: background 0.2s;
  }
  .q-next-btn:hover { background: var(--accent-h); }
  .quiz-done { text-align: center; padding: 2rem; }
  .quiz-done .big { font-family: 'Playfair Display', serif; font-size: 3rem; color: var(--accent); }
  .quiz-restart {
    margin-top: 1.2rem; padding: 0.7rem 2rem; border-radius: 2rem;
    border: 1px solid var(--accent); background: transparent; color: var(--accent);
    cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; transition: all 0.2s;
  }
  .quiz-restart:hover { background: var(--accent); color: #000; }

  @media(max-width:600px) {
    header { padding: 1.2rem; }
    #dict, #cards, #quiz, #wordForm { padding: 0.75rem; }
    footer { padding: 1rem; }
    .footer-content { gap: 1rem; }
    .card-wrap { height: 400px; }
    .dict-table thead { display: none; }
    .dict-table, .dict-table tbody, .dict-table tr, .dict-table td {
      display: block; width: 100%;
    }
    .dict-table tr {
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      margin-bottom: 0.75rem;
      padding: 0.75rem 0.9rem;
      background: var(--surface);
    }
    .dict-table tr:hover td { background: transparent; }
    .dict-table td {
      padding: 0.25rem 0; border-bottom: none; font-size: 0.88rem;
    }
    .dict-table td::before {
      content: attr(data-label);
      font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--text2); display: block; margin-bottom: 0.15rem;
    }
    .word-cell { font-size: 1rem; margin-bottom: 0.4rem; }
    .def-cell { margin-bottom: 0.4rem; }
    .ex-cell { display: block !important; }
  }

  .speak-btn.speak-loading { color: var(--accent); opacity: 0.6; }
  .card-speak.speak-loading { border-color: var(--accent); color: var(--accent); opacity: 0.7; }
</style>
</head>
<body translate="no">

<header>
  <div class="header-title">
    <button class="theme-switch" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">
      <span class="theme-switch-knob" id="themeKnob">🌙</span>
    </button>
    <h1>Unit <span>33</span> — Vocabulary: Creating and building</h1>
  </div>
  <div style="display:flex;align-items:center;gap:0.8rem;flex-wrap:wrap;">
    <a href="index.html" class="back-btn">← All Units</a>
    <div class="tabs">
      <button class="tab active" onclick="showTab('dict',this)">Dictionary</button>
      <button class="tab" onclick="showTab('cards',this)">Flashcards</button>
      <button class="tab" onclick="showTab('quiz',this)">Quiz</button>
      <button class="tab" onclick="showTab('wordForm',this)">Word Formation</button>
    </div>
  </div>
</header>

<main>
<section id="dict">
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search word or definition…" oninput="renderDict()">
  </div>
  <div class="filter-btns" id="filterBtns"></div>
  <br>
  <table class="dict-table">
    <thead><tr>
      <th>Word</th><th>Definition</th><th>Example</th>
    </tr></thead>
    <tbody id="dictBody"></tbody>
  </table>
</section>

<section id="cards" style="display:none; flex-direction:column; align-items:center; padding:2rem;">
  <div class="category-selector" id="cardCategorySelector">
    <button class="category-btn active" onclick="selectCardCategory('all', this)">All Words</button>
    <button class="category-btn" onclick="selectCardCategory('topic', this)">Topic Vocabulary</button>
    <button class="category-btn" onclick="selectCardCategory('phrasal', this)">Phrasal Verbs</button>
    <button class="category-btn" onclick="selectCardCategory('prepositional', this)">Prepositional Phrases</button>
    <button class="category-btn" onclick="selectCardCategory('patterns', this)">Word Patterns</button>
    <button class="category-btn random" onclick="selectCardCategory('random', this)">Random</button>
  </div>
  <div class="random-controls" id="randomControls" style="display: none;">
    <span class="random-label">Cards:</span>
    <input type="number" id="randomCount" class="random-input" min="5" max="50" value="15">
    <button class="ctrl-btn" style="padding:0.4rem 1.2rem;" onclick="updateRandomDeck()">Generate</button>
  </div>
  <div class="card-counter" id="cardCounter">Card 1 / 0</div>
  <div class="card-wrap" id="cardWrap" onclick="this.classList.toggle('flipped')">
    <div class="card-inner">
      <div class="card-face front">
        <div class="card-word" id="cWord"></div>
        <div class="card-pos-badge" id="cPos"></div>
        <button class="card-speak" onclick="event.stopPropagation(); speak(document.getElementById('cWord').textContent, this)">🔊 Listen</button>
        <div class="card-hint">tap card to reveal</div>
      </div>
      <div class="card-face back">
        <div class="card-def" id="cDef"></div>
        <div class="card-ex" id="cEx"></div>
      </div>
    </div>
  </div>
  <div class="card-controls">
    <button class="ctrl-btn" onclick="prevCard()">← Prev</button>
    <button class="ctrl-btn primary" onclick="nextCard()">Next →</button>
  </div>
  <div class="shuffle-row">
    <button class="ctrl-btn" onclick="shuffleCards()">Shuffle</button>
    <button class="ctrl-btn" onclick="resetCards()">Reset</button>
  </div>
</section>

<section id="quiz" style="display:none; max-width:600px; margin:0 auto; padding:2rem;">
  <div id="quizContent"></div>
</section>

<section id="wordForm" style="display:none; padding:2rem;">
  <div class="search-bar">
    <input type="text" id="wfSearchInput" placeholder="Search base word or form…" oninput="renderWordForm()">
  </div>
  <br>
  <table class="dict-table">
    <thead><tr>
      <th>Base Word</th><th>Word Forms</th>
    </tr></thead>
    <tbody id="wfBody"></tbody>
  </table>
</section>
</main>

<footer>
  <div class="footer-content">
    <div class="footer-brand">@ <span>snugenglish</span></div>
    <div class="footer-links">
      <a href="https://vk.com/snugenglish" target="_blank" class="footer-link vk">VK</a>
      <a href="https://t.me/+wiAl8ae-UoAxMDE6" target="_blank" class="footer-link tg">Telegram</a>
    </div>
  </div>
</footer>

<script>
const DATA = [
  // Topic Vocabulary
  {w:"ancient",pos:"adj",def:"very old",ex:"They've found an ancient city at the bottom of the sea.",category:"topic"},
  {w:"checked",pos:"adj",def:"printed or woven in a pattern of squares",ex:"I got a new red and blue checked shirt.",category:"topic"},
  {w:"cotton",pos:"n",def:"cloth made from the white fibres of a plant called a cotton plant",ex:"Is this shirt made out of cotton?",category:"topic"},
  {w:"create",pos:"v",def:"to make something new exist or happen",ex:"How do I create a new file?",category:"topic"},
  {w:"design",pos:"v",def:"to decide how something will be made, how it will work, or what it will look like, and often to make drawings of it",ex:"The bride wore a dress that she'd designed herself.",category:"topic"},
  {w:"design",pos:"n",def:"the way that something is made so that it works and looks a certain way, or a drawing that shows what it will look like",ex:"The car has a new design.",category:"topic"},
  {w:"fix",pos:"v",def:"to repair something",ex:"Jessica fixed my watch.",category:"topic"},
  {w:"fold",pos:"v",def:"to bend a piece of paper or cloth and press one part of it over another part",ex:"Fold the paper in half.",category:"topic"},
  {w:"gallery",pos:"n",def:"a public building where you can look at paintings and other works of art",ex:"We could go to a museum or a gallery this weekend.",category:"topic"},
  {w:"improvement",pos:"n",def:"the state of being better than before, or the process of making something better than it was before",ex:"There has been an improvement in relations between the two countries.",category:"topic"},
  {w:"loose",pos:"adj",def:"loose clothes are large and do not fit your body tightly",ex:"These jeans are a bit loose, so maybe I need a smaller size.",category:"topic"},
  {w:"maintain",pos:"v",def:"to make regular repairs to something, so that it stays in good condition",ex:"The car had been very well maintained.",category:"topic"},
  {w:"match",pos:"v",def:"if one thing matches another, or they match, they form an attractive combination",ex:"She wore a green dress and a hat to match.",category:"topic"},
  {w:"material",pos:"n",def:"cloth",ex:"What sort of material is your dress made from?",category:"topic"},
  {w:"notice",pos:"v",def:"to become conscious of someone or something by seeing, hearing, or feeling them",ex:"After a few days here you hardly notice the rain!",category:"topic"},
  {w:"notice",pos:"n",def:"a written sign or announcement that gives information or that warns people about something",ex:"They put up a notice on the door saying they'd gone out of business.",category:"topic"},
  {w:"pattern",pos:"n",def:"a set of lines, shapes, or colours that are repeated regularly",ex:"I like the pattern on your carpet.",category:"topic"},
  {w:"pile",pos:"n",def:"a number of things that are put on top of each other in an untidy way",ex:"Rubbish lay in piles in the street.",category:"topic"},
  {w:"practical",pos:"adj",def:"involving, or relating to, real situations rather than theories or ideas alone",ex:"Practical experience can be as valuable as academic qualifications.",category:"topic"},
  {w:"rough",pos:"adj",def:"with a surface that is not smooth",ex:"The walls were built of dark rough stone.",category:"topic"},
  {w:"shape",pos:"n",def:"the form of something",ex:"Trace the shape onto the card and cut it out.",category:"topic"},
  {w:"silk",pos:"n",def:"a thin smooth cloth made from the fibres produced by insects called silkworms",ex:"I love your new silk shirt!",category:"topic"},
  {w:"sleeve",pos:"n",def:"the part of a piece of clothing that covers your arm",ex:"Oh, no! I've got a hole in one of my sleeves.",category:"topic"},

  {w:"at the back (of)",pos:"prep phr",def:"at the rear part of something",ex:"Let's go and sit at the back.",category:"prepositional"},

const WORD_FORM_DATA = [
  {base:"art",pos:"n",forms:[{w:"artist",pos:"n"},{w:"artistic",pos:"adj"}]},
  {base:"break",pos:"v",forms:[{w:"broke",pos:"v"},{w:"broken",pos:"adj"},{w:"(un)breakable",pos:"adj"}]},
  {base:"compose",pos:"v",forms:[{w:"composition",pos:"n"},{w:"composer",pos:"n"}]},
  {base:"exhibit",pos:"v",forms:[{w:"exhibition",pos:"n"}]},
  {base:"free",pos:"adj",forms:[{w:"freedom",pos:"n"}]},
  {base:"hand",pos:"n",forms:[{w:"handful",pos:"n"},{w:"handle",pos:"n/v"}]},
  {base:"imagine",pos:"v",forms:[{w:"imagination",pos:"n"},{w:"imaginative",pos:"adj"}]},
  {base:"intelligent",pos:"adj",forms:[{w:"intelligence",pos:"n"}]},
  {base:"perfect",pos:"adj",forms:[{w:"perfection",pos:"n"},{w:"imperfect",pos:"adj"}]},
  {base:"prepare",pos:"v",forms:[{w:"preparation",pos:"n"}]},
];

function showTab(name, el) {
  ['dict','cards','quiz','wordForm'].forEach(t => {
    document.getElementById(t).style.display = 'none';
  });
  const section = document.getElementById(name);
  if (name === 'dict' || name === 'wordForm') {
    section.style.display = 'block';
  } else {
    section.style.display = 'flex';
    if (name === 'quiz') section.style.display = 'block';
  }
  if(name==='quiz') initQuiz();
  if(name==='wordForm') renderWordForm();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

const posTypes = [...new Set(DATA.map(d=>d.pos))];
let activeFilters = new Set();

function renderFilterBtns() {
  const c = document.getElementById('filterBtns');
  c.innerHTML = posTypes.map(p =>
    `<button class="filter-btn${activeFilters.has(p)?' on':''}" onclick="toggleFilter('${p}')">${p}</button>`
  ).join('');
}

function toggleFilter(p) {
  if(activeFilters.has(p)) activeFilters.delete(p); else activeFilters.add(p);
  renderFilterBtns(); renderDict();
}

function renderDict() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let rows = DATA.filter(d => {
    const matchSearch = !q || d.w.toLowerCase().includes(q) || d.def.toLowerCase().includes(q);
    const matchFilter = activeFilters.size === 0 || activeFilters.has(d.pos);
    return matchSearch && matchFilter;
  });
  const tb = document.getElementById('dictBody');
  if(!rows.length) { tb.innerHTML = `<tr><td colspan="3" class="no-results">No words found.</td></tr>`; return; }
  tb.innerHTML = rows.map(d =>
    `<tr>
      <td class="word-cell" data-label="Word">${d.w}<span class="pos">${d.pos}</span><button class="speak-btn" onclick="speak('${d.w.replace(/'/g,"\\'")}', this)" title="Listen">🔊</button></td>
      <td class="def-cell" data-label="Definition">${d.def}</td>
      <td class="ex-cell" data-label="Example">${d.ex}</td>
    </tr>`
  ).join('');
}

renderFilterBtns();
renderDict();

let cardDeck = [...DATA];
let cardIdx = 0;
let currentCategory = 'all';

function filterByCategory(category) {
  if(category === 'all') return [...DATA];
  return DATA.filter(d => d.category === category);
}

function selectCardCategory(category, btn) {
  currentCategory = category;
  document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const randomControls = document.getElementById('randomControls');
  if(category === 'random') {
    randomControls.style.display = 'flex';
    updateRandomDeck();
  } else {
    randomControls.style.display = 'none';
    cardDeck = filterByCategory(category);
    cardIdx = 0;
    showCard();
  }
}

function updateRandomDeck() {
  const count = parseInt(document.getElementById('randomCount').value) || 15;
  const shuffled = [...DATA].sort(() => Math.random() - 0.5);
  cardDeck = shuffled.slice(0, Math.min(count, DATA.length));
  cardIdx = 0;
  showCard();
}

function showCard() {
  if(cardDeck.length === 0) {
    document.getElementById('cWord').textContent = 'No cards';
    document.getElementById('cPos').textContent = '';
    document.getElementById('cDef').textContent = 'Select a category with words';
    document.getElementById('cEx').textContent = '';
    document.getElementById('cardCounter').textContent = `Card 0 / 0`;
    return;
  }
  const c = cardDeck[cardIdx];
  document.getElementById('cardWrap').classList.remove('flipped');
  setTimeout(() => {
    document.getElementById('cWord').textContent = c.w;
    document.getElementById('cPos').textContent = c.pos;
    document.getElementById('cDef').textContent = c.def;
    document.getElementById('cEx').textContent = '"' + c.ex + '"';
    document.getElementById('cardCounter').textContent = `Card ${cardIdx+1} / ${cardDeck.length}`;
  }, 180);
}

function nextCard() {
  if(cardDeck.length === 0) return;
  cardIdx = (cardIdx+1) % cardDeck.length;
  showCard();
}

function prevCard() {
  if(cardDeck.length === 0) return;
  cardIdx = (cardIdx-1+cardDeck.length) % cardDeck.length;
  showCard();
}

function shuffleCards() {
  if(cardDeck.length === 0) return;
  cardDeck = [...cardDeck].sort(() => Math.random()-0.5);
  cardIdx = 0;
  showCard();
}

function resetCards() {
  if(currentCategory === 'random') {
    updateRandomDeck();
  } else {
    cardDeck = filterByCategory(currentCategory);
    cardIdx = 0;
    showCard();
  }
}

showCard();

let qIdx = 0, qScore = 0, qDeck = [], answered = false;

function initQuiz() {
  qDeck = [...DATA].sort(() => Math.random()-0.5).slice(0,15);
  qIdx = 0; qScore = 0; renderQuiz();
}

function renderQuiz() {
  const c = document.getElementById('quizContent');
  if(qIdx >= qDeck.length) {
    const pct = Math.round(qScore/qDeck.length*100);
    c.innerHTML = `<div class="quiz-done">
      <div class="big">${qScore}/${qDeck.length}</div>
      <div style="color:var(--text2);margin-top:0.5rem">${pct}% correct</div>
      <div style="font-size:1.2rem;margin-top:1rem">${pct>=80?'Excellent!':pct>=50?'Good effort!':'Keep practising!'}</div>
      <button class="quiz-restart" onclick="initQuiz()">Try again</button>
    </div>`; return;
  }
  const item = qDeck[qIdx];
  const others = DATA.filter(d => d.def !== item.def).sort(() => Math.random()-0.5).slice(0,3);
  const opts = [...others, item].sort(() => Math.random()-0.5);
  const progress = (qIdx/qDeck.length*100).toFixed(1);
  answered = false;

  c.innerHTML = `
    <div class="quiz-header">
      <span style="font-weight:500">Question ${qIdx+1} of ${qDeck.length}</span>
      <span class="quiz-score">Score: <span class="score-val">${qScore}</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div class="q-card">
      <div class="q-label">What is the definition of…</div>
      <div class="q-text">${item.w} <span class="pos">(${item.pos})</span></div>
    </div>
    <div class="q-options">
      ${opts.map((o,i)=>`<button class="q-opt" onclick="checkAnswer(this,'${item.def.replace(/'/g,"\\'").replace(/"/g,"&quot;")}','${o.def.replace(/'/g,"\\'").replace(/"/g,"&quot;")}',${i})">${o.def}</button>`).join('')}
    </div>
    <div class="q-feedback" id="qFeedback"></div>
    <button class="q-next-btn" id="qNext" onclick="nextQuestion()">Next →</button>
  `;
}

function checkAnswer(btn, correct, chosen, idx) {
  if(answered) return; answered = true;
  const opts = document.querySelectorAll('.q-opt');
  opts.forEach(o => o.disabled = true);
  const fb = document.getElementById('qFeedback');
  if(chosen === correct) {
    btn.classList.add('correct');
    fb.style.color = '#4caf8a'; fb.textContent = '✓ Correct!';
    qScore++;
  } else {
    btn.classList.add('wrong');
    fb.style.color = 'var(--red)'; fb.textContent = '✗ The correct answer has been highlighted.';
    opts.forEach(o => { if(o.textContent.trim() === correct) o.classList.add('correct'); });
  }
  document.getElementById('qNext').style.display = 'block';
}

function nextQuestion() { qIdx++; renderQuiz(); }

function renderWordForm() {
  const q = document.getElementById('wfSearchInput').value.toLowerCase();
  let rows = WORD_FORM_DATA.filter(d => {
    return !q || d.base.toLowerCase().includes(q) || d.forms.some(f => f.w.toLowerCase().includes(q));
  });
  const tb = document.getElementById('wfBody');
  if(!rows.length) { tb.innerHTML = `<tr><td colspan="2" class="no-results">No word formations found.</td></tr>`; return; }
  tb.innerHTML = rows.map(d =>
    `<tr>
      <td class="word-cell">${d.base}<span class="pos">${d.pos}</span><button class="speak-btn" onclick="speak('${d.base}', this)" title="Listen">🔊</button></td>
      <td class="wf-forms">${d.forms.map(f => `<span>${f.w}<em class="wf-pos">${f.pos}</em><button class="speak-btn" onclick="speak('${f.w}', this)" title="Listen">🔊</button></span>`).join('')}</td>
    </tr>`
  ).join('');
}

window._unit = 33;

function speak(text, btnEl) {
  if (btnEl) btnEl.classList.add('speak-loading');
  const done = () => { if (btnEl) btnEl.classList.remove('speak-loading'); };
  const fname = text.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') + '.mp3';
  const audio = new Audio();
  audio.preload = 'auto';
  audio.src = 'audio' + window._unit + '/' + fname;
  audio.addEventListener('canplaythrough', function() {
    audio.play().catch(done);
  }, { once: true });
  audio.addEventListener('ended', done, { once: true });
  audio.addEventListener('error', done, { once: true });
  audio.load();
}

let currentTheme = 'dark';
function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', currentTheme);
  document.getElementById('themeKnob').textContent = currentTheme === 'dark' ? '🌙' : '☀️';
}
</script>
