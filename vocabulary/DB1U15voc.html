<title>Unit 15 – Vocabulary: Buying and selling</title>

<script>
const DATA = [
  {w:"advertisement",pos:"n",def:"an announcement in a newspaper, on television, or on the Internet designed to persuade people to buy a product or service",ex:"I saw an advertisement for a new kind of camera.",category:"topic"},
  {w:"afford",pos:"v",def:"to have enough money to pay for something",ex:"I'm not sure how they're able to afford such expensive holidays.",category:"topic"},
  {w:"bargain",pos:"n",def:"something you buy that costs much less than normal",ex:"Her dress was a real bargain.",category:"topic"},
  {w:"brand",pos:"n",def:"a product or group of products that has its own name and is made by one particular company",ex:"I tried using a new brand of soap.",category:"topic"},
  {w:"catalogue",pos:"n",def:"a book that contains pictures of things that you can buy",ex:"Do you have a catalogue with all your products in it?",category:"topic"},
  {w:"change",pos:"n",def:"coins rather than notes",ex:"I'm sorry, I haven't got any change.",category:"topic"},
  {w:"coin",pos:"n",def:"a flat round piece of metal used as money",ex:"Put a coin into the slot.",category:"topic"},
  {w:"cost",pos:"v",def:"if something costs an amount of money, you need that amount to pay for it",ex:"A new computer costs around €1,000.",category:"topic"},
  {w:"cost",pos:"n",def:"the amount of money that you need in order to buy something or to do something",ex:"What's the total cost of these three pairs of shoes?",category:"topic"},
  {w:"customer",pos:"n",def:"a person or company that buys goods or services",ex:"Supermarkets use a variety of ways to attract customers.",category:"topic"},
  {w:"debt",pos:"n",def:"an amount of money that you owe",ex:"By this time we had debts of over €15,000.",category:"topic"},
  {w:"demand",pos:"v",def:"to say strongly that you want something",ex:"The teacher demanded an explanation for all the water on the floor.",category:"topic"},
  {w:"export",pos:"v",def:"to send a product to another country so that it can be sold there",ex:"Their flowers are exported around the world.",category:"topic"},
  {w:"fee",pos:"n",def:"money that you pay to a professional person or institution for their work",ex:"He will have to pay school fees of €2,000.",category:"topic"},
  {w:"fortune",pos:"n",def:"a large amount of money",ex:"They must have spent a fortune on flowers.",category:"topic"},
  {w:"import",pos:"v",def:"to buy a product from another country and bring it to your country",ex:"We import most of our coal from other countries.",category:"topic"},
  {w:"invest",pos:"v",def:"to use your money with the aim of making a profit from it",ex:"Banks invested €20 million in the scheme.",category:"topic"},
  {w:"obtain",pos:"v",def:"to get something that you want or need",ex:"She has to obtain her father's permission before she does anything.",category:"topic"},

  {w:"property",pos:"n",def:"the things that you own",ex:"The books are my personal property.",category:"topic"},
  {w:"purchase",pos:"v",def:"to buy something",ex:"She purchased a new lamp for her bedroom.",category:"topic"},
  {w:"purchase",pos:"n",def:"something that you buy",ex:"Her latest purchase was a long black coat.",category:"topic"},

  {w:"require",pos:"v",def:"to need someone or something",ex:"Working with these children requires a great deal of patience.",category:"topic"},
  {w:"sale",pos:"n",def:"an event or period of time during which a shop reduces the prices of some of its goods",ex:"The Easter sales start tomorrow.",category:"topic"},

  {w:"for rent",pos:"prep phr",def:"available to be rented",ex:"Do you have any rooms for rent?",category:"prepositional"},
  {w:"for sale",pos:"prep phr",def:"available to be bought",ex:"I'm afraid the pictures on the wall aren't for sale.",category:"prepositional"},
  {w:"in cash",pos:"prep phr",def:"using coins or notes rather than a card or cheque",ex:"The woman paid for the car in cash, which was unusual.",category:"prepositional"},
  {w:"in debt",pos:"prep phr",def:"owing money to someone",ex:"It can be very worrying to be in debt.",category:"prepositional"},
  {w:"in good/bad condition",pos:"prep phr",def:"in a good or bad state of repair",ex:"For sale: camping equipment, in good condition.",category:"prepositional"},
  {w:"wrong about/with",pos:"adj phr",def:"incorrect about or having a fault",ex:"I think Serena is wrong about Ian – he seems really nice to me.",category:"patterns"},

  {w:"buy sth from",pos:"v phr",def:"to get something by paying money to a seller",ex:"Where did you buy your new shoes from?",category:"patterns"},
  {w:"choose between",pos:"v phr",def:"to select one option from two or more possibilities",ex:"I love both my brother and my sister and I can't choose between them.",category:"patterns"},

  {w:"pay for",pos:"v phr",def:"to give money in exchange for something",ex:"We paid for dinner by credit card and left.",category:"patterns"},
  {w:"spend sth on",pos:"v phr",def:"to use money to buy or pay for something",ex:"What do you spend your pocket money on each week?",category:"patterns"},
  {w:"an advert(isement) for",pos:"n phr",def:"a public notice promoting a particular product or service",ex:"Have you seen that really funny advertisement for coffee?",category:"patterns"},
];

  {base:"add",pos:"v",forms:[{w:"addition",pos:"n"}]},

  {base:"value",pos:"n",forms:[{w:"valuable",pos:"adj"}]},

  unit: 15,
  topic: "Buying and selling",
  data: DATA,
  wordForms: WORD_FORM_DATA
});
