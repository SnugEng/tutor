name: Generate Present Forms Audio

on:
  workflow_dispatch:
    inputs:
      redo:
        description: "Какие слова переозвучить (через запятую, например: he does, I am). Пусто — только добавить недостающие"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install edge-tts
        run: pip install edge-tts
      - name: Generate MP3 files
        env:
          REDO: ${{ inputs.redo }}
        run: python3 grammar/gen_pres_audio.py
      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grammar/audio_pres/
          git diff --cached --quiet || git commit -m "Add audio files for present forms"
          git push
