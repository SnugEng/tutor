name: Generate All Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install edge-tts
        run: pip install edge-tts
      - name: Generate MP3 files
        run: python3 vocabulary/gen_all_audio.py
      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vocabulary/audio*/
          git diff --cached --quiet || git commit -m "Add audio files for all units"
          git push
