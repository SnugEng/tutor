name: Generate Irregular Verbs Audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install edge-tts
        run: pip install edge-tts
      - name: Generate MP3 files
        run: python3 grammar/gen_irr_audio.py
      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add grammar/audio_irr/
          git diff --cached --quiet || git commit -m "Add audio files for irregular verbs"
          git push
